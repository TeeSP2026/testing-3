ToUi();\n  getSheet_();\n}\n\nfunction getSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(SHEET_NAME);\n  if (!sh) {\n    sh = ss.insertSheet(SHEET_NAME);\n    sh.appendRow(HEADERS);\n    sh.setFrozenRows(1);\n    sh.getRange(1, 1, 1, HEADERS.length).setFontWeight('bold').setBackground('#DBF1EF');\n    sh.getRange('E:E').setNumberFormat('@'); // 电话保持文字，不会掉 0\n  }\n  return sh;\n}\n\n/** 防止有人输入 = + - @ 开头的内容变成公式 */\nfunction safe_(v, max) {\n  let s = String(v == null ? '' : v).trim().slice(0, max || 60);\n  if (/^[=+\\-@]/.test(s)) s = \"'\" + s;\n  return s;\n}\n\n/** 报名页按「提交」时执行 */\nfunction submitSignup(form) {\n  if (form && form.website) return { ok: true, ref: '-' }; // 防机器人\n  const name = safe_(form.name, 60);\n  const nick = safe_(form.nick, 30);\n  const phone = String(form.phone || '').trim();\n  const digits = phone.replace(/\\D/g, '');\n  const state = safe_(form.state, 40);\n  const town = safe_(form.town, 60);\n\n  if (!name) throw new Error('请填写姓名。');\n  if (digits.length < 9 || digits.length > 11) throw new Error('电话号码需要 9 到 11 位数字。');\n  if (!state) throw new Error('请选择州属。');\n  if (!town) throw new Error('请填写城镇或地区。');\n  if (!form.agree) throw new Error('请勾选同意，才能提交报名。');\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const sh = getSheet_();\n    const last = sh.getLastRow();\n    if (last > 1) {\n      const phones = sh.getRange(2, 5, last - 1, 1).getDisplayValues()\n        .map(r => String(r[0]).replace(/\\D/g, ''));\n      if (phones.indexOf(digits) !== -1) {\n        throw new Error('这个电话号码已经报名过了，我们会尽快联系你。');\n      }\n    }\n    const now = new Date();\n    const ref = 'W' + Utilities.formatDate(now, TZ, 'yyMMdd') + '-' + ('000' + last).slice(-3);\n    sh.appendRow([ref, Utilities.formatDate(now, TZ, 'yyyy-MM-dd HH:mm'), name, nick, phone, state, town, '待批准', '']);\n    return { ok: true, ref: ref };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** 菜单：导入系统后，把待批准的标记为已导入 */\nfunction markImported() {\n  const sh = getSheet_();\n  const last = sh.getLastRow();\n  if (last < 2) return;\n  const rng = sh.getRange(2, 8, last - 1, 1);\n  const vals = rng.getValues().map(r => [r[0] === '待批准' ? '已导入' : r[0]]);\n  rng.setValues(vals);\n  SpreadsheetApp.getUi().alert('已完成标记。');\n}\n<\/script>\n<script type=\"text/plain\" id=\"src-idx\">\n<!DOCTYPE html>\n<html lang=\"zh\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>会员报名<\/title>\n<style>\n  :root{--bg:#F1F5F7;--card:#fff;--ink:#17293A;--muted:#566878;--line:#D9E2E8;--blue:#1D5C93;--teal:#0F807B;--teal-soft:#DBF1EF;--red:#BE3D27;--side:#153A5A}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Inter\",\"Noto Sans SC\",system-ui,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;font-size:16px;line-height:1.55}\n  .top{background:var(--side);color:#fff;padding:22px 18px 70px}\n  .top .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}\n  .mark{width:44px;height:44px;border-radius:12px;background:var(--teal);display:grid;place-items:center;flex:none}\n  .top h1{margin:0;font-size:21px}\n  .top p{margin:2px 0 0;color:#C9DAE8;font-size:14px}\n  .wrap{max-width:520px;margin:-50px auto 40px;padding:0 14px}\n  .card{background:var(--card);border-radius:14px;padding:22px 18px;box-shadow:0 8px 24px rgba(10,30,50,.08);display:flex;flex-direction:column;gap:16px}\n  .perks{background:var(--teal-soft);color:#0B5F5B;border-radius:10px;padding:12px 14px;font-size:14.5px}\n  .perks b{display:block;margin-bottom:2px}\n  label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}\n  label small{font-weight:400;color:var(--muted)}\n  input,select{font:inherit;font-size:16px;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}\n  input:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}\n  .agree{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:14px;color:var(--muted)}\n  .agree input{width:22px;height:22px;flex:none;margin-top:1px}\n  button{height:52px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}\n  button:disabled{opacity:.6}\n  .err{color:var(--red);font-weight:600;font-size:14.5px}\n  .done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}\n  .tick{width:64px;height:64px;border-radius:50%;background:var(--teal-soft);display:grid;place-items:center}\n  .ref{font-size:24px;font-weight:700;color:var(--blue);letter-spacing:.03em}\n  .foot{text-align:center;color:var(--muted);font-size:13.5px;margin-top:14px}\n  .hp{position:absolute;left:-9999px}\n  [hidden]{display:none!important}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\"><div class=\"in\">\n  <div class=\"mark\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 21V11\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M12 12c0-4 3-7 8-7 0 5-3 8-8 7Z\" fill=\"#fff\"/><path d=\"M12 15c0-3-2.5-5.5-7-5.5 0 4 2.5 6 7 5.5Z\" fill=\"#fff\" opacity=\".75\"/><\/svg><\/div>\n  <div><h1><?= shop.name ?> 会员报名<\/h1><p>Daftar Ahli · 一分钟填好<\/p><\/div>\n<\/div><\/header>\n\n<main class=\"wrap\">\n  <form class=\"card\" id=\"f\" onsubmit=\"send(event)\">\n    <div class=\"perks\"><b>入会免费，购买即累积积分<\/b>每消费 RM 1 得 1 分，积分可随时兑换现金折扣。<\/div>\n    <label>姓名 Nama<input name=\"name\" required maxlength=\"60\" autocomplete=\"name\"><\/label>\n    <label>花名 <small>（可不填）大家平时怎么叫你<\/small><input name=\"nick\" maxlength=\"30\"><\/label>\n    <label>电话 Telefon<input name=\"phone\" required inputmode=\"tel\" placeholder=\"例如 012-345 6789\" autocomplete=\"tel\"><\/label>\n    <label>州属 Negeri<select name=\"state\" required>\n      <option value=\"\">请选择<\/option>\n      <option>Kedah<\/option><option>Perlis<\/option><option>Pulau Pinang<\/option><option>Perak<\/option>\n      <option>Selangor<\/option><option>Negeri Sembilan<\/option><option>Melaka<\/option><option>Johor<\/option>\n      <option>Pahang<\/option><option>Terengganu<\/option><option>Kelantan<\/option><option>Sabah<\/option><option>Sarawak<\/option>\n    <\/select><\/label>\n    <label>城镇 / 地区 Bandar<input name=\"town\" required maxlength=\"60\" placeholder=\"例如 Sekinchan\"><\/label>\n    <input class=\"hp\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\">\n    <label class=\"agree\"><input type=\"checkbox\" name=\"agree\" value=\"1\" required>我同意店家保存以上资料，只用于会员积分和联络。<\/label>\n    <div class=\"err\" id=\"err\" hidden><\/div>\n    <button id=\"btn\" type=\"submit\">提交报名<\/button>\n  <\/form>\n\n  <section class=\"card done\" id=\"ok\" hidden>\n    <div class=\"tick\"><svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12.5l4.5 4.5L19 7.5\" stroke=\"#0F807B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/div>\n    <h2 style=\"margin:0\">报名已收到<\/h2>\n    <p style=\"margin:0;color:var(--muted)\">你的报名编号<\/p>\n    <div class=\"ref\" id=\"ref\"><\/div>\n    <p style=\"margin:0;color:var(--muted)\">店家核实后就会开通会员。下次来买肥料时报上电话即可累积积分。<\/p>\n  <\/section>\n\n  <p class=\"foot\">有问题请联络 <?= shop.phone ?><\/p>\n<\/main>\n\n<script>\n  function send(e){\n    e.preventDefault();\n    var f=document.getElementById('f'), btn=document.getElementById('btn'), err=document.getElementById('err');\n    var data={name:f.name.value,nick:f.nick.value,phone:f.phone.value,state:f.state.value,town:f.town.value,agree:f.agree.checked,website:f.website.value};\n    err.hidden=true; btn.disabled=true; btn.textContent='提交中…';\n    var done=function(res){document.getElementById('ref').textContent=res.ref;f.hidden=true;document.getElementById('ok').hidden=false;window.scrollTo(0,0)};\n    var fail=function(x){err.textContent=(x&&x.message?x.message:'提交失败，请再试一次。').replace(/^Error:\\s*/,'');err.hidden=false;btn.disabled=false;btn.textContent='提交报名'};\n    if(window.google&&google.script&&google.script.run){\n      google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitSignup(data);\n    }else{ // 预览模式（不在 Apps Script 里）\n      setTimeout(function(){done({ref:'W261111-001（预览）'})},400);\n    }\n  }\n<\\/script>\n<\/body>\n<\/html>\n<\/script>\n\n<script>\n/* ============ Utilities ============ */\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst pad=(n,l)=>String(n).padStart(l,'0');\nfunction d0(d){const x=new Date(d);x.setHours(0,0,0,0);return x}\nfunction today0(){return d0(new Date())}\nfunction iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}\nfunction parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}\nfunction addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}\nfunction addYears(d,n){const x=new Date(d);x.setFullYear(x.getFullYear()+n);return x}\nfunction diffDays(a,b){return Math.round((d0(a)-d0(b))/864e5)}\nconst RM=n=>'RM '+Number(n).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});\nconst N=n=>Number(n).toLocaleString('en-MY');\nfunction nowStamp(){const d=new Date();return iso(d)+' '+pad(d.getHours(),2)+':'+pad(d.getMinutes(),2)}\nfunction fmtD(s){return s?s.split('-').reverse().join('/'):'-'}\n\nconst LANG=\"zh\";const MON=[\"1月\", \"2月\", \"3月\", \"4月\", \"5月\", \"6月\", \"7月\", \"8月\", \"9月\", \"10月\", \"11月\", \"12月\"];const DT={\"1 L / 瓶\": {\"en\": \"1 L / bottle\", \"ms\": \"1 L / botol\"}, \"1 kg / 包\": {\"en\": \"1 kg / pack\", \"ms\": \"1 kg / pek\"}, \"100 ml / 瓶\": {\"en\": \"100 ml / bottle\", \"ms\": \"100 ml / botol\"}, \"25 kg / 包\": {\"en\": \"25 kg / bag\", \"ms\": \"25 kg / beg\"}, \"4 L / 桶\": {\"en\": \"4 L / can\", \"ms\": \"4 L genalan (tidak wajib)\", \"bday\": \"Tarikh lahir (tidak wajib)\", \"addr\": \"Alamat (tidak wajib)\", \"state\": \"Negeri\", \"town\": \"Bandar / Kawasan\", \"ref\": \"Dirujuk oleh (tidak wajib)\", \"consent\": \"Persetujuan\", \"consentTxt\": \"Saya bersetuju kedai menyimpan butiran di atas untuk mata ahli dan perhubungan sahaja.\", \"phoneHelp\": \"cth. 012-345 6789\", \"icHelp\": \"cth. 850312-10-5678\", \"refHelp\": \"Nama atau telefon ahli yang merujuk anda\", \"desc\": \"Selamat datang ke keahlian {shop}! Percuma, kumpul mata setiap pembelian dan guna mata sebagai diskaun tunai.\", \"evLine\": \"Aktiviti: {event} ({start} hingga {end})\", \"confirm\": \"Terima kasih! Keahlian anda akan diaktifkan selepas kami menyemak.\", \"title\": \"Pendaftaran Ahli {shop}\", \"resp\": \" (Respons)\", \"log1\": \"Pautan borang untuk pelanggan: \", \"log2\": \"Ubah borang: \", \"log3\": \"Helaian respons: \"}, \"en\": {\"name\": \"Name\", \"nick\": \"Nickname (optional)\", \"phone\": \"Phone number\", \"ic\": \"IC number / MyKad (optional)\", \"bday\": \"Date of birth (optional)\", \"addr\": \"Address (optional)\", \"state\": \"State\", \"town\": \"Town / Area\", \"ref\": \"Referred by (optional)\", \"consent\": \"Consent\", \"consentTxt\": \"I agree the shop may keep the details above, used only for member points and contact.\", \"phoneHelp\": \"e.g. 012-345 6789\", \"icHelp\": \"e.g. 850312-10-5678\", \"refHelp\": \"Name or phone of the member who referred you\", \"desc\": \"Welcome to {shop} membership! Free to join. Earn points on every purchase and use them as a cash discount.\", \"evLine\": \"Event: {event} ({start} to {end})\", \"confirm\": \"Thank you! Your membership will be activated after we check it.\", \"title\": \"{shop} Member Sign-up\", \"resp\": \" (Responses)\", \"log1\": \"Form link for customers: \", \"log2\": \"Edit form: \", \"log3\": \"Response sheet: \"}};\nfunction sgaInit(){if(!UI.sga)UI.sga={lang:'tri',ev:'',title:'',f:{nick:1,ic:1,bday:1,addr:1,state:1,town:1,ref:1}};return UI.sga}\nfunction fqT(k){const o=sgaInit();if(o.lang==='tri')return FQ.zh[k]+' / '+FQ.ms[k]+' / '+FQ.en[k];return FQ[o.lang][k]}\nfunction fqTL(k,nl){const o=sgaInit();if(o.lang==='tri')return [FQ.zh[k],FQ.ms[k],FQ.en[k]].join(nl);return FQ[o.lang][k]}\nfunction sgaEv(){const o=sgaInit();return o.ev&&(S.events||[]).find(e=>e.id===o.ev)}\nfunction sgaFill(t,ev){return String(t).replace(/\\{shop\\}/g,COMPANY.name).replace(/\\{event\\}/g,ev?ev.name:'').replace(/\\{start\\}/g,ev?fmtD(ev.start):'').replace(/\\{end\\}/g,ev?fmtD(ev.end):'')}\nfunction sgaTitle(){const o=sgaInit(),ev=sgaEv();if(o.title.trim())return o.title.trim();const L=o.lang==='tri'?'zh':o.lang;return sgaFill(FQ[L].title,ev)+(ev?' · '+ev.name:'')}\nfunction genFormScript(){const o=sgaInit(),ev=sgaEv(),J=JSON.stringify,f=o.f;\n const desc=sgaFill(fqTL('desc','\\n'),ev)+(ev?'\\n\\n'+sgaFill(fqTL('evLine','\\n'),ev):'');\n const L=[];const add=s=>L.push(s);\n add('/**');add(' * '+sgaTitle());add(' * Google Apps Script → createMemberForm → Run');add(' */');\n add('function createMemberForm() {');\n add('  var title = '+J(sgaTitle())+';');\n add('  var form = FormApp.create(title);');\n add('  form.setDescription('+J(desc)+');');\n add('  form.setConfirmationMessage('+J(fqTL('confirm','\\n'))+');');\n add('  form.setLimitOneResponsePerUser(false);');\n add('  form.setCollectEmail(false);');\n add('  form.addTextItem().setTitle('+J(fqT('name'))+').setRequired(true);');\n if(f.nick)add('  form.addTextItem().setTitle('+J(fqT('nick'))+');');\n add('  form.addTextItem().setTitle('+J(fqT('phone'))+').setHelpText('+J(fqT('phoneHelp'))+').setRequired(true)');\n add('    .setValidation(FormApp.createTextValidation().requireTextMatchesPattern(\"^[0-9+ -]{9,16}$\").setHelpText('+J(fqT('phoneHelp'))+').build());');\n if(f.ic){add('  form.addTextItem().setTitle('+J(fqT('ic'))+').setHelpText('+J(fqT('icHelp'))+')');add('    .setValidation(FormApp.createTextValidation().requireTextMatchesPattern(\"^[0-9]{6}[- ]?[0-9]{2}[- ]?[0-9]{4}$\").setHelpText('+J(fqT('icHelp'))+').build());')}\n if(f.bday)add('  form.addDateItem().setTitle('+J(fqT('bday'))+').setIncludesYear(true);');\n if(f.addr)add('  form.addParagraphTextItem().setTitle('+J(fqT('addr'))+');');\n if(f.state)add('  form.addListItem().setTitle('+J(fqT('state'))+').setChoiceValues('+J(STATES)+');');\n if(f.town)add('  form.addTextItem().setTitle('+J(fqT('town'))+');');\n if(f.ref)add('  form.addTextItem().setTitle('+J(fqT('ref'))+').setHelpText('+J(fqT('refHelp'))+');');\n add('  form.addCheckboxItem().setTitle('+J(fqT('consent'))+').setChoiceValues(['+J(fqTL('consentTxt',' / '))+']).setRequired(true);');\n add('  var ss = SpreadsheetApp.create(title + '+J(o.lang==='tri'?FQ.zh.resp:FQ[o.lang].resp)+');');\n add('  form.setDestination(FormApp.DestinationType.SPREADSHEET, ss.getId());');\n add('  try { form.setPublished(true); } catch (e) { Logger.log(\"\\u26a0 \\u8bf7\\u5230\\u8868\\u5355\\u6309\\u53f3\\u4e0a\\u89d2\\u300c\\u53d1\\u5e03\\u300d / Tekan Terbitkan / Press Publish\"); }');add('  form.setAcceptingResponses(true);');add('  var url = form.getPublishedUrl();');\n add('  try { url = form.shortenFormUrl(url); } catch (e) {}');\n const LL=o.lang==='tri'?'zh':o.lang;\n add('  Logger.log('+J(FQ[LL].log1)+' + url);');\n add('  Logger.log('+J(FQ[LL].log2)+' + form.getEditUrl());');\n add('  Logger.log('+J(FQ[LL].log3)+' + ss.getUrl());');\n add('}');\n return L.join('\\n')}\nfunction sgaSet(k,v){const o=sgaInit();if(k==='f'){o.f[v]=o.f[v]?0:1}else o[k]=v;const t=$('#sga-code');if(t)t.value=genFormScript();if(k!=='title'){const ti=$('#sga-title');if(ti&&!o.title)ti.placeholder=sgaTitle()}}\nfunction sgAuto(){const o=sgaInit();const evs=(S.events||[]).filter(e=>evStatus(e)!=='done');\n const qs=[['nick','花名'],['ic','身份证号码'],['bday','生日'],['addr','地址'],['state','州属'],['town','城镇 / 地区'],['ref','介绍人']];\n return '<div class=\"cols\"><section class=\"panel\"><h2>表单设定<\/h2>'+\n '<label class=\"f\">表单语言<select onchange=\"sgaSet(\\'lang\\',this.value)\"><option value=\"tri\"'+(o.lang==='tri'?' selected':'')+'>三语（华语 / BM / English）<\/option><option value=\"zh\"'+(o.lang==='zh'?' selected':'')+'>华语<\/option><option value=\"ms\"'+(o.lang==='ms'?' selected':'')+'>Bahasa Melayu<\/option><option value=\"en\"'+(o.lang==='en'?' selected':'')+'>English<\/option><\/select><\/label>'+\n '<label class=\"f\">配合活动（可不选）<select onchange=\"sgaSet(\\'ev\\',this.value)\"><option value=\"\">不配合活动<\/option>'+evs.map(e=>'<option value=\"'+e.id+'\"'+(o.ev===e.id?' selected':'')+'>'+esc(e.name)+'（'+fmtD(e.start)+' – '+fmtD(e.end)+'）<\/option>').join('')+'<\/select><\/label>'+\n '<label class=\"f\">表单标题<input id=\"sga-title\" value=\"'+esc(o.title)+'\" placeholder=\"'+esc(sgaTitle())+'\" oninput=\"sgaSet(\\'title\\',this.value)\"><\/label>'+\n '<div class=\"f\"><span>要问哪些资料<\/span><div class=\"sga-q\">'+qs.map(q=>'<label><input type=\"checkbox\"'+(o.f[q[0]]?' checked':'')+' onchange=\"sgaSet(\\'f\\',\\''+q[0]+'\\')\">'+q[1]+'<\/label>').join('')+'<\/div><span class=\"small muted\">姓名和电话一定会问<\/span><\/div><\/section>'+\n '<section class=\"panel\"><h2>怎么用（第一次约 5 分钟）<\/h2><ol class=\"rules\"><li>在左边选好语言、活动和要问的资料，按“复制程序”。<\/li>'+\n '<li>用店里的 Google 帐号打开 <a href=\"https://script.google.com/home/projects/create\" target=\"_blank\" rel=\"noopener\"><b>script.google.com<\/b><\/a>，按“新项目”。<\/li>'+\n '<li>把编辑器里原本的内容全部删掉，贴上程序，按储存。<\/li><li>上方选 <b>createMemberForm<\/b>，按“运行”。第一次会要求授权：选你的帐号 → “高级” → “前往（不安全）” → “允许”。这是你自己的程序，所以 Google 会这样提示。<\/li>'+\n '<li>运行完，下方“执行日志”会出现 3 个链接：给客户填的表单、修改表单、回复表格。表单和表格会自动存在你的 Google Drive。<\/li><li>把“给客户填的表单链接”贴到下面的方框，按“生成二维码”，就有海报可以打印。<\/li>'+\n '<li>活动结束后：打开回复表格 → 文件 → 下载 → CSV → 到 <a href=\"#import\">导入 / 导出<\/a> 选择文件导入。栏位会自动对上，有填介绍人的会自动给介绍奖励。<\/li><\/ol><p class=\"small muted\">每个活动可以生成一份新的表单，旧的表单也可以继续用。<\/p><\/section><\/div>'+\n '<section class=\"panel\"><div class=\"panel-head\"><h2>自动生成的程序<\/h2><button class=\"btn btn-blue\" onclick=\"copyStr($(\\'#sga-code\\').value);toast(\\'程序已复制\\')\">复制程序<\/button><\/div><textarea id=\"sga-code\" class=\"code\" rows=\"14\" readonly spellcheck=\"false\">'+esc(genFormScript())+'<\/textarea><\/section>'+\n qrPanel('auto','贴上自动生成的表单链接','https://forms.gle/…')}\n\nfunction pageOf(list,k,sig){const sz=S.settings['ps_'+k]||20;if(UI['sig_'+k]!==sig){UI['sig_'+k]=sig;UI['pg_'+k]=1}const pages=Math.max(1,Math.ceil(list.length/sz));const p=Math.min(Math.max(1,UI['pg_'+k]||1),pages);UI['pg_'+k]=p;\n return {items:list.slice((p-1)*sz,p*sz),p:p,pages:pages,sz:sz,from:list.length?(p-1)*sz+1:0,to:Math.min(p*sz,list.length)}}\nfunction pagerTop(k,total,pg,unit){return '<div class=\"pager-top\"><span class=\"small muted\">共 '+N(total)+' '+unit+' · 显示第 '+pg.from+'–'+pg.to+' '+unit+'<\/span><label class=\"pg-size small muted\">每页<select onchange=\"setPS(\\''+k+'\\',this.value)\">'+[10,20,30,50,100].map(n=>'<option value=\"'+n+'\"'+(n===pg.sz?' selected':'')+'>'+n+'<\/option>').join('')+'<\/select>'+unit+'<\/label><\/div>'}\nfunction pagerNav(k,pg){if(pg.pages<=1)return '';const P=pg.p,L=pg.pages,set=new Set([1,L,P-1,P,P+1,P-2,P+2].filter(x=>x>=1&&x<=L));const nums=[...set].sort((a,b)=>a-b);let h='',last=0;\n nums.forEach(n=>{if(n-last>1)h+='<span class=\"pg-gap\">…<\/span>';h+='<button type=\"button\" class=\"pg-n'+(n===P?' on':'')+'\"'+(n===P?' aria-current=\"page\"':'')+' onclick=\"goPage(\\''+k+'\\','+n+')\">'+n+'<\/button>';last=n});\n return '<nav class=\"pager\" aria-label=\"分页\"><button type=\"button\" class=\"pg-n pg-step\"'+(P<=1?' disabled':'')+' onclick=\"goPage(\\''+k+'\\','+(P-1)+')\">上一页<\/button>'+h+'<button type=\"button\" class=\"pg-n pg-step\"'+(P>=L?' disabled':'')+' onclick=\"goPage(\\''+k+'\\','+(P+1)+')\">下一页<\/button><\/nav>'}\nfunction goPage(k,p){UI['pg_'+k]=p;(k==='m'?drawMembers:drawSales)();const el=$(k==='m'?'#mtable':'#stable');if(el)el.scrollIntoView({block:'start'})}\nfunction setPS(k,v){S.settings['ps_'+k]=Number(v)||20;UI['pg_'+k]=1;save();(k==='m'?drawMembers:drawSales)()}\n\n ns\"><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'redemptions\\')\">导出 CSV<\/button><button class=\"btn btn-orange\" onclick=\"redeemForm()\">＋ 兑换积分<\/button><\/div><\/div>'+\n '<section class=\"panel\"><h2>各等级每分价值<\/h2><div class=\"calc\">'+S.tiers.map(t=>'<div class=\"tbox\" style=\"--tc:var('+t.color+')\"><span>'+tierTag(t)+'<\/span><b>RM '+t.rate.toFixed(3)+'<\/b><span>1,000 分 = '+RM(1000*t.rate)+'<\/span><\/div>').join('')+'<\/div><\/section>'+\n '<section class=\"panel\"><div class=\"panel-head\"><h2>兑换记录<\/h2><span class=\"small muted\">共 '+list.length+' 笔 · 合计 '+RM(tot)+'<\/span><\/div>'+((S.redemptions.length)?tierLegend('r'):'')+(list.length?'<div class=\"tbl-wrap\"><table class=\"t-tier\"><thead><tr><th>单号<\/th><th>日期<\/th><th>会员<\/th><th>等级<\/th><th class=\"r\">积分<\/th><th class=\"r\">兑换金额<\/th><th>经办<\/th><\/tr><\/thead><tbody>'+list.slice(0,300).map(r=>{const T=rTier(r);return '<tr class=\"trt\" style=\"--tc:var('+T.color+')\"><td class=\"nw\">'+r.id+'<\/td><td class=\"nw\">'+fmtD(r.date)+'<\/td><td class=\"nw\"><a href=\"javascript:void 0\" onclick=\"memberDetail(\\''+r.mid+'\\')\">'+esc(mName(r.mid))+'<\/a><\/td><td>'+tierTag(T)+'<\/td><td class=\"r\">'+N(r.pts)+'<\/td><td class=\"r\">'+RM(r.cash)+'<\/td><td>'+esc(USERS[r.by]?D(USERS[r.by].name):r.by)+'<\/td><\/tr>'}).join('')+'<\/tbody><\/table><\/div>':'<div class=\"empty\">还没有兑换记录。<\/div>')+'<\/section>';\n}\nfunction redeemForm(mid){\n const m=mid?S.members.find(x=>x.id===mid):null;\n openModal('兑换积分',memberOptions()+'<label class=\"f\">会员<input id=\"rm\" list=\"mlist\" value=\"'+(m?esc(dispId(m.id)+' · '+m.name+' · '+m.phone):'')+'\" oninput=\"calcRedeem()\"><\/label><label class=\"f\">兑换积分<input id=\"rp\" type=\"number\" min=\"1\" step=\"1\" oninput=\"calcRedeem()\"><\/label><button class=\"btn btn-ghost\" type=\"button\" onclick=\"redeemAll()\">兑换全部可用积分<\/button><div class=\"calc\" id=\"rcalc\"><\/div><div id=\"rerr\" class=\"err\" hidden><\/div>',\n '<button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消<\/button><button class=\"btn btn-orange\" onclick=\"addRedeem()\">确认兑换<\/button>');\n calcRedeem();\n}\nfunction redeemAll(){const id=midFrom($('#rm').value);if(!id)return;const c=computeAll()[id];if(c){$('#rp').value=c.avail;calcRedeem()}}\nfunction calcRedeem(){\n const id=midFrom($('#rm').value),m=id&&S.members.find(x=>x.id===id);\n if(!m){$('#rcalc').innerHTML='<div><span>请先选择会员<\/span><b>-<\/b><\/div>';return}\n const c=computeAll()[m.id],p=Math.max(0,Math.floor(Number($('#rp').value)||0));\n $('#rcalc').innerHTML='<div><span>等级<\/span><b style=\"font-size:16px\">'+tierTag(c.tier)+'<\/b><\/div><div><span>可用积分<\/span><b>'+N(c.avail)+'<\/b><\/div><div><span>每分价值<\/span><b>RM '+c.tier.rate.toFixed(3)+'<\/b><\/div><div><span>兑换金额<\/span><b style=\"color:var(--orange)\">'+RM(p*c.tier.rate)+'<\/b><\/div>';\n}\nfunction addRedeem(){\n const err=t=>{const e=$('#rerr');e.textContent=t;e.hidden=false};\n const id=midFrom($('#rm').value),m=id&&S.members.find(x=>x.id===id);if(!m)return err('请从列表选择会员。');\n const c=computeAll()[m.id];if(c.status==='expired')return err('会员已过期，请先续期才能兑换。');\n const p=Math.floor(Number($('#rp').value)||0);if(p<1)return err('请输入要兑换的积分。');if(p>c.avail)return err('积分不足，最多可兑换 '+N(c.avail)+' 分。');\n const rec=doRedeem(m.id,p,iso(today0()),session.user);save();closeModal();render();toast('已兑换 '+N(p)+' 分，付给会员 '+RM(rec.cash));\n}\n\n/* ============ Products ============ */\nfunction vProducts(){\n const isF=UI.ptab==='fert';let body='';\n if(isF){Object.keys(FERT_TYPES).forEach(k=>{const ps=S.products.filter(p=>p.kind==='fert'&&p.cat===k);if(!ps.length)return;body+=group(D(k),D(FERT_TYPES[k]),ps)})}\n else{Object.keys(PEST_GRADES).forEach(k=>{const ps=S.products.filter(p=>p.kind==='pest'&&p.grade===k);if(!ps.length)return;body+=group(D(k),D(PEST_GRADES[k]),ps)});body+='<p class=\"note\">使用农药前请阅读产品标签，依照建议剂量施用并穿戴防护用具。<\/p>'}\n return '<div class=\"page-head\"><div><h1>产品介绍<\/h1><p>肥料按施肥类型分类，农药按产品等级分类。<\/p><\/div>'+(isAdmin()?'<div class=\"actions\"><button class=\"btn btn-blue\" onclick=\"productForm()\">＋ 新增产品<\/button><\/div>':'')+'<\/div><div class=\"tabs\" role=\"tablist\"><button class=\"tab'+(isF?' on':'')+'\" onclick=\"UI.ptab=\\'fert\\';render()\">肥料（按施肥类型）<\/button><button class=\"tab'+(!isF?' on':'')+'\" onclick=\"UI.ptab=\\'pest\\';render()\">农药（按等级）<\/button><\/div><section class=\"panel\" style=\"gap:26px\">'+body+'<\/section>';\n}\nfunction group(title,desc,ps){return '<div class=\"prod-group\"><div class=\"prod-group-head\"><h2>'+esc(title)+'<\/h2><span class=\"muted small\">'+esc(desc)+'<\/span><\/div><div class=\"prod-list\">'+ps.map(p=>'<div class=\"prod\">'+prodImg(p)+'<div class=\"p-top\"><h3>'+esc(D(p.name))+'<\/h3><span class=\"price\">'+RM(p.price)+'<\/span><\/div><div class=\"small muted\">'+esc(D(p.spec))+(p.kind==='pest'?' · <span class=\"pill info\">'+esc(D(p.cat))+'<\/span>':'')+'<\/div><p class=\"small\">'+esc(D(p.desc))+'<\/p><p class=\"small\"><b>适用：<\/b>'+esc(D(p.crops))+'<\/p>'+(isAdmin()?photoActs(p):'')+'<\/div>').join('')+'<\/div><\/div>'}\nfunction productForm(){\n PHOTO_DRAFT=null;openModal('新增产品','<div class=\"grid2\"><label class=\"f\">种类<select id=\"pk\" onchange=\"pkChange()\"><option value=\"fert\">肥料<\/option><option value=\"pest\">农药<\/option><\/select><\/label><label class=\"f\" id=\"pcatL\">施肥类型<select id=\"pc\">'+Object.keys(FERT_TYPES).map(k=>'<option value=\"'+k+'\">'+D(k)+'<\/option>').join('')+'<\/select><\/label><label class=\"f\" id=\"pgL\" hidden>等级<select id=\"pg\">'+Object.keys(PEST_GRADES).map(k=>'<option value=\"'+k+'\">'+D(k)+'<\/option>').join('')+'<\/select><\/label><label class=\"f\">名称<input id=\"pn\"><\/label><label class=\"f\">规格<input id=\"ps\" placeholder=\"例如：50 kg / 包\"><\/label><label class=\"f\">价格 (RM)<input id=\"pp\" type=\"number\" min=\"0\" step=\"0.01\"><\/label><label class=\"f\">适用作物<input id=\"pcr\"><\/label><\/div><label class=\"f\">说明<textarea id=\"pd\" rows=\"2\"><\/textarea><\/label><div class=\"f\"><span>照片<\/span><div class=\"ph-pick\"><div id=\"phPrev\" class=\"ph-prev\">没有照片<\/div><div class=\"ph-btns\"><label class=\"btn btn-ghost btn-sm\">选择照片<input type=\"file\" accept=\"image/*\" hidden onchange=\"pickPhoto(this)\"><\/label><button type=\"button\" class=\"btn btn-ghost btn-sm\" id=\"phDel\" hidden onclick=\"clearPhoto()\">移除照片<\/button><span class=\"small muted\">可不放；照片会自动缩小，方便储存。<\/span><\/div><\/div><\/div><div id=\"perr\" class=\"err\" hidden><\/div>',\n '<button class=\"btn btn-ghost\" onclick=\"closeModal()\">取消<\/button><button class=\"btn btn-blue\" onclick=\"addProduct()\">保存产品<\/button>');\n}\nfunction editProduct(id){const p=S.products.find(x=>x.id===id);if(!p)return;productForm();\n const h=$('#modal-root .modal-head h2');if(h)h.textContent='修改产品';const dlg=$('#modal-root .modal');if(dlg)dlg.setAttribute('aria-label','修改产品');\n $('#pk').value=p.kind;pkChange();$('#pc').value=p.cat;if(p.kind==='pest'&&p.grade)$('#pg').value=p.grade;\n $('#pn').value=D(p.name);$('#ps').value=D(p.spec||'');$('#pp').value=p.price;$('#pcr').value=p.crops==='-'?'':D(p.crops||'');$('#pd').value=D(p.desc||'');\n PHOTO_DRAFT=IMGS[id]||null;if(PHOTO_DRAFT){$('#phPrev').innerHTML='<img src=\"'+PHOTO_DRAFT+'\" alt=\"\">';$('#phDel').hidden=false}\n const b=$('#modal-root .modal-foot .btn-blue');if(b){b.textContent='保存修改';b.onclick=function(){saveProduct(id)}};$('#pn').focus()}\nfunction saveProduct(id){const p=S.products.find(x=>x.id===id);if(!p)return;const n=$('#pn').value.trim(),pr=Number($('#pp').value);\n if(!n||!(pr>0)){const e=$('#perr');e.textContent='请填写名称和价格。';e.hidden=false;return}\n const keep=(o,v)=>(o!=null&&v===D(o))?o:v,k=$('#pk').value,cr=$('#pcr').value.trim();\n p.kind=k;p.cat=$('#pc').value;p.grade=k==='pest'?$('#pg').value:undefined;p.name=keep(p.name,n);p.spec=keep(p.spec,$('#ps').value.trim());p.price=pr;p.crops=cr?keep(p.crops,cr):'-';p.desc=keep(p.desc,$('#pd').value.trim());\n if((IMGS[id]||null)!==PHOTO_DRAFT)setImg(id,PHOTO_DRAFT);PHOTO_DRAFT=null;\n UI.ptab=k;log('\\u4fee\\u6539\\u4ea7\\u54c1',n+' '+RM(pr));save();closeModal();render();toast('产品已更新')}\nfunction pkChange(){const f=$('#pk').value==='fert';$('#pgL').hidden=f;$('#pcatL').firstChild.textContent=f?'施肥类型':'农药类别';$('#pc').innerHTML=(f?Object.keys(FERT_TYPES):['\\u9664\\u8349\\u5242','\\u6740\\u866b\\u5242','\\u6740\\u83cc\\u5242']).map(k=>'<option value=\"'+k+'\">'+D(k)+'<\/option>').join('')}\nfunction addProduct(){const n=$('#pn').value.trim(),pr=Number($('#pp').value);if(!n||!(pr>0)){const e=$('#perr');e.textContent='请填写名称和价格。';e.hidden=false;return}\n const k=$('#pk').value,id=(k==='fert'?'F':'P')+pad(S.products.filter(p=>p.kind===k).length+1,2)+'x'+Date.now().toString().slice(-3);\n S.products.push({id,kind:k,cat:$('#pc').value,grade:k==='pest'?$('#pg').value:undefined,name:n,spec:$('#ps').value.trim(),price:pr,crops:$('#pcr').value.trim()||'-',desc:$('#pd').value.trim()});\n if(PHOTO_DRAFT){setImg(id,PHOTO_DRAFT);PHOTO_DRAFT=null}UI.ptab=k;log('\\u65b0\\u589e\\u4ea7\\u54c1',n+' '+RM(pr));save();closeModal();render();toast('已新增产品')}\n\n/* ============ Tiers ============ */\nfunction vTiers(){\n const a=isAdmin();const cnt=id=>S.members.filter(m=>C[m.id].status!=='expired'&&C[m.id].tier.id===id).length;\n return '<div class=\"page-head\"><div><h1>等级与积分<\/h1><p>'+(a?'修改后按“保存设定”，所有会员的等级会立即重新计算。':'只有管理员可以修改设定。')+'<\/p><\/div><\/div>'+tierCards(cnt)+'<section class=\"panel\"><div class=\"tbl-wrap\"><table class=\"t-tier t-tiers\"><thead><tr><th>等级<\/th><th class=\"r\">累计消费门槛 (RM)<\/th><th class=\"r\">每分价值 (RM)<\/th><th class=\"r\">1,000 分可兑<\/th><th class=\"r\">有效会员<\/th><\/tr><\/thead><tbody>'+\n S.tiers.map((t,i)=>'<tr class=\"trt\" style=\"--tc:var('+t.color+')\"><td><span class=\"tcell\"><span class=\"tc-badge\">'+tierIco(t)+'<\/span><span><b>'+esc(D(t.name))+'<\/b><small>Lv.'+(i+1)+'<\/small><\/span><\/span><\/td><td class=\"r\">'+(a&&i>0?'<input id=\"tmin'+i+'\" type=\"number\" min=\"0\" step=\"100\" value=\"'+t.min+'\" style=\"max-width:130px;text-align:right\">':N(t.min))+'<\/td><td class=\"r\">'+(a?'<input id=\"trate'+i+'\" type=\"number\" min=\"0\" step=\"0.001\" value=\"'+t.rate+'\" style=\"max-width:110px;text-align:right\">':t.rate.toFixed(3))+'<\/td><td class=\"r\">'+RM(1000*t.rate)+'<\/td><td class=\"r\">'+cnt(t.id)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>'+\n '<div class=\"grid3\"><label class=\"f\">每消费 RM 1 可得积分<input id=\"earn\" type=\"number\" min=\"0\" step=\"0.1\" value=\"'+S.settings.earn+'\"'+(a?'':' disabled')+'><\/label><label class=\"f\">介绍新会员奖励积分<input id=\"refpts\" type=\"number\" min=\"0\" step=\"1\" value=\"'+(S.settings.refPts||0)+'\"'+(a?'':' disabled')+'><\/label><\/div>'+(a?'<div class=\"actions\"><button class=\"btn btn-blue\" onclick=\"saveTiers()\">保存设定<\/button><\/div>':'')+'<\/section>'+\n '<section class=\"panel\"><h2>规则<\/h2><ul class=\"rules\"><li>每笔购买的积分自购买日起 <b>2 年<\/b>有效，到期自动作废。<\/li><li>会员资格自入会（或续期）日起 <b>2 年<\/b>有效；过期后不能累积或兑换积分，续期即可恢复。<\/li><li>到期前 <b>3 个月<\/b>，仪表板与会员名单会以橙色醒目提示。<\/li><li>会员随时可兑换积分，系统先扣除最早到期的积分。<\/li><li>等级按累计消费自动计算；管理员可在会员资料里手动指定等级。<\/li><li>会员介绍新会员入会，介绍人可得 <b>'+N(S.settings.refPts||0)+' 分<\/b>，入会时立即给（设成 0 就不给）。<\/li><\/ul><\/section>';\n}\nfunction saveTiers(){\n const old=JSON.stringify(S.tiers.map(t=>[t.min,t.rate]))+S.settings.earn;\n S.tiers.forEach((t,i)=>{if(i>0){const v=Number($('#tmin'+i).value);if(v>=0)t.min=v}const r=Number($('#trate'+i).value);if(r>=0)t.rate=r});\n const e=Number($('#earn').value);if(e>=0)S.settings.earn=e;const rp=Number($('#refpts').value);if(rp>=0)S.settings.refPts=Math.round(rp);\n for(let i=1;i<S.tiers.length;i++){if(S.tiers[i].min<=S.tiers[i-1].min){toast('门槛必须由低到高排列，请再检查。');S.tiers.forEach((t,j)=>{const o=JSON.parse(old.slice(0,old.lastIndexOf(']')+1))[j];t.min=o[0];t.rate=o[1]});render();return}}\n log('\\u4fee\\u6539\\u7b49\\u7ea7\\u8bbe\\u5b9a',S.tiers.map(t=>t.name+' ≥'+t.min+' @'+t.rate).join('；')+'；每 RM1 得 '+S.settings.earn+' 分');save();render();toast('设定已保存');\n}\n\n/* ============ Import / Export ============ */\nconst TEMPLATE='姓名,花名,电话,州属,城镇,入会日期(YYYY-MM-DD)\\n陈大文,阿文,012-555 1234,Selangor,Sekinchan,2026-01-15\\nAminah binti Salleh,,013-444 9876,Kedah,Yan,2025-11-02';\nfunction vImport(){\n const a=isAdmin(),s=S.settings;\n let status;\n if(!s.firstImportDone)status='<span class=\"pill info\">尚未进行首次导入<\/span> 首次导入必须由管理员核实后才会生效。';\n else if(s.importLocked)status='<span class=\"pill line\">已锁定<\/span> 首次导入已完成。之后只有管理员可以导入'+(a?'，或点“允许职员再导入一次”。':'，如需导入请联系管理员。');\n else status='<span class=\"pill ok\">已开放一次<\/span> 管理员已允许职员再提交一次导入，同样需要管理员核实。';\n const canSubmit=a||!s.importLocked;\n const pend=S.pendingImports.map(p=>'<tr><td class=\"nw\">'+esc(p.at)+'<\/td><td>'+esc(USERS[p.by]?D(USERS[p.by].name):p.by)+'<\/td><td class=\"r\">'+p.rows.length+'<\/td><td class=\"r nw\">'+(a?'<button class=\"btn btn-ghost btn-sm\" onclick=\"viewPending(\\''+p.id+'\\')\">查看<\/button> <button class=\"btn btn-teal btn-sm\" onclick=\"approveImport(\\''+p.id+'\\')\">核实并导入<\/button> <button class=\"btn btn-ghost btn-sm\" style=\"color:var(--red)\" onclick=\"rejectImport(\\''+p.id+'\\')\">退回<\/button>':'<span class=\"pill soon\">等待管理员核实<\/span>')+'<\/td><\/tr>').join('');\n return '<div class=\"page-head\"><div><h1>导入 / 导出<\/h1><p>用模板批量导入会员；导出 CSV 可用 Excel 打开。<\/p><\/div><\/div>'+\n '<section class=\"panel\"><h2>导出 CSV<\/h2><div class=\"actions\"><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'members\\')\">会员名单<\/button><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'sales\\')\">销售记录<\/button><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'redemptions\\')\">兑换记录<\/button><\/div><p class=\"small muted\">会显示 CSV 内容，按“复制”后贴进 Excel 或记事本，存成 .csv 即可。<\/p><\/section>'+\n (S.pendingImports.length?'<section class=\"panel\"><h2>待核实的导入<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>提交时间<\/th><th>提交人<\/th><th class=\"r\">笔数<\/th><th><\/th><\/tr><\/thead><tbody>'+pend+'<\/tbody><\/table><\/div><\/section>':'')+\n '<section class=\"panel\"><div class=\"panel-head\"><h2>导入会员<\/h2>'+(a&&s.importLocked?'<button class=\"btn btn-ghost btn-sm\" onclick=\"unlockImport()\">允许职员再导入一次<\/button>':'')+'<\/div><p>'+status+'<\/p>'+\n (canSubmit?gsPanel():'')+(canSubmit?'<div class=\"cols-eq\"><div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><h3>1. 复制模板<\/h3><textarea id=\"tpl\" rows=\"4\" readonly>'+esc(TEMPLATE)+'<\/textarea><div><button class=\"btn btn-ghost btn-sm\" onclick=\"copyText(\\'tpl\\')\">复制模板<\/button><\/div><p class=\"small muted\">第一行是标题，之后每行一位会员。花名可以留空，电话重复的会被跳过。从 Google 表格下载的报名 CSV 也可以直接选，系统会自动认出栏位，只导入「待批准」的报名。<\/p><\/div><div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><h3>2. 贴上资料或选择 CSV 文件<\/h3><textarea id=\"imp\" rows=\"4\" placeholder=\"把 Excel 的资料贴在这里（逗号分隔）\"><\/textarea><div class=\"actions\"><input id=\"impf\" type=\"file\" accept=\".csv,text/csv\" onchange=\"readImportFile(this)\" style=\"height:auto;padding:8px;max-width:280px\"><button class=\"btn btn-blue\" onclick=\"checkImport()\">检查资料<\/button><\/div><\/div><\/div><div id=\"imprev\">'+(UI.importRows?importPreview():'')+'<\/div>':'<div class=\"lock\">导入功能已锁定。请联系管理员开放。<\/div>')+'<\/section>';\n}\nfunction readImportFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=String(r.result).replace(/^﻿/,'');checkImport()};r.readAsText(f)}\nfunction parseCSV(txt){txt=String(txt||'').replace(/^\\ufeff/,'');const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='\"'){if(txt[i+1]==='\"'){cur+='\"';i++}else q=false}else cur+=ch;continue}if(ch==='\"'){q=true}else if(ch===','||ch==='\\t'){row.push(cur.trim());cur=''}else if(ch==='\\n'||ch==='\\r'){if(ch==='\\r'&&txt[i+1]==='\\n')i++;row.push(cur.trim());cur='';if(row.some(x=>x))rows.push(row);row=[]}else cur+=ch}row.push(cur.trim());if(row.some(x=>x))rows.push(row);return rows}\nfunction checkImport(){\n const rows=parseCSV($('#imp').value);let map={name:0,nick:1,phone:2,state:3,town:4,join:5,status:-1};\n if(rows.length&&rows[0].some(x=>/姓名|name|nama/i.test(x))){const h=rows.shift().map(x=>x.toLowerCase());const f=re=>h.findIndex(x=>re.test(x));\n  map={name:f(/姓名|^name|^nama/),nick:f(/花名|nick|panggilan/),phone:f(/电话|手机|phone|telefon/),state:f(/州|state|negeri/),town:f(/城镇|地区|town|bandar/),join:f(/入会|join|sertai|时间戳记|timestamp|cap masa|\\u63d0\\u4ea4\\u65f6\\u95f4/),status:f(/状态|status/),ic:f(/身份证|^ic|mykad|nric|kad pengenalan/),addr:f(/地址|address|alamat/),note:f(/备注|note|catatan/),bday:f(/生日|birth|lahir/),ref:f(/介绍人|referr|rujuk/)}}\n const g=(r,k)=>map[k]>=0?String(r[map[k]]||'').trim():'';\n const src=map.status>=0?rows.filter(r=>!g(r,'status')||['\\u5f85\\u6279\\u51c6','Pending','Menunggu'].includes(g(r,'status'))):rows;\n const seen=new Set(S.members.map(m=>String(m.phone||'').replace(/\\D/g,'')));\n UI.importRows=src.map(r=>{const name=g(r,'name'),nick=g(r,'nick'),phone=g(r,'phone').replace(/^'/,''),state=g(r,'state'),town=g(r,'town'),join=normDate(g(r,'join'));const d=(phone||'').replace(/\\D/g,'');let e='';\n  if(!name)e='缺少姓名';else if(d&&(d.length<9||d.length>11))e='电话格式不对';else if(d&&seen.has(d))e='电话已存在';else if(join&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(join))e='日期格式应为 YYYY-MM-DD';\n  const ic=g(r,'ic'),addr=g(r,'addr');if(!e&&ic&&!icBday(ic))e='身份证号码不对';return {name,nick:nick||'',phone,state:state||'-',town:town||'-',join:join||iso(today0()),ic:ic?icFmt(ic):'',addr,note:g(r,'note'),bday:normDate(g(r,'bday')),ref:g(r,'ref'),e}});\n $('#imprev').innerHTML=importPreview();\n}\nfunction importPreview(){\n const rows=UI.importRows;if(!rows.length)return '<div class=\"empty\">没有读到资料，请贴上内容后再检查。<\/div>';\n const ok=rows.filter(r=>!r.e).length;\n return '<h3>3. 检查结果：'+ok+' 笔可导入，'+(rows.length-ok)+' 笔有问题<\/h3><div class=\"tbl-wrap\"><table><thead><tr><th>姓名<\/th><th>花名<\/th><th>电话<\/th><th>州属<\/th><th>城镇<\/th><th>入会日期<\/th><th>状态<\/th><\/tr><\/thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'<\/td><td>'+esc(r.nick)+'<\/td><td>'+esc(r.phone)+'<\/td><td>'+esc(r.state)+'<\/td><td>'+esc(r.town)+'<\/td><td>'+esc(r.join)+'<\/td><td>'+(r.e?'<span class=\"pill bad\">'+esc(r.e)+'<\/span>':'<span class=\"pill ok\">可导入<\/span>')+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div><div class=\"actions\"><button class=\"btn btn-teal\" onclick=\"submitImport()\"'+(ok?'':' disabled')+'>'+(isAdmin()?'导入 '+ok+' 笔':'提交给管理员核实（'+ok+' 笔）')+'<\/button><button class=\"btn btn-ghost\" onclick=\"UI.importRows=null;render()\">清除<\/button><\/div>';\n}\nfunction applyRows(rows){rows.forEach(r=>{const id='M'+pad(++S.seq.M,4);const nm={id,name:r.name,nick:r.nick||'',phone:r.phone,state:r.state,town:r.town,join:r.join,expiry:iso(addYears(parse(r.join),2)),tierOverride:null,batches:[],role:'customer',ic:r.ic||'',bday:r.ic?(icBday(r.ic)||r.bday||''):(r.bday||''),addr:r.addr||'',note:r.note||''};S.members.push(nm);if(r.ref){const rm=findRef(r.ref,nm.id);if(rm)refAward(nm,rm);else nm.note=(nm.note?nm.note+'；':'')+'介绍人：'+r.ref}})}\nfunction findRef(v,self){v=String(v||'').trim();if(!v)return null;const id=midFrom(v);let m=id&&S.members.find(x=>x.id===id&&x.id!==self);if(m)return m;const d=v.replace(/\\D/g,'');if(d.length>=9){m=S.members.find(x=>x.id!==self&&String(x.phone||'').replace(/\\D/g,'')===d);if(m)return m}const l=v.toLowerCase();return S.members.find(x=>x.id!==self&&(x.name.toLowerCase()===l||(x.nick&&x.nick.toLowerCase()===l)))||null}\nfunction normDate(s){s=String(s||'').trim();if(!s)return '';let m=s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2],2)+'-'+pad(+m[3],2);m=s.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})/);if(m){let a=+m[1],b2=+m[2];if(b2>12&&a<=12){const x=a;a=b2;b2=x}return m[3]+'-'+pad(b2,2)+'-'+pad(a,2)}return s.slice(0,10)}\nfunction submitImport(){\n const rows=UI.importRows.filter(r=>!r.e);if(!rows.length)return;\n if(isAdmin()){applyRows(rows);S.settings.firstImportDone=true;S.settings.importLocked=true;log('\\u5bfc\\u5165\\u4f1a\\u5458','管理员直接导入 '+rows.length+' 笔');toast('已导入 '+rows.length+' 位会员')}\n else{S.pendingImports.push({id:'I'+Date.now(),at:nowStamp(),by:session.user,rows});S.settings.importLocked=true;log('\\u63d0\\u4ea4\\u5bfc\\u5165',rows.length+' 笔，等待管理员核实');toast('已提交，等待管理员核实')}\n UI.importRows=null;save();render();\n}\nfunction viewPending(id){const p=S.pendingImports.find(x=>x.id===id);openModal('待核实导入（'+p.rows.length+' 笔）','<div class=\"tbl-wrap\"><table><thead><tr><th>姓名<\/th><th>花名<\/th><th>电话<\/th><th>州属<\/th><th>城镇<\/th><th>入会日期<\/th><\/tr><\/thead><tbody>'+p.rows.map(r=>'<tr><td>'+esc(r.name)+'<\/td><td>'+esc(r.nick||'')+'<\/td><td>'+esc(r.phone)+'<\/td><td>'+esc(r.state)+'<\/td><td>'+esc(r.town)+'<\/td><td>'+esc(r.join)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>','<button class=\"btn btn-ghost\" onclick=\"closeModal()\">关闭<\/button><button class=\"btn btn-teal\" onclick=\"closeModal();approveImport(\\''+id+'\\')\">核实并导入<\/button>',true)}\nfunction approveImport(id){const p=S.pendingImports.find(x=>x.id===id);const seen=new Set(S.members.map(m=>String(m.phone||'').replace(/\\D/g,'')));const rows=p.rows.filter(r=>!seen.has(r.phone.replace(/\\D/g,'')));\n applyRows(rows);S.pendingImports=S.pendingImports.filter(x=>x.id!==id);S.settings.firstImportDone=true;S.settings.importLocked=true;log('\\u6838\\u5b9e\\u5bfc\\u5165','批准 '+(USERS[p.by]?D(USERS[p.by].name):p.by)+' 提交的 '+rows.length+' 笔');save();render();toast('已核实并导入 '+rows.length+' 位会员')}\nfunction rejectImport(id){S.pendingImports=S.pendingImports.filter(x=>x.id!==id);S.settings.importLocked=!S.settings.firstImportDone?false:true;log('\\u9000\\u56de\\u5bfc\\u5165',id);save();render();toast('已退回')}\nfunction unlockImport(){S.settings.importLocked=false;log('\\u5f00\\u653e\\u5bfc\\u5165','允许职员再提交一次导入');save();render();toast('已开放一次导入')}\nfunction csvCell(v){v=String(v==null?'':v);return /[\",\\n]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v}\nfunction exportCSV(kind){\n C=computeAll();let rows,title;\n if(kind==='members'){title='会员名单';rows=[['编号','姓名','花名','电话','州属','城镇','入会日期','会员到期','等级','累计消费','可用积分','积分价值','身份','身份证','生日','地址','备注','介绍人']].concat(S.members.map(m=>{const c=C[m.id];return [dispId(m.id),m.name,m.nick||'',m.phone,m.state,m.town,m.join,m.expiry,D(c.tier.name),c.spend.toFixed(2),c.avail,c.value.toFixed(2),mRoleName(mRole(m)),m.ic?icFmt(m.ic):'',m.bday||'',m.addr||'',m.note||'',m.refBy?dispId(m.refBy):'']}))}\n else if(kind==='sales'){title='销售记录';rows=[['单号','日期','会员编号','会员姓名','产品','数量','金额','积分','经办']].concat(S.sales.map(s=>[s.id,s.date,dispId(s.mid),mName(s.mid),pName(s.pid),s.qty,s.amount.toFixed(2),s.pts,s.by]))}\n else{title='兑换记录';rows=[['单号','日期','会员编号','会员姓名','等级','兑换积分','兑换金额','经办']].concat(S.redemptions.map(r=>[r.id,r.date,dispId(r.mid),mName(r.mid),D(r.tier),r.pts,r.cash.toFixed(2),r.by]))}\n const csv=rows.map(r=>r.map(csvCell).join(',')).join('\\n');\n log('\\u5bfc\\u51fa CSV',title+'（'+(rows.length-1)+' 笔）');save();\n LASTCSV={name:title+'-'+iso(today0())+'.csv',text:csv};\n openModal('导出：'+title,'<p class=\"small muted\">共 '+(rows.length-1)+' 笔。'+(DL?'按“下载 CSV”直接存档，Excel 可以打开。':'按“复制”，贴进记事本后另存为 .csv（编码选 UTF-8），即可用 Excel 打开。')+'<\/p><textarea id=\"csvout\" rows=\"12\" readonly>'+esc(csv)+'<\/textarea>','<button class=\"btn btn-ghost\" onclick=\"closeModal()\">关闭<\/button><button class=\"btn btn-ghost\" onclick=\"copyText(\\'csvout\\')\">复制<\/button>'+(DL?'<button class=\"btn btn-blue\" onclick=\"saveFile(LASTCSV.name,\\'\\\\uFEFF\\'+LASTCSV.text)\">下载 CSV<\/button>':''),true);\n}\nfunction copyText(id){const el=document.getElementById(id);const done=()=>toast('已复制');\n if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(el.value||el.textContent).then(done).catch(()=>{selectEl(el);toast('请按 Ctrl+C 复制已选取的内容')})}else{selectEl(el);toast('请按 Ctrl+C 复制已选取的内容')}}\nfunction selectEl(el){if(el.select){el.focus();el.select()}else{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}}\n\n/* ============ Google Sheets sync (viewer's Google Drive connector) ============ */\nlet MCPP=null;function getMCP(){if(!MCPP)MCPP=(async()=>{try{return (window.claude&&claude.use)?await claude.use('mcp'):null}catch(e){return null}})();return MCPP}\nfunction gsId(u){const m=String(u||'').match(/\\/spreadsheets\\/(?:u\\/\\d+\\/)?d\\/([\\w-]{20,})/);return m?m[1]:''}\nfunction b64Text(s){try{const bin=atob(String(s).replace(/\\s+/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u)}catch(e){return null}}\nfunction looksB64(s){return typeof s==='string'&&s.length>8&&/^[A-Za-z0-9+/=\\s]+$/.test(s)}\nfunction mcpCSV(res){const cands=[];const walk=(o,d)=>{if(o==null||d>5)return;if(typeof o==='string'){cands.push(o);return}if(Array.isArray(o)){o.forEach(x=>walk(x,d+1));return}if(typeof o==='object'){if(o.resource)walk(o.resource,d+1);['blob','text','data','content','base64','fileContent','body'].forEach(k=>{if(k in o)walk(o[k],d+1)});}};\n walk(res&&res.content,0);walk(res&&res.structuredContent,0);walk(res&&res.payload,0);\n for(const c of cands){if(looksB64(c)){const t=b64Text(c);if(t&&/[,\\n]/.test(t))return t}}\n for(const c of cands){const t=c.trim();if(t&&/,/.test(t)&&/\\n/.test(t)&&!/^\\{/.test(t))return t}\n return null}\nfunction gsMsg(t,kind){const e=$('#gsmsg');if(!e)return;e.className='gsmsg '+(kind||'');e.textContent=t;e.hidden=!t}\nasync function gsSync(){\n const inp=$('#gsurl');let url=(inp?inp.value:S.settings.gsheetUrl||'').trim();\n if(/\\/forms\\/|forms\\.gle/.test(url)){gsMsg('这是表单链接。请贴「回复表格」的链接，网址里有 /spreadsheets/。','bad');return}\n const id=gsId(url);if(!id){gsMsg('链接不对。请在 Google 表格按「共享」旁边的网址栏复制完整链接。','bad');return}\n if(url!==(S.settings.gsheetUrl||'')){if(!isAdmin()&&S.settings.gsheetUrl){gsMsg('只有管理员可以更换表格链接。','bad');return}S.settings.gsheetUrl=url;save()}\n const btn=$('#gsbtn');if(btn)btn.disabled=true;gsMsg('正在读取 Google 表格…','info');\n try{\n  const mcp=await getMCP();if(!mcp){gsMsg('同步要在 claude.ai 或 Claude App 里打开这个系统，并连接 Google Drive。现在可以照旧下载 CSV 再导入。','warn');return}\n  const res=await mcp.callTool('Google Drive','download_file_content',{fileId:id,exportMimeType:'text/csv'},{cache:false});\n  const csv=mcpCSV(res);if(csv==null){gsMsg('同步没有成功，请再试一次，或改用下载 CSV。','bad');return}\n  const rows=parseCSV(csv);if(rows.length<2){gsMsg('表格是空的，还没有人报名。','warn');return}\n  const ta=$('#imp');if(ta)ta.value=csv;checkImport();S.settings.gsheetLast=new Date().toISOString();save();\n  const all=UI.importRows||[];UI.importRows=all.filter(r=>r.e!=='电话已存在');const skip=all.length-UI.importRows.length;const pv0=$('#imprev');if(pv0)pv0.innerHTML=UI.importRows.length?importPreview():'';\n  const sk=skip?'（已略过 '+skip+' 位已经是会员）':'';UI.gsNew=UI.importRows.filter(r=>!r.e).length;\n  if(!UI.importRows.length){gsMsg('没有新的报名。'+sk,'info');return}\n  gsMsg('读到 '+UI.importRows.length+' 笔新报名，请在下面检查后导入。'+sk,'ok');const pv=$('#imprev');if(pv)pv.scrollIntoView({behavior:'smooth',block:'start'});\n }catch(e){const c=e&&e.code;\n  if(c==='server_not_connected'||c==='selection_required')gsMsg('请先在 claude.ai 的「设定 → Connectors」连接 Google Drive，再按同步。','warn');\n  else if(c==='needs_reauth')gsMsg('Google Drive 的连接过期了，请到 claude.ai 的「设定 → Connectors」重新连接。','warn');\n  else if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')gsMsg('需要你允许这个系统读取 Google Drive。请再按一次同步，然后按「允许」。','warn');\n  else if(c==='tool_error')gsMsg('读不到这个表格。请确认链接正确，而且表格在你连接的同一个 Google 帐号里。','bad');\n  else if(c==='server_unavailable'||c==='rate_limited')gsMsg('Google 暂时连不上，请过一会儿再按同步。','warn');\n  else if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')gsMsg('同步要在 claude.ai 或 Claude App 里打开这个系统，并连接 Google Drive。现在可以照旧下载 CSV 再导入。','warn');\n  else gsMsg('同步没有成功，请再试一次，或改用下载 CSV。','bad');\n }finally{if(btn)btn.disabled=false}\n}\nfunction gsPanel(){const s=S.settings,a=isAdmin(),lock=!a&&!!s.gsheetUrl;\n return '<div class=\"gsync\"><h3>'+ICO_SYNC+'从 Google 表格同步（不用下载 CSV）<\/h3><p class=\"small muted\">把报名「回复 pan>在“导入 / 导出”汇入<\/span><\/li><li><b>成为会员<\/b><span>开始累积积分<\/span><\/li><\/ol>';\nfunction vSignup(){\n const t=UI.sgtab;\n return '<div class=\"page-head\"><div><h1>会员报名<\/h1><p>会员用手机扫二维码自己报名，资料先进 Google 表格，再由管理员核实汇入系统。<\/p><\/div><\/div>'+\n '<div class=\"tabs\" role=\"tablist\"><button class=\"tab'+(t==='cloud'?' on':'')+'\" onclick=\"UI.sgtab=\\'cloud\\';render()\">方式一：独立报名网页（推荐）<\/button><button class=\"tab'+(t==='auto'?' on':'')+'\" onclick=\"UI.sgtab=\\'auto\\';render()\">方式二：自动生成 Google 表单<\/button><button class=\"tab'+(t==='form'?' on':'')+'\" onclick=\"UI.sgtab=\\'form\\';render()\">方式三：自己做 Google 表单<\/button><\/div>'+\n '<section class=\"panel\"><h2>报名流程<\/h2>'+SG_FLOW+'<\/section>'+(t==='auto'?sgAuto():t==='form'?sgForm():sgCloud());\n}\nfunction sgForm(){\n const q=[['姓名','简答','是'],['花名','简答','否'],['电话','简答','是'],['州属','下拉菜单','是'],['城镇 / 地区','简答','是']];\n return '<div class=\"cols\"><section class=\"panel\"><h2>设定步骤（约 10 分钟）<\/h2><ol class=\"rules\">'+\n '<li>用店里的 Google 帐号打开 <b>forms.google.com<\/b>，新建“空白表单”，标题写“'+esc(COMPANY.name)+' 会员报名”。<\/li>'+\n '<li>按右边的表格加入 5 个问题，<b>问题名称要一模一样<\/b>，导入时系统才认得。<\/li>'+\n '<li>“州属”选下拉菜单，按下面的按钮复制州属名单，贴进第一个选项就会自动变成 13 个选项。<\/li>'+\n '<li>到“设置 → 回复”，<b>不要<\/b>开“限制为 1 个回复”，这样没有 Google 帐号的会员也能填。<\/li>'+\n '<li>按右上角“发送” → 链接图标 → 勾“缩短网址” → 复制，贴到下面的方框。<\/li>'+\n '<li>到“回复” → “在 Google 表格中查看”，报名资料会自动进表格。<\/li>'+\n '<li>要汇入时：表格的“文件 → 下载 → CSV”，再到 <a href=\"#import\">导入 / 导出<\/a> 选择那个文件，核实后汇入。<\/li><\/ol>'+\n '<div><button class=\"btn btn-ghost btn-sm\" onclick=\"copyStr(STATES.join(\\'\\\\n\\'))\">复制州属名单<\/button><\/div><\/section>'+\n '<section class=\"panel\"><h2>表单问题<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>问题名称<\/th><th>类型<\/th><th>必填<\/th><\/tr><\/thead><tbody>'+q.map(r=>'<tr><td><b>'+r[0]+'<\/b><\/td><td>'+r[1]+'<\/td><td>'+r[2]+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div><p class=\"small muted\">优点：不用写程序，马上能用。缺点：页面是 Google 的样式，同一个电话报名两次也挡不住，要在导入时才会被挑出来。<\/p><\/section><\/div>'+\n qrPanel('form','贴上 Goog nmax(0,1fr)}\n  .side{position:static;height:auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:12px}\n  .nav{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}\n  .nav-group{display:none}\n  .nav a{flex:none}\n  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;margin-top:0;padding-top:10px}\n  .site-hero .site-in{grid-template-columns:minmax(0,1fr)}\n  .hero-copy{padding-bottom:10px}\n  .site-hero{background:linear-gradient(180deg,var(--side) 0%,var(--side) 45%,var(--bg) 45%)}\n}\n@media (max-width:560px){\n  .grid2,.grid3,.filters{grid-template-columns:minmax(0,1fr)}\n  .kpi .v{font-size:23px}\n  .hbar{grid-template-columns:80px minmax(0,1fr) 36px}\n  .vbars,.vlabels{gap:3px}\n  .vbar b{font-size:10.5px}\n  .vlabels{font-size:10.5px}\n  .overlay{padding:16px 10px}\n}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}\n<\/style>\n\n<div id=\"root\"><\/div>\n<div id=\"modal-root\"><\/div>\n<div id=\"toast\" class=\"toast\" hidden><\/div>\n<script type=\"text/plain\" id=\"src-gs\">\n/**\n * MA PLANTATION 永發肥料企業 - Pendaftaran Ahli Awan - Google Apps Script\n * Letak dalam Google Sheet di Extensions > Apps Script.\n * Ahli imbas kod QR > halaman daftar > data masuk ke helaian Pendaftaran (status: Menunggu)\n * > Admin muat turun CSV dan import dalam sistem ahli (Import / Eksport) selepas semak.\n */\n\n// ===== Ubah bahagian ini sahaja =====\nconst SHOP = {\n  name: 'MA PLANTATION 永發肥料企業',\n  phone: '012-345 6789',\n};\n// ========================\n\nconst SHEET_NAME = 'Pendaftaran';\nconst HEADERS = ['No. Rujukan', 'Masa Hantar', 'Nama', 'Nama Panggilan', 'Telefon', 'Negeri', 'Bandar', 'Status', 'Catatan'];\nconst TZ = 'Asia/Kuala_Lumpur';\n\nfunction doGet() {\n  const t = HtmlService.createTemplateFromFile('Index');\n  t.shop = SHOP;\n  return t.evaluate()\n    .setTitle(SHOP.name + ' Pendaftaran Ahli')\n    .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n/** Tambah menu Pendaftaran Ahli apabila helaian dibuka */\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('Pendaftaran Ahli')\n    .addItem('Tanda semua Menunggu sebagai Diimport', 'markImported')\n    .addToUi();\n  getSheet_();\n}\n\nfunction getSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(SHEET_NAME);\n  if (!sh) {\n    sh = ss.insertSheet(SHEET_NAME);\n    sh.appendRow(HEADERS);\n    sh.setFrozenRows(1);\n    sh.getRange(1, 1, 1, HEADERS.length).setFontWeight('bold').setBackground('#DBF1EF');\n    sh.getRange('E:E').setNumberFormat('@'); // simpan telefon sebagai teks supaya 0 di depan tidak hilang\n  }\n  return sh;\n}\n\n/** Elak input bermula dengan = + - @ menjadi formula */\nfunction safe_(v, max) {\n  let s = String(v == null ? '' : v).trim().slice(0, max || 60);\n  if (/^[=+\\-@]/.test(s)) s = \"'\" + s;\n  return s;\n}\n\n/** Dijalankan apabila halaman daftar dihantar */\nfunction submitSignup(form) {\n  if (form && form.website) return { ok: true, ref: '-' }; // anti-bot\n  const name = safe_(form.name, 60);\n  const nick = safe_(form.nick, 30);\n  const phone = String(form.phone || '').trim();\n  const digits = phone.replace(/\\D/g, '');\n  const state = safe_(form.state, 40);\n  const town = safe_(form.town, 60);\n\n  if (!name) throw new Error('Sila isi nama.');\n  if (digits.length < 9 || digits.length > 11) throw new Error('Nombor telefon mesti 9 hingga 11 digit.');\n  if (!state) throw new Error('Sila pilih negeri.');\n  if (!town) throw new Error('Sila isi bandar atau kawasan.');\n  if (!form.agree) throw new Error('Sila tanda kotak persetujuan untuk menghantar.');\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const sh = getSheet_();\n    const last = sh.getLastRow();\n    if (last > 1) {\n      const phones = sh.getRange(2, 5, last - 1, 1).getDisplayValues()\n        .map(r => String(r[0]).replace(/\\D/g, ''));\n      if (phones.indexOf(digits) !== -1) {\n        throw new Error('Nombor telefon ini sudah mendaftar. Kami akan menghubungi anda tidak lama lagi.');\n      }\n    }\n    const now = new Date();\n    const ref = 'W' + Utilities.formatDate(now, TZ, 'yyMMdd') + '-' + ('000' + last).slice(-3);\n    sh.appendRow([ref, Utilities.formatDate(now, TZ, 'yyyy-MM-dd HH:mm'), name, nick, phone, state, town, 'Menunggu', '']);\n    return { ok: true, ref: ref };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** Menu: selepas import ke sistem, tanda baris Menunggu sebagai Diimport */\nfunction markImported() {\n  const sh = getSheet_();\n  const last = sh.getLastRow();\n  if (last < 2) return;\n  const rng = sh.getRange(2, 8, last - 1, 1);\n  const vals = rng.getValues().map(r => [r[0] === 'Menunggu' ? 'Diimport' : r[0]]);\n  rng.setValues(vals);\n  SpreadsheetApp.getUi().alert('Tanda selesai.');\n}\n<\/script>\n<script type=\"text/plain\" id=\"src-idx\">\n<!DOCTYPE html>\n<html lang=\"ms\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Pendaftaran Ahli<\/title>\n<style>\n  :root{--bg:#F1F5F7;--card:#fff;--ink:#17293A;--muted:#566878;--line:#D9E2E8;--blue:#1D5C93;--teal:#0F807B;--teal-soft:#DBF1EF;--red:#BE3D27;--side:#153A5A}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Inter\",\"Noto Sans SC\",system-ui,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;font-size:16px;line-height:1.55}\n  .top{background:var(--side);color:#fff;padding:22px 18px 70px}\n  .top .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}\n  .mark{width:44px;height:44px;border-radius:12px;background:var(--teal);display:grid;place-items:center;flex:none}\n  .top h1{margin:0;font-size:21px}\n  .top p{margin:2px 0 0;color:#C9DAE8;font-size:14px}\n  .wrap{max-width:520px;margin:-50px auto 40px;padding:0 14px}\n  .card{background:var(--card);border-radius:14px;padding:22px 18px;box-shadow:0 8px 24px rgba(10,30,50,.08);display:flex;flex-direction:column;gap:16px}\n  .perks{background:var(--teal-soft);color:#0B5F5B;border-radius:10px;padding:12px 14px;font-size:14.5px}\n  .perks b{display:block;margin-bottom:2px}\n  label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px}\n  label small{font-weight:400;color:var(--muted)}\n  input,select{font:inherit;font-size:16px;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}\n  input:focus,select:focus{outline:2px solid var(--blue);border-color:var(--blue)}\n  .agree{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;font-size:14px;color:var(--muted)}\n  .agree input{width:22px;height:22px;flex:none;margin-top:1px}\n  button{height:52px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-size:17px;font-weight:700;cursor:pointer}\n  button:disabled{opacity:.6}\n  .err{color:var(--red);font-weight:600;font-size:14.5px}\n  .done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}\n  .tick{width:64px;height:64px;border-radius:50%;background:var(--teal-soft);display:grid;place-items:center}\n  .ref{font-size:24px;font-weight:700;color:var(--blue);letter-spacing:.03em}\n  .foot{text-align:center;color:var(--muted);font-size:13.5px;margin-top:14px}\n  .hp{position:absolute;left:-9999px}\n  [hidden]{display:none!important}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\"><div class=\"in\">\n  <div class=\"mark\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M12 21V11\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\"/><path d=\"M12 12c0-4 3-7 8-7 0 5-3 8-8 7Z\" fill=\"#fff\"/><path d=\"M12 15c0-3-2.5-5.5-7-5.5 0 4 2.5 6 7 5.5Z\" fill=\"#fff\" opacity=\".75\"/><\/svg><\/div>\n  <div><h1><?= shop.name ?> Pendaftaran Ahli<\/h1><p>Daftar Ahli · Siap dalam 1 minit<\/p><\/div>\n<\/div><\/header>\n\n<main class=\"wrap\">\n  <form class=\"card\" id=\"f\" onsubmit=\"send(event)\">\n    <div class=\"perks\"><b>Percuma untuk sertai. Kumpul mata setiap pembelian<\/b>Dapat 1 mata untuk setiap RM 1 dibelanjakan. Tebus mata untuk diskaun tunai bila-bila masa.<\/div>\n    <label>Nama<input name=\"name\" required maxlength=\"60\" autocomplete=\"name\"><\/label>\n    <label>Nama Panggilan <small>(tidak wajib) nama yang orang biasa panggil anda<\/small><input name=\"nick\" maxlength=\"30\"><\/label>\n    <label>Telefon<input name=\"phone\" required inputmode=\"tel\" placeholder=\"cth. 012-345 6789\" autocomplete=\"tel\"><\/label>\n    <label>Negeri<select name=\"state\" required>\n      <option value=\"\">Sila pilih<\/option>\n      <option>Kedah<\/option><option>Perlis<\/option><option>Pulau Pinang<\/option><option>Perak<\/option>\n      <option>Selangor<\/option><option>Negeri Sembilan<\/option><option>Melaka<\/option><option>Johor<\/option>\n      <option>Pahang<\/option><option>Terengganu<\/option><option>Kelantan<\/option><option>Sabah<\/option><option>Sarawak<\/option>\n    <\/select><\/label>\n    <label>Bandar / Kawasan<input name=\"town\" required maxlength=\"60\" placeholder=\"cth. Sekinchan\"><\/label>\n    <input class=\"hp\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\">\n    <label class=\"agree\"><input type=\"checkbox\" name=\"agree\" value=\"1\" required>Saya bersetuju kedai menyimpan butiran di atas, hanya untuk mata ahli dan hubungan.<\/label>\n    <div class=\"err\" id=\"err\" hidden><\/div>\n    <button id=\"btn\" type=\"submit\">Hantar<\/button>\n  <\/form>\n\n  <section class=\"card done\" id=\"ok\" hidden>\n    <div class=\"tick\"><svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\"><path d=\"M5 12.5l4.5 4.5L19 7.5\" stroke=\"#0F807B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\/svg><\/div>\n    <h2 style=\"margin:0\">Pendaftaran diterima<\/h2>\n    <p style=\"margin:0;color:var(--muted)\">Nombor rujukan anda<\/p>\n    <div class=\"ref\" id=\"ref\"><\/div>\n    <p style=\"margin:0;color:var(--muted)\">Keahlian anda akan diaktifkan selepas kedai menyemak. Lain kali membeli, beri nombor telefon anda untuk kumpul mata.<\/p>\n  <\/section>\n\n  <p class=\"foot\">Ada soalan? Hubungi <?= shop.phone ?><\/p>\n<\/main>\n\n<script>\n  function send(e){\n    e.preventDefault();\n    var f=document.getElementById('f'), btn=document.getElementById('btn'), err=document.getElementById('err');\n    var data={name:f.name.value,nick:f.nick.value,phone:f.phone.value,state:f.state.value,town:f.town.value,agree:f.agree.checked,website:f.website.value};\n    err.hidden=true; btn.disabled=true; btn.textContent='Menghantar…';\n    var done=function(res){document.getElementById('ref').textContent=res.ref;f.hidden=true;document.getElementById('ok').hidden=false;window.scrollTo(0,0)};\n    var fail=function(x){err.textContent=(x&&x.message?x.message:'Gagal dihantar. Sila cuba lagi.').replace(/^Error:\\s*/,'');err.hidden=false;btn.disabled=false;btn.textContent='Hantar'};\n    if(window.google&&google.script&&google.script.run){\n      google.script.run.withSuccessHandler(done).withFailureHandler(fail).submitSignup(data);\n    }else{ // mod pratonton (bukan dalam Apps Script)\n      setTimeout(function(){done({ref:'W261111-001 (pratonton)'})},400);\n    }\n  }\n<\\/script>\n<\/body>\n<\/html>\n<\/script>\n\n<script>\n/* ============ Utilities ============ */\nconst $=s=>document.querySelector(s);\nconst esc=s=>String(s==null?'':s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst pad=(n,l)=>String(n).padStart(l,'0');\nfunction d0(d){const x=new Date(d);x.setHours(0,0,0,0);return x}\nfunction today0(){return d0(new Date())}\nfunction iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1,2)+'-'+pad(d.getDate(),2)}\nfunction parse(s){const [y,m,d]  (e) { Logger.log(\"\\u26a0 \\u8bf7\\u5230\\u8868\\u5355\\u6309\\u53f3\\u4e0a\\u89d2\\u300c\\u53d1\\u5e03\\u300d / Tekan Terbitkan / Press Publish\"); }');add('  form.setAcceptingResponses(true);');add('  var url = form.getPublishedUrl();');\n add('  try { url = form.shortenFormUrl(url); } catch (e) {}');\n const LL=o.lang==='tri'?'zh':o.lang;\n add('  Logger.log('+J(FQ[LL].log1)+' + url);');\n add('  Logger.log('+J(FQ[LL].log2)+' + form.getEditUrl());');\n add('  Logger.log('+J(FQ[LL].log3)+' + ss.getUrl());');\n add('}');\n return L.join('\\n')}\nfunction sgaSet(k,v){const o=sgaInit();if(k==='f'){o.f[v]=o.f[v]?0:1}else o[k]=v;const t=$('#sga-code');if(t)t.value=genFormScript();if(k!=='title'){const ti=$('#sga-title');if(ti&&!o.title)ti.placeholder=sgaTitle()}}\nfunction sgAuto(){const o=sgaInit();const evs=(S.events||[]).filter(e=>evStatus(e)!=='done');\n const qs=[['nick','Nama Panggilan'],['ic','Nombor IC'],['bday','Hari jadi'],['addr','Alamat'],['state','Negeri'],['town','Bandar / Kawasan'],['ref','Dirujuk oleh']];\n return '<div class=\"cols\"><section class=\"panel\"><h2>Tetapan borang<\/h2>'+\n '<label class=\"f\">Bahasa borang<select onchange=\"sgaSet(\\'lang\\',this.value)\"><option value=\"tri\"'+(o.lang==='tri'?' selected':'')+'>3 bahasa (华语 / BM / English)<\/option><option value=\"zh\"'+(o.lang==='zh'?' selected':'')+'>华语<\/option><option value=\"ms\"'+(o.lang==='ms'?' selected':'')+'>Bahasa Melayu<\/option><option value=\"en\"'+(o.lang==='en'?' selected':'')+'>English<\/option><\/select><\/label>'+\n '<label class=\"f\">Untuk aktiviti (tidak wajib)<select onchange=\"sgaSet(\\'ev\\',this.value)\"><option value=\"\">Tiada aktiviti<\/option>'+evs.map(e=>'<option value=\"'+e.id+'\"'+(o.ev===e.id?' selected':'')+'>'+esc(e.name)+' ('+fmtD(e.start)+' – '+fmtD(e.end)+')<\/option>').join('')+'<\/select><\/label>'+\n '<label class=\"f\">Tajuk borang<input id=\"sga-title\" value=\"'+esc(o.title)+'\" placeholder=\"'+esc(sgaTitle())+'\" oninput=\"sgaSet(\\'title\\',this.value)\"><\/label>'+\n '<div class=\"f\"><span>Soalan yang ditanya<\/span><div class=\"sga-q\">'+qs.map(q=>'<label><input type=\"checkbox\"'+(o.f[q[0]]?' checked':'')+' onchange=\"sgaSet(\\'f\\',\\''+q[0]+'\\')\">'+q[1]+'<\/label>').join('')+'<\/div><span class=\"small muted\">Nama dan telefon sentiasa ditanya<\/span><\/div><\/section>'+\n '<section class=\"panel\"><h2>Cara guna (kira-kira 5 minit kali pertama)<\/h2><ol class=\"rules\"><li>Pilih bahasa, aktiviti dan soalan di sebelah kiri, kemudian klik “Salin Skrip”.<\/li>'+\n '<li>Guna akaun Google kedai, buka <a href=\"https://script.google.com/home/projects/create\" target=\"_blank\" rel=\"noopener\"><b>script.google.com<\/b><\/a> dan klik “New project”.<\/li>'+\n '<li>Padam semua dalam editor, tampal skrip dan klik Save.<\/li><li>Di atas pilih <b>createMemberForm<\/b> dan klik “Run”. Kali pertama ia minta kebenaran: pilih akaun anda → “Advanced” → “Go to (unsafe)” → “Allow”. Google menunjukkan ini kerana ia skrip anda sendiri.<\/li>'+\n '<li>Selepas siap, “Execution log” menunjukkan 3 pautan: borang untuk pelanggan, editor borang dan helaian respons. Kedua-duanya disimpan dalam Google Drive anda secara automatik.<\/li><li>Tampal “pautan borang untuk pelanggan” dalam kotak di bawah dan klik “Jana Kod QR” untuk poster yang boleh dicetak.<\/li>'+\n '<li>Selepas aktiviti: buka helaian respons → Fail → Muat turun → CSV → pergi ke <a href=\"#import\">Import / Eksport<\/a> dan pilih fail untuk import. Lajur dipadankan secara automatik dan perujuk dapat bonus secara automatik.<\/li><\/ol><p class=\"small muted\">Anda boleh cipta borang baharu untuk setiap aktiviti; borang lama masih boleh digunakan.<\/p><\/section><\/div>'+\n '<section class=\"panel\"><div class=\"panel-head\"><h2>Skrip yang dijana<\/h2><button class=\"btn btn-blue\" onclick=\"copyStr($(\\'#sga-code\\').value);toast(\\'Skrip disalin\\')\">Salin kod<\/button><\/div><textarea id=\"sga-code\" class=\"code\" rows=\"14\" readonly spellcheck=\"false\">'+esc(genFormScript())+'<\/textarea><\/section>'+\n qrPanel('auto','Tampal pautan borang yang dijana','https://forms.gle/…')}\n\nfunction pageOf(list,k,sig){const sz=S.settings['ps_'+k]||20;if(UI['sig_'+k]!==sig){UI['sig_'+k]=sig;UI['pg_'+k]=1}const pages=Math.max(1,Math.ceil(list.length/sz));const p=Math.min(Math.max(1,UI['pg_'+k]||1),pages);UI['pg_'+k]=p;\n return {items:list.slice((p-1)*sz,p*sz),p:p,pages:pages,sz:sz,from:list.length?(p-1)*sz+1:0,to:Math.min(p*sz,list.length)}}\nfunction pagerTop(k,total,pg,unit){return '<div class=\"pager-top\"><span class=\"small muted\">Jumlah '+N(total)+' '+unit+' · papar '+pg.from+'–'+pg.to+' '+unit+'<\/span><label class=\"pg-size small muted\">Setiap halaman<select onchange=\"setPS(\\''+k+'\\',this.value)\">'+[10,20,30,50,100].map(n=>'<option value=\"'+n+'\"'+(n===pg.sz?' selected':'')+'>'+n+'<\/option>').join('')+'<\/select>'+unit+'<\/label><\/div>'}\nfunction pagerNav(k,pg){if(pg.pages<=1)return '';const P=pg.p,L=pg.pages,set=new Set([1,L,P-1,P,P+1,P-2,P+2].filter(x=>x>=1&&x<=L));const nums=[...set].sort((a,b)=>a-b);let h='',last=0;\n nums.forEach(n=>{if(n-last>1)h+='<span class=\"pg-gap\">…<\/span>';h+='<button type=\"button\" class=\"pg-n'+(n===P?' on':'')+'\"'+(n===P?' aria-current=\"page\"':'')+' onclick=\"goPage(\\''+k+'\\','+n+')\">'+n+'<\/button>';last=n});\n return '<nav class=\"pager\" aria-label=\"Halaman\"><button type=\"button\" class=\"pg-n pg-step\"'+(P<=1?' disabled':'')+' onclick=\"goPage(\\''+k+'\\','+(P-1)+')\">‹ Sebelum<\/button>'+h+'<button type=\"button\" class=\"pg-n pg-step\"'+(P>=L?' disabled':'')+' onclick=\"goPage(\\''+k+'\\','+(P+1)+')\">Seterus ›<\/button><\/nav>'}\nfunction goPage(k,p){UI['pg_'+k]=p;(k==='m'?drawMembers:drawSales)();const el=$(k==='m'?'#mtable':'#stable');if(el)el.scrollIntoView({block:'start'})}\nfunction setPS(k,v){S.settings['ps_'+k]=Number(v)||20;UI['pg_'+k]=1;save();(k==='m'?drawMembers:drawSales)()}\n\n/* ============ Dashboard ============ */\nfunction vDash(){\n const  class=\"btn btn-teal\" onclick=\"saleForm()\">+ Rekod Pembelian<\/button><button class=\"btn btn-blue\" onclick=\"memberForm()\">+ Tambah Ahli<\/button><\/div><\/div>'+quickSearch()+bdayBanner()+evBanner()+alert+\n '<div class=\"kpis\"><div class=\"kpi blue\"><span class=\"k\">Jumlah ahli<\/span><span class=\"v\">'+N(active.length)+'<\/span><span class=\"s\">Tambah '+(S.members.length-active.length)+' telah tamat<\/span><\/div><div class=\"kpi teal\"><span class=\"k\">Baharu bulan ini<\/span><span class=\"v\">'+newThis+'<\/span><span class=\"s\">Bulan semasa<\/span><\/div><div class=\"kpi\"><span class=\"k\">Jualan bulan ini<\/span><span class=\"v\">'+RM(salesThis)+'<\/span><span class=\"s\">'+S.sales.filter(s=>s.date.slice(0,7)===mk).length+' pembelian<\/span><\/div><div class=\"kpi orange\"><span class=\"k\">Nilai mata belum ditebus<\/span><span class=\"v\">'+RM(ptsValue)+'<\/span><span class=\"s\">'+N(active.reduce((a,m)=>a+C[m.id].avail,0))+' mata<\/span><\/div><\/div>'+\n '<div class=\"cols\"><section class=\"panel\"><div class=\"panel-head\"><h2>Ahli baharu sebulan<\/h2><span class=\"small muted\">12 bulan lepas<\/span><\/div>'+vb+'<\/section><section class=\"panel\"><div class=\"panel-head\"><h2>Ahli mengikut tahap<\/h2><\/div>'+tb+'<\/section><\/div>'+\n '<div class=\"cols\"><section class=\"panel\"><div class=\"panel-head\"><h2>Pembelian terkini<\/h2><a href=\"#sales\" class=\"small\">Semua jualan →<\/a><\/div><div class=\"tbl-wrap\"><table class=\"dash-recent\"><thead><tr><th>Tarikh<\/th><th>Ahli<\/th><th>Produk<\/th><th class=\"r\">Jumlah<\/th><th class=\"r\">Mata<\/th><\/tr><\/thead><tbody>'+recent+'<\/tbody><\/table><\/div><\/section><section class=\"panel\"><div class=\"panel-head\"><h2>Ahli mengikut lokasi<\/h2><span class=\"small muted\">Ikut negeri<\/span><\/div>'+sb+'<p class=\"small muted\">Bandar teratas: '+topTowns+'<\/p><\/section><\/div>';\n}\n\n/* ============ Search ============ */\nfunction matchMember(m,q){\n q=String(q||'').trim().toLowe
