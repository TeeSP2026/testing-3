\/tr><\/thead><tbody>'+\n S.tiers.map((t,i)=>'<tr class=\"trt\" style=\"--tc:var('+t.color+')\"><td><span class=\"tcell\"><span class=\"tc-badge\">'+tierIco(t)+'<\/span><span><b>'+esc(D(t.name))+'<\/b><small>Lv.'+(i+1)+'<\/small><\/span><\/span><\/td><td class=\"r\">'+(a&&i>0?'<input id=\"tmin'+i+'\" type=\"number\" min=\"0\" step=\"100\" value=\"'+t.min+'\" style=\"max-width:130px;text-align:right\">':N(t.min))+'<\/td><td class=\"r\">'+(a?'<input id=\"trate'+i+'\" type=\"number\" min=\"0\" step=\"0.001\" value=\"'+t.rate+'\" style=\"max-width:110px;text-align:right\">':t.rate.toFixed(3))+'<\/td><td class=\"r\">'+RM(1000*t.rate)+'<\/td><td class=\"r\">'+cnt(t.id)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>'+\n '<div class=\"grid3\"><label class=\"f\">Mata bagi setiap RM 1<input id=\"earn\" type=\"number\" min=\"0\" step=\"0.1\" value=\"'+S.settings.earn+'\"'+(a?'':' disabled')+'><\/label><label class=\"f\">Mata bonus rujukan bagi setiap ahli baharu<input id=\"refpts\" type=\"number\" min=\"0\" step=\"1\" value=\"'+(S.settings.refPts||0)+'\"'+(a?'':' disabled')+'><\/label><\/div>'+(a?'<div class=\"actions\"><button class=\"btn btn-blue\" onclick=\"saveTiers()\">Simpan Tetapan<\/button><\/div>':'')+'<\/section>'+\n '<section class=\"panel\"><h2>Peraturan<\/h2><ul class=\"rules\"><li>Mata dari setiap pembelian sah selama <b>2 tahun<\/b> dari tarikh pembelian, kemudian hangus secara automatik.<\/li><li>Keahlian sah selama <b>2 tahun<\/b> dari tarikh sertai (atau pembaharuan). Ahli yang tamat tidak boleh kumpul atau tebus mata sehingga diperbaharui.<\/li><li>Bermula <b>3 bulan<\/b> sebelum tamat, papan pemuka dan senarai ahli papar amaran jingga.<\/li><li>Ahli boleh tebus mata bila-bila masa. Mata yang paling awal tamat digunakan dahulu.<\/li><li>Tahap ditetapkan automatik ikut jumlah belanja. Admin boleh tetapkan tahap secara manual dalam profil ahli.<\/li><li>Apabila ahli merujuk ahli baharu, perujuk dapat <b>'+N(S.settings.refPts||0)+' mata<\/b>, diberi serta-merta apabila ahli baharu menyertai (tetapkan 0 untuk matikan).<\/li><\/ul><\/section>';\n}\nfunction saveTiers(){\n const old=JSON.stringify(S.tiers.map(t=>[t.min,t.rate]))+S.settings.earn;\n S.tiers.forEach((t,i)=>{if(i>0){const v=Number($('#tmin'+i).value);if(v>=0)t.min=v}const r=Number($('#trate'+i).value);if(r>=0)t.rate=r});\n const e=Number($('#earn').value);if(e>=0)S.settings.earn=e;const rp=Number($('#refpts').value);if(rp>=0)S.settings.refPts=Math.round(rp);\n for(let i=1;i<S.tiers.length;i++){if(S.tiers[i].min<=S.tiers[i-1].min){toast('Had mesti dari rendah ke tinggi. Sila semak semula.');S.tiers.forEach((t,j)=>{const o=JSON.parse(old.slice(0,old.lastIndexOf(']')+1))[j];t.min=o[0];t.rate=o[1]});render();return}}\n log('\\u4fee\\u6539\\u7b49\\u7ea7\\u8bbe\\u5b9a',S.tiers.map(t=>t.name+' ≥'+t.min+' @'+t.rate).join('; ')+'; '+S.settings.earn+' mata bagi setiap RM1');save();render();toast('Tetapan disimpan');\n}\n\n/* ============ Import / Export ============ */\nconst TEMPLATE='Nama,Nama Panggilan,Telefon,Negeri,Bandar,Tarikh sertai (YYYY-MM-DD)\\nTan Tai Boon,Ah Boon,012-555 1234,Selangor,Sekinchan,2026-01-15\\nAminah binti Salleh,,013-444 9876,Kedah,Yan,2025-11-02';\nfunction vImport(){\n const a=isAdmin(),s=S.settings;\n let status;\n if(!s.firstImportDone)status='<span class=\"pill info\">Import pertama belum dibuat<\/span> Import pertama hanya berkuat kuasa selepas disemak Admin.';\n else if(s.importLocked)status='<span class=\"pill line\">Dikunci<\/span> Import pertama selesai. Selepas ini hanya Admin boleh import'+(a?', atau klik “Benarkan staf import sekali lagi”.':'. Sila hubungi Admin jika perlu import.');\n else status='<span class=\"pill ok\">Dibuka sekali<\/span> Admin membenarkan staf hantar satu import lagi. Ia masih perlu disemak Admin.';\n const canSubmit=a||!s.importLocked;\n const pend=S.pendingImports.map(p=>'<tr><td class=\"nw\">'+esc(p.at)+'<\/td><td>'+esc(USERS[p.by]?D(USERS[p.by].name):p.by)+'<\/td><td class=\"r\">'+p.rows.length+'<\/td><td class=\"r nw\">'+(a?'<button class=\"btn btn-ghost btn-sm\" onclick=\"viewPending(\\''+p.id+'\\')\">Lihat<\/button> <button class=\"btn btn-teal btn-sm\" onclick=\"approveImport(\\''+p.id+'\\')\">Semak & Import<\/button> <button class=\"btn btn-ghost btn-sm\" style=\"color:var(--red)\" onclick=\"rejectImport(\\''+p.id+'\\')\">Tolak<\/button>':'<span class=\"pill soon\">Menunggu semakan Admin<\/span>')+'<\/td><\/tr>').join('');\n return '<div class=\"page-head\"><div><h1>Import / Eksport<\/h1><p>Import ahli secara pukal dengan templat. Fail CSV yang dieksport boleh dibuka dalam Excel.<\/p><\/div><\/div>'+\n '<section class=\"panel\"><h2>Eksport CSV<\/h2><div class=\"actions\"><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'members\\')\">Senarai ahli<\/button><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'sales\\')\">Jualan<\/button><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'redemptions\\')\">Tebusan<\/button><\/div><p class=\"small muted\">memaparkan kandungan CSV. Klik “Salin”, tampal dalam Excel atau Notepad, dan simpan sebagai .csv.<\/p><\/section>'+\n (S.pendingImports.length?'<section class=\"panel\"><h2>Import menunggu semakan<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Masa Hantar<\/th><th>Dihantar oleh<\/th><th class=\"r\">Bilangan<\/th><th><\/th><\/tr><\/thead><tbody>'+pend+'<\/tbody><\/table><\/div><\/section>':'')+\n '<section class=\"panel\"><div class=\"panel-head\"><h2>Import Ahli<\/h2>'+(a&&s.importLocked?'<button class=\"btn btn-ghost btn-sm\" onclick=\"unlockImport()\">Benarkan staf import sekali lagi<\/button>':'')+'<\/div><p>'+status+'<\/p>'+\n (canSubmit?gsPanel():'')+(canSubmit?'<div class=\"cols-eq\"><div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><h3>1. Salin templat<\/h3><textarea id=\"tpl\" rows=\"4\" readonly>'+esc(TEMPLATE)+'<\/textarea><div><button class=\"btn btn-ghost btn-sm\" onclick=\"copyText(\\'tpl\\')\">Salin Templat<\/button><\/div><p class=\"small muted\">Baris pertama ialah tajuk, kemudian satu ahli setiap baris. Nama panggilan boleh kosong; telefon berulang akan dilangkau. Anda juga boleh pilih CSV pendaftaran dari Google Sheets. Sistem kenal pasti lajur dan hanya import pendaftaran Menunggu.<\/p><\/div><div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><h3>2. Tampal data atau pilih fail CSV<\/h3><textarea id=\"imp\" rows=\"4\" placeholder=\"Tampal data dari Excel di sini (dipisah koma)\"><\/textarea><div class=\"actions\"><input id=\"impf\" type=\"file\" accept=\".csv,text/csv\" onchange=\"readImportFile(this)\" style=\"height:auto;padding:8px;max-width:280px\"><button class=\"btn btn-blue\" onclick=\"checkImport()\">Semak Data<\/button><\/div><\/div><\/div><div id=\"imprev\">'+(UI.importRows?importPreview():'')+'<\/div>':'<div class=\"lock\">Import dikunci. Sila minta Admin membukanya.<\/div>')+'<\/section>';\n}\nfunction readImportFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=String(r.result).replace(/^﻿/,'');checkImport()};r.readAsText(f)}\nfunction parseCSV(txt){txt=String(txt||'').replace(/^\\ufeff/,'');const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='\"'){if(txt[i+1]==='\"'){cur+='\"';i++}else q=false}else cur+=ch;continue}if(ch==='\"'){q=true}else if(ch===','||ch==='\\t'){row.push(cur.trim());cur=''}else if(ch==='\\n'||ch==='\\r'){if(ch==='\\r'&&txt[i+1]==='\\n')i++;row.push(cur.trim());cur='';if(row.some(x=>x))rows.push(row);row=[]}else cur+=ch}row.push(cur.trim());if(row.some(x=>x))rows.push(row);return rows}\nfunction checkImport(){\n const rows=parseCSV($('#imp').value);let map={name:0,nick:1,phone:2,state:3,town:4,join:5,status:-1};\n if(rows.length&&rows[0].some(x=>/姓名|name|nama/i.test(x))){const h=rows.shift().map(x=>x.toLowerCase());const f=re=>h.findIndex(x=>re.test(x));\n  map={name:f(/姓名|^name|^nama/),nick:f(/花名|nick|panggilan/),phone:f(/电话|手机|phone|telefon/),state:f(/州|state|negeri/),town:f(/城镇|地区|town|bandar/),join:f(/入会|join|sertai|时间戳记|timestamp|cap masa|\\u63d0\\u4ea4\\u65f6\\u95f4/),status:f(/状态|status/),ic:f(/身份证|^ic|mykad|nric|kad pengenalan/),addr:f(/地址|address|alamat/),note:f(/备注|note|catatan/),bday:f(/生日|birth|lahir/),ref:f(/介绍人|referr|rujuk/)}}\n const g=(r,k)=>map[k]>=0?String(r[map[k]]||'').trim():'';\n const src=map.status>=0?rows.filter(r=>!g(r,'status')||['\\u5f85\\u6279\\u51c6','Pending','Menunggu'].includes(g(r,'status'))):rows;\n const seen=new Set(S.members.map(m=>String(m.phone||'').replace(/\\D/g,'')));\n UI.importRows=src.map(r=>{const name=g(r,'name'),nick=g(r,'nick'),phone=g(r,'phone').replace(/^'/,''),state=g(r,'state'),town=g(r,'town'),join=normDate(g(r,'join'));const d=(phone||'').replace(/\\D/g,'');let e='';\n  if(!name)e='Tiada nama';else if(d&&(d.length<9||d.length>11))e='Format telefon salah';else if(d&&seen.has(d))e='Telefon sudah wujud';else if(join&&!/^\\d{4}-\\d{2}-\\d{2}$/.test(join))e='Tarikh mesti YYYY-MM-DD';\n  const ic=g(r,'ic'),addr=g(r,'addr');if(!e&&ic&&!icBday(ic))e='Nombor IC tidak sah';return {name,nick:nick||'',phone,state:state||'-',town:town||'-',join:join||iso(today0()),ic:ic?icFmt(ic):'',addr,note:g(r,'note'),bday:normDate(g(r,'bday')),ref:g(r,'ref'),e}});\n $('#imprev').innerHTML=importPreview();\n}\nfunction importPreview(){\n const rows=UI.importRows;if(!rows.length)return '<div class=\"empty\">Tiada data dijumpai. Tampal kandungan dan semak lagi.<\/div>';\n const ok=rows.filter(r=>!r.e).length;\n return '<h3>3. Keputusan semakan: '+ok+' sedia untuk import, '+(rows.length-ok)+' ada masalah<\/h3><div class=\"tbl-wrap\"><table><thead><tr><th>Nama<\/th><th>Nama Panggilan<\/th><th>Telefon<\/th><th>Negeri<\/th><th>Bandar<\/th><th>Tarikh sertai<\/th><th>Status<\/th><\/tr><\/thead><tbody>'+rows.map(r=>'<tr><td>'+esc(r.name)+'<\/td><td>'+esc(r.nick)+'<\/td><td>'+esc(r.phone)+'<\/td><td>'+esc(r.state)+'<\/td><td>'+esc(r.town)+'<\/td><td>'+esc(r.join)+'<\/td><td>'+(r.e?'<span class=\"pill bad\">'+esc(r.e)+'<\/span>':'<span class=\"pill ok\">OK<\/span>')+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div><div class=\"actions\"><button class=\"btn btn-teal\" onclick=\"submitImport()\"'+(ok?'':' disabled')+'>'+(isAdmin()?'Import '+ok+' rekod':'Hantar untuk semakan Admin ('+ok+' rekod)')+'<\/button><button class=\"btn btn-ghost\" onclick=\"UI.importRows=null;render()\">Kosongkan<\/button><\/div>';\n}\nfunction applyRows(rows){rows.forEach(r=>{const id='M'+pad(++S.seq.M,4);const nm={id,name:r.name,nick:r.nick||'',phone:r.phone,state:r.state,town:r.town,join:r.join,expiry:iso(addYears(parse(r.join),2)),tierOverride:null,batches:[],role:'customer',ic:r.ic||'',bday:r.ic?(icBday(r.ic)||r.bday||''):(r.bday||''),addr:r.addr||'',note:r.note||''};S.members.push(nm);if(r.ref){const rm=findRef(r.ref,nm.id);if(rm)refAward(nm,rm);else nm.note=(nm.note?nm.note+'; ':'')+'Dirujuk oleh: '+r.ref}})}\nfunction findRef(v,self){v=String(v||'').trim();if(!v)return null;const id=midFrom(v);let m=id&&S.members.find(x=>x.id===id&&x.id!==self);if(m)return m;const d=v.replace(/\\D/g,'');if(d.length>=9){m=S.members.find(x=>x.id!==self&&String(x.phone||'').replace(/\\D/g,'')===d);if(m)return m}const l=v.toLowerCase();return S.members.find(x=>x.id!==self&&(x.name.toLowerCase()===l||(x.nick&&x.nick.toLowerCase()===l)))||null}\nfunction normDate(s){s=String(s||'').trim();if(!s)return '';let m=s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2],2)+'-'+pad(+m[3],2);m=s.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})/);if(m){let a=+m[1],b2=+m[2];if(b2>12&&a<=12){const x=a;a=b2;b2=x}return m[3]+'-'+pad(b2,2)+'-'+pad(a,2)}return s.slice(0,10)}\nfunction submitImport(){\n const rows=UI.importRows.filter(r=>!r.e);if(!rows.length)return;\n if(isAdmin()){applyRows(rows);S.settings.firstImportDone=true;S.settings.importLocked=true;log('\\u5bfc\\u5165\\u4f1a\\u5458','Admin import terus: '+rows.length+' rekod');toast('Diimport '+rows.length+' ahli')}\n else{S.pendingImports.push({id:'I'+Date.now(),at:nowStamp(),by:session.user,rows});S.settings.importLocked=true;log('\\u63d0\\u4ea4\\u5bfc\\u5165',rows.length+' rekod, menunggu semakan Admin');toast('Dihantar. Menunggu semakan Admin')}\n UI.importRows=null;save();render();\n}\nfunction viewPending(id){const p=S.pendingImports.find(x=>x.id===id);openModal('Import menunggu semakan ('+p.rows.length+' rekod)','<div class=\"tbl-wrap\"><table><thead><tr><th>Nama<\/th><th>Nama Panggilan<\/th><th>Telefon<\/th><th>Negeri<\/th><th>Bandar<\/th><th>Tarikh sertai<\/th><\/tr><\/thead><tbody>'+p.rows.map(r=>'<tr><td>'+esc(r.name)+'<\/td><td>'+esc(r.nick||'')+'<\/td><td>'+esc(r.phone)+'<\/td><td>'+esc(r.state)+'<\/td><td>'+esc(r.town)+'<\/td><td>'+esc(r.join)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>','<button class=\"btn btn-ghost\" onclick=\"closeModal()\">Tutup<\/button><button class=\"btn btn-teal\" onclick=\"closeModal();approveImport(\\''+id+'\\')\">Semak & Import<\/button>',true)}\nfunction approveImport(id){const p=S.pendingImports.find(x=>x.id===id);const seen=new Set(S.members.map(m=>String(m.phone||'').replace(/\\D/g,'')));const rows=p.rows.filter(r=>!seen.has(r.phone.replace(/\\D/g,'')));\n applyRows(rows);S.pendingImports=S.pendingImports.filter(x=>x.id!==id);S.settings.firstImportDone=true;S.settings.importLocked=true;log('\\u6838\\u5b9e\\u5bfc\\u5165','Lulus '+(USERS[p.by]?D(USERS[p.by].name):p.by)+' hantaran: '+rows.length+' rekod');save();render();toast('Disemak dan diimport '+rows.length+' ahli')}\nfunction rejectImport(id){S.pendingImports=S.pendingImports.filter(x=>x.id!==id);S.settings.importLocked=!S.settings.firstImportDone?false:true;log('\\u9000\\u56de\\u5bfc\\u5165',id);save();render();toast('Ditolak')}\nfunction unlockImport(){S.settings.importLocked=false;log('\\u5f00\\u653e\\u5bfc\\u5165','Benarkan staf satu import lagi');save();render();toast('Satu import lagi dibenarkan')}\nfunction csvCell(v){v=String(v==null?'':v);return /[\",\\n]/.test(v)?'\"'+v.replace(/\"/g,'\"\"')+'\"':v}\nfunction exportCSV(kind){\n C=computeAll();let rows,title;\n if(kind==='members'){title='Senarai ahli';rows=[['ID','Nama','Nama Panggilan','Telefon','Negeri','Bandar','Tarikh sertai','Tamat keahlian','Tahap','Jumlah belanja','Mata tersedia','Nilai mata','Peranan','No. IC','Hari jadi','Alamat','Catatan','Dirujuk oleh']].concat(S.members.map(m=>{const c=C[m.id];return [dispId(m.id),m.name,m.nick||'',m.phone,m.state,m.town,m.join,m.expiry,D(c.tier.name),c.spend.toFixed(2),c.avail,c.value.toFixed(2),mRoleName(mRole(m)),m.ic?icFmt(m.ic):'',m.bday||'',m.addr||'',m.note||'',m.refBy?dispId(m.refBy):'']}))}\n else if(kind==='sales'){title='Jualan';rows=[['Ruj.','Tarikh','ID Ahli','Nama ahli','Produk','Kuantiti','Jumlah','Mata','Oleh']].concat(S.sales.map(s=>[s.id,s.date,dispId(s.mid),mName(s.mid),pName(s.pid),s.qty,s.amount.toFixed(2),s.pts,s.by]))}\n else{title='Tebusan';rows=[['Ruj.','Tarikh','ID Ahli','Nama ahli','Tahap','Tebus Mata','Nilai tunai','Oleh']].concat(S.redemptions.map(r=>[r.id,r.date,dispId(r.mid),mName(r.mid),D(r.tier),r.pts,r.cash.toFixed(2),r.by]))}\n const csv=rows.map(r=>r.map(csvCell).join(',')).join('\\n');\n log('\\u5bfc\\u51fa CSV',title+' ('+(rows.length-1)+' rekod)');save();\n LASTCSV={name:title+'-'+iso(today0())+'.csv',text:csv};\n openModal('Eksport: '+title,'<p class=\"small muted\">Jumlah '+(rows.length-1)+' rekod.'+(DL?' Klik “Muat Turun CSV” untuk simpan. Ia boleh dibuka dalam Excel.':' Klik “Salin”, tampal dalam Notepad dan simpan sebagai .csv (pengekodan UTF-8), kemudian buka dalam Excel.')+'<\/p><textarea id=\"csvout\" rows=\"12\" readonly>'+esc(csv)+'<\/textarea>','<button class=\"btn btn-ghost\" onclick=\"closeModal()\">Tutup<\/button><button class=\"btn btn-ghost\" onclick=\"copyText(\\'csvout\\')\">Salin<\/button>'+(DL?'<button class=\"btn btn-blue\" onclick=\"saveFile(LASTCSV.name,\\'\\\\uFEFF\\'+LASTCSV.text)\">Muat Turun CSV<\/button>':''),true);\n}\nfunction copyText(id){const el=document.getElementById(id);const done=()=>toa "], \"Sarawak\": [\"Kuching\", \"Miri\", \"Sibu\", \"Bintulu\", \"Sri Aman\", \"Sarikei\", \"Kapit\", \"Mukah\", \"Limbang\", \"Betong\", \"Serian\", \"Bau\", \"Lawas\", \"Saratok\"], \"W.P. Kuala Lumpur\": [\"Cheras\", \"Kepong\", \"Setapak\", \"Sentul\", \"Bangsar\", \"Wangsa Maju\", \"Segambut\", \"Bukit Jalil\", \"Sri Petaling\", \"Batu\"], \"W.P. Putrajaya\": [\"Putrajaya\"], \"W.P. Labuan\": [\"Labuan\"]};\n\nfunction townSuggest(changed){const s=$('#fs'),t=$('#ft');if(!s||!t)return;const list=TOWNS[s.value]||[];\n if(changed){const v=t.value.trim();if(v&&list.indexOf(v)<0&&Object.keys(TOWNS).some(k=>TOWNS[k].indexOf(v)>=0))t.value=''}\n const dl=$('#ftl');if(dl)dl.innerHTML=list.map(x=>'<option value=\"'+esc(x)+'\">').join('');\n t.placeholder=list.length?'Contoh: '+list[0]:'';\n const ch=$('#ftchips');if(ch)ch.innerHTML=list.slice(0,8).map(x=>'<button type=\"button\" class=\"'+(t.value===x?'on':'')+'\" onclick=\"townPick(this)\">'+esc(x)+'<\/button>').join('')}\nfunction townPick(b){const t=$('#ft');if(t){t.value=b.textContent;townMark()}}\ntry{new MutationObserver(()=>{const c=document.getElementById('ftchips');if(c&&!c.dataset.init){c.dataset.init='1';townSuggest(false)}}).observe(document.body,{childList:true,subtree:true})}catch(e){}\nfunction townMark(){const t=$('#ft');document.querySelectorAll('#ftchips button').forEach(b=>b.classList.toggle('on',!!t&&b.textContent===t.value))}\n\n/* ============ Downloads (optional capability) ============ */\nlet DL=null,LASTCSV=null;\n(async()=>{try{if(window.claude&&claude.use)DL=await claude.use('downloads')}catch(e){DL=null}if(DL&&session&&/signup/.test(location.hash))render()})();\nasync function saveFile(name,data){\n if(!DL){toast('Muat turun tidak tersedia di sini. Sila guna Salin.');return}\n try{await DL.save({filename:name,data});toast('Dimuat turun '+name)}\n catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('Sila tunggu sebentar dan cuba lagi.');return}toast('Muat turun tidak tersedia buat masa ini. Sila guna Salin.')}\n}\nfunction copyStr(s){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast('Disalin')).catch(()=>toast('Gagal salin. Sila pilih secara manual'));else toast('Gagal salin. Sila pilih secara manual')}\n\n/* ============ Member sign-up (QR) ============ */\nfunction srcText(id){const el=document.getElementById(id);return el?el.textContent.replace(/^\\n/,'').replace(/<\\\\\\/script/g,'<\\/script'):''}\nconst SG_FLOW='<ol class=\"flow\"><li><b>Ahli imbas<\/b><span>Poster QR di kedai<\/span><\/li><li><b>Isi di telefon<\/b><span>Nama, nama panggilan, telefon, kawasan<\/span><\/li><li><b>Disimpan ke Google Sheets<\/b><span>Data di awan, tidak hilang<\/span><\/li><li><b>Admin semak<\/b><span>Import melalui “Import / Eksport”<\/span><\/li><li><b>Menjadi ahli<\/b><span>Mula kumpul mata<\/span><\/li><\/ol>';\nfunction vSignup(){\n const t=UI.sgtab;\n return '<div class=\"page-head\"><div><h1>Pendaftaran Ahli<\/h1><p>Ahli imbas kod QR dan daftar sendiri di telefon. Data masuk ke Google Sheets dahulu, kemudian Admin semak dan import ke dalam sistem.<\/p><\/div><\/div>'+\n '<div class=\"tabs\" role=\"tablist\"><button class=\"tab'+(t==='cloud'?' on':'')+'\" onclick=\"UI.sgtab=\\'cloud\\';render()\">Cara 1: Laman web pendaftaran (disyorkan)<\/button><button class=\"tab'+(t==='auto'?' on':'')+'\" onclick=\"UI.sgtab=\\'auto\\';render()\">Cara 2: Google Form automatik<\/button><button class=\"tab'+(t==='form'?' on':'')+'\" onclick=\"UI.sgtab=\\'form\\';render()\">Cara 3: Buat Google Form sendiri<\/button><\/div>'+\n '<section class=\"panel\"><h2>Aliran pendaftaran<\/h2>'+SG_FLOW+'<\/section>'+(t==='auto'?sgAuto():t==='form'?sgForm():sgCloud());\n}\nfunction sgForm(){\n const q=[['Nama','Jawapan pendek','Ya'],['Nama Panggilan','Jawapan pendek','Tidak'],['Telefon','Jawapan pendek','Ya'],['Negeri','Senarai juntai bawah','Ya'],['Bandar / Kawasan','Jawapan pendek','Ya']];\n return '<div class=\"cols\"><section class=\"panel\"><h2>Langkah tetapan (kira-kira 10 minit)<\/h2><ol class=\"rules\">'+\n '<li>Guna akaun Google kedai, buka <b>forms.google.com<\/b>, cipta “Borang kosong” dan beri tajuk “'+esc(COMPANY.name)+' Pendaftaran Ahli”.<\/li>'+\n '<li>Tambah 5 soalan dalam jadual di sebelah kanan. <b>Nama soalan mesti sama tepat<\/b>, supaya sistem kenal semasa import.<\/li>'+\n '<li>Untuk “Negeri” pilih Senarai juntai bawah. Klik butang di bawah untuk salin senarai negeri dan tampal dalam pilihan pertama. Ia menjadi 13 pilihan secara automatik.<\/li>'+\n '<li>Pergi ke “Tetapan > Respons” dan <b>jangan<\/b> hidupkan “Hadkan kepada 1 respons”, supaya ahli tanpa akaun Google masih boleh isi.<\/li>'+\n '<li>Klik “Hantar” (atas kanan) > ikon pautan > tanda “Pendekkan URL” > Salin, dan tampal dalam kotak di bawah.<\/li>'+\n '<li>Pergi ke “Respons” > “Lihat dalam Sheets”. Pendaftaran masuk ke helaian secara automatik.<\/li>'+\n '<li>Untuk import: dalam helaian, “Fail > Muat turun > CSV”, kemudian pergi ke <a href=\"#import\">Import / Eksport<\/a>, pilih fail itu, semak dan import.<\/li><\/ol>'+\n '<div><button class=\"btn btn-ghost btn-sm\" onclick=\"copyStr(STATES.join(\\'\\\\n\\'))\">Salin Senarai Negeri<\/button><\/div><\/section>'+\n '<section class=\"panel\"><h2>Soalan borang<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Nama soalan<\/th><th>Jenis<\/th><th>Wajib<\/th><\/tr><\/thead><tbody>'+q.map(r=>'<tr><td><b>'+r[0]+'<\/b><\/td><td>'+r[1]+'<\/td><td>'+r[2]+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div><p class=\"small muted\">Kebaikan: tiada kod, boleh guna terus. Keburukan: halaman guna gaya Google, dan tidak dapat sekat telefon yang sama mendaftar dua kali (pendua hanya dikesan semasa import).<\/p><\/section><\/div>'+\n qrPanel('form','Tampal pautan Google Form','https://forms.gle/…');\n}\nfunction qrPanel(k,label,ph){\n const url=S.settings[k+'Url']||'';\n return '<section class=\"panel\"><h2>Poster QR<\/h2><div class=\"sg-link\"><label class=\"f\" style=\"flex:1\">'+label+'<input id=\"sgurl-'+k+'\" value=\"'+esc(url)+'\" placeholder=\"'+ph+'\" inputmode=\"url\"'+(isAdmin()?'':' readonly')+'><\/label>'+(isAdmin()?'<button class=\"btn btn-teal\" onclick=\"saveSgUrl(\\''+k+'\\')\">Jana Kod QR<\/button>':'<span class=\"small muted\">Hanya Admin boleh menetapkan pautan QR.<\/span>')+'<\/div><div id=\"sgerr-'+k+'\" class=\"err\" hidden><\/div>'+\n (url?'<div class=\"sg-out\"><div class=\"poster\"><div class=\"poster-top\">'+LEAF+'<span>'+esc(COMPANY.name)+'<\/span><\/div><div class=\"poster-body\"><h3>Imbas untuk jadi ahli<\/h3><p>Percuma untuk sertai · Kumpul mata setiap pembelian<\/p><div class=\"qr-box\" id=\"sgqr\"><\/div><p class=\"small muted\">Telefon '+esc(COMPANY.phone)+'<\/p><\/div><\/div><div class=\"sg-side\"><p class=\"small muted\">Poster dicetak seperti ini. Letak di kaunter, di sebelah mesin tunai, atau kongsi dalam kumpulan WhatsApp.<\/p><p class=\"small\" style=\"word-break:break-all\">'+esc(url)+'<\/p><div class=\"actions\">'+(DL?'<button class=\"btn btn-blue\" onclick=\"downloadPoster()\">Muat Turun Gambar Poster<\/button>':'')+'<button class=\"btn btn-ghost\" onclick=\"copyStr(S.settings.'+k+'Url)\">Salin Pautan<\/button><a class=\"btn btn-ghost\" href=\"'+esc(url)+'\" target=\"_blank\" rel=\"noopener\">Buka untuk Uji<\/a><\/div>'+(DL?'':'<p class=\"small muted\">Muat turun gambar tidak tersedia di sini. Ambil tangkapan skrin poster.<\/p>')+(k==='cloud'?'<details class=\"qrhelp\"><summary>Kod QR tidak buka laman pendaftaran?<\/summary><ol><li>Semasa deploy, Who has access mesti Anyone, bukan Only myself.<\/li><li>Alamat mesti berakhir dengan /exec; yang berakhir /dev hanya dibuka untuk anda.<\/li><li>Selepas ubah kod, deploy New version supaya pelanggan nampak laman baharu.<\/li><\/ol><\/details>':'<details class=\"qrhelp\"><summary>Kod QR tidak buka borang?<\/summary><ol><li>Dalam Google Forms, tekan Terbitkan di atas kanan. Borang baharu yang belum diterbitkan tidak boleh dilihat pelanggan.<\/li><li>Di sebelah Terbitkan, buka Responden dan pilih Sesiapa yang ada pautan.<\/li><li>Di tab Respons, pastikan Terima respons dihidupkan.<\/li><li>Pautan yang ditampal mesti forms.gle atau berakhir dengan /viewform, bukan /edit.<\/li><li>Selepas betulkan, tekan Buka ujian di telefon atau imbas semula. Jika telefon log masuk akaun Google lain, cuba tab inkognito.<\/li><\/ol><\/details>')+'<\/div><\/div>':'<div class=\"empty\">Selepas tampal pautan, poster QR yang boleh dicetak akan muncul di sini.<\/div>')+'<\/section>';\n}\nfunction saveSgUrl(k){if(!isAdmin()){toast('Hanya Admin boleh membuat perubahan.');return}const v=$('#sgurl-'+k).value.trim();const e=$('#sgerr-'+k);\n if(!/^https:\\/\\/\\S+$/.test(v)){e.textContent='Pautan mesti bermula dengan https://. Sila salin pautan penuh dari Google.';e.hidden=false;return}\n if(k==='cloud'&&!/^https:\\/\\/script\\.google\\.com\\/.+\\/exec(\\?.*)?$/.test(v)){e.textContent='Alamat web app mesti berakhir dengan /exec. Salin dari Deploy → Manage deployments dalam Apps Script.';e.hidden=false;return}let v2=v;const em=v.match(/^https:\\/\\/docs\\.google\\.com\\/forms\\/(u\\/\\d+\\/)?d\\/(?!e\\/)([\\w-]+)\\/(edit|prefill)[^]*$/);if(em){v2='https://docs.google.com/forms/d/'+em[2]+'/viewform';toast('Itu pautan EDIT borang, pelanggan tidak boleh buka. Ia telah ditukar kepada pautan isi borang.')}S.settings[k+'Url']=v2;log('\\u8bbe\\u5b9a\\u62a5\\u540d\\u94fe\\u63a5',(k==='form'?'Google Form':'Halaman daftar awan')+': '+v2);save();render();if(!em)toast('Kod QR dijana')}\nfunction afterSignup(){\n const g=$('#code-gs'),i=$('#code-idx');if(g)g.value=srcText('src-gs');if(i)i.value=srcText('src-idx');\n const url=S.settings[UI.sgtab+'Url'],box=$('#sgqr');\n if(url&&box){try{if(window.QRCode)new QRCode(box,{text:url,width:480,height:480,colorDark:'#153A5A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else box.innerHTML='<p class=\"small\" style=\"color:#153A5A;padding:20px\">Alat QR gagal dimuat. Sila muat semula halaman.<\/p>'}catch(e){}}\n}\nfunction downloadPoster(){\n const qc=$('#sgqr canvas');if(!qc){toast('Kod QR belum dijana');return}\n const W=900,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');\n const F='\"Noto Sans SC\",\"Inter\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n x.fillStyle='#ffffff';x.fillRect(0,0,W,H);x.fillStyle='#153A5A';x.fillRect(0,0,W,170);\n x.fillStyle='#ffffff';x.textAlign='center';x.font='700 56px '+F;x.fillText(COMPANY.name,W/2,108);\n x.fillStyle='#17293A';x.font='700 72px '+F;x.fillText('Imbas untuk jadi ahli',W/2,290);\n x.fillStyle='#0F807B';x.font='500 36px '+F;x.fillText('Percuma untuk sertai · Kumpul mata setiap pembelian',W/2,350);\n x.imageSmoothingEnabled=false;x.drawImage(qc,(W-560)/2,400,560,560);\n x.fillStyle='#566878';x.font='500 34px '+F;x.fillText('Ada soalan? Hubungi '+COMPANY.phone,W/2,1050);\n x.fillStyle='#0F807B';x.fillRect(0,H-24,W,24);\n c.toBlob(b=>{if(b)saveFile(COMPANY.name+'-QR-daftar-ahli.png',b)},'image/png');\n}\n\n/* ============ Backup ============ */\nfunction vBackup(){\n const rows=S.backups.map(b=>'<tr><td class=\"nw\">'+esc(b.at)+'<\/td><td>'+(b.kind==='auto'?'<span class=\"pill info\">Automatik bulanan<\/span>':'<span class=\"pill line\">Manual<\/span>')+'<\/td><td class=\"r\">'+b.members+'<\/td><td class=\"r\">'+b.sales+'<\/td><td class=\"r nw\"><button class=\"btn btn-ghost btn-sm\" onclick=\"showBackup(\\''+b.id+'\\')\">Lihat Data<\/button> <button class=\"btn btn-ghost btn-sm\" onclick=\"restoreBackup(\\''+b.id+'\\')\">Pulih<\/button><\/td><\/tr>').join('');\n return '<div class=\"page-head\"><div><h1>Sandaran<\/h1><p>Sistem membuat sandaran automatik kali pertama dibuka setiap bulan dan menyimpan 12 terkini. Pemulihan tidak memadam log audit.<\/p><\/div><div class=\"actions\"><button class=\"btn btn-blue\" onclick=\"makeBackup(\\'manual\\');log(\\'\\u624b\\u52a8\\u5907\\u4efd\\',\\'\\');save();render();toast(\\'Sandaran dicipta\\')\">Sandar Sekarang<\/button><\/div><\/div>'+\n '<section class=\"panel\">'+(rows?'<div class=\"tbl-wrap\"><table><thead><tr><th>Dicipta<\/th><th>Jenis<\/th><th class=\"r\">Ahli<\/th><th class=\"r\">Bilangan jualan<\/th><th><\/th><\/tr><\/thead><tbody>'+rows+'<\/tbody><\/table><\/div>':'<div class=\"empty\">Belum ada sandaran.<\/div>')+'<\/section>'+\n '<section class=\"panel\"><h2>Data contoh<\/h2><p class=\"small muted\">Set semula sistem kepada ahli dan jualan contoh asal. Berguna untuk mula semula selepas mencuba.<\/p><div><button class=\"btn btn-ghost\" onclick=\"resetDemo()\">Set Semula ke Data Contoh<\/button><\/div><p class=\"small muted\" style=\"margin-top:14px\">Padam semua ahli, jualan dan tebusan untuk bersedia mengimport data pelanggan sebenar. Produk, tetapan tahap dan akaun pengguna dikekalkan.<\/p><div><button class=\"btn btn-red\" onclick=\"clearMembers()\">Kosongkan Ahli & Jualan<\/button><\/div><\/section>'+\n '<p class=\"note\">Ini versi percubaan: data hanya disimpan dalam pelayar komputer ini. Untuk kegunaan sebenar, ia perlu disambung ke pangkalan data syarikat atau pelayan awan supaya sandaran disimpan dengan selamat secara automatik.<\/p>';\n}\nfunction showBackup(id){const b=S.backups.find(x=>x.id===id);openModal('Sandaran '+b.at,'<p class=\"small muted\">Salin dan simpan sebagai fail .json untuk disimpan berasingan.<\/p><textarea id=\"bkout\" rows=\"12\" readonly>'+esc(b.data)+'<\/textarea>','<button class=\"btn btn-ghost\" onclick=\"closeModal()\">Tutup<\/button><button class=\"btn btn-blue\" onclick=\"copyText(\\'bkout\\')\">Salin<\/button>',true)}\nfunction restoreBackup(id){const b=S.backups.find(x=>x.id===id);confirmBox('Pulihkan Sandaran','Data akan kembali kepada keadaan <b>'+esc(b.at)+'<\/b> ('+b.members+' ahli, '+b.sales+' jualan). Apa-apa yang ditambah selepas itu akan hilang.','Sahkan Pemulihan',()=>{const d=JSON.parse(b.data);const keep={backups:S.backups,audit:S.audit,users:S.users};S={...d,...keep};ensureUsers();if(!S.nickZh){const NZ={'Ah Ming':'\\u963f\\u660e','Sis Mei Ling':'\\u7f8e\\u73b2\\u59d0','Ah Keong':'\\u963f\\u5f3a','Lee Fong':'\\u4e3d\\u82b3','Ah Hoe':'\\u963f\\u8c6a','Bro Huat':'\\u53d1\\u54e5','Ah Kok':'\\u56fd\\u4ed4','Sis Sook Fun':'\\u6dd1\\u82ac\\u59d0','Ah Kiat':'\\u963f\\u6770','Poh Choo':'\\u5b9d\\u73e0','Ah Wei':'\\u963f\\u4f1f','Guat Ngoh':'\\u6708\\u5a25','Uncle Hock':'\\u798f\\u4f2f','Sis Kim Lian':'\\u91d1\\u83b2\\u59d0','Bro Loong':'\\u9f99\\u54e5','Ah Leong':'\\u963f\\u826f','Tai Seng':'\\u5927\\u6210','Geok Moy':'\\u7389\\u6885','Keong Boy':'\\u5fd7\\u5f3a\\u4ed4'};S.members.forEach(m=>{if(m.nick&&NZ[m.nick])m.nick=NZ[m.nick]});S.nickZh=true}log('\\u6062\\u590d\\u5907\\u4efd',b.at);save();render();toast('Sandaran dipulihkan')},true)}\nfunction clearMembers(){confirmBox('Kosongkan Ahli & Jualan','Semua ahli, jualan dan tebusan akan dipadam dan tidak boleh dipulihkan. Klik “Sandar Sekarang” dahulu.','Sahkan Kosongkan',()=>{const n=S.members.length;S.members=[];S.sales=[];S.redemptions=[];S.pendingImports=[];S.seq.M=0;S.seq.S=0;S.seq.R=0;S.settings.firstImportDone=false;S.settings.importLocked=false;log('\\u6e05\\u7a7a\\u4f1a\\u5458\\u8d44\\u6599',n+' members');save();render();toast('Sudah dikosongkan. Anda boleh import data pelanggan sekarang.')},true)}\nfunction resetDemo(){confirmBox('Set Semula Data Contoh','Semua ahli, jualan, tebusan, sandaran dan log akan diganti dengan data contoh.','Sahkan Set Semula',()=>{const sess=session,us=S.users;seedData();S.users=us;ensureUsers();if(!S.nickZh){const NZ={'Ah Ming':'\\u963f\\u660e','Sis Mei Ling':'\\u7f8e\\u73b2\\u59d0','Ah Keong':'\\u963f\\u5f3a','Lee Fong':'\\u4e3d\\u82b3','Ah Hoe':'\\u963f\\u8c6a','Bro Huat':'\\u53d1\\u54e5','Ah Kok':'\\u56fd\\u4ed4','Sis Sook Fun':'\\u6dd1\\u82ac\\u59d0','Ah Kiat':'\\u963f\\u6770','Poh Choo':'\\u5b9d\\u73e0','Ah Wei':'\\u963f\\u4f1f','Guat Ngoh':'\\u6708\\u5a25','Uncle Hock':'\\u798f\\u4f2f','Sis Kim Lian':'\\u91d1\\u83b2\\u59d0','Bro Loong':'\\u9f99\\u54e5','Ah Leong':'\\u963f\\u826f','Tai Seng':'\\u5927\\u6210','Geok Moy':'\\u7389\\u6885','Keong Boy':'\\u5fd7\\u5f3a\\u4ed4'};S.members.forEach(m=>{if(m.nick&&NZ[m.nick])m.nick=NZ[m.nick]});S.nickZh=true}session=sess;makeBackup('auto');log('\\u91cd\\u7f6e\\u793a\\u4f8b\\u8d44\\u6599','');save();render();toast('Set semula selesai')},true)}\n\n/* ============ Audit ============ */\nfunction vAudit(){\n const users=[...new Set(S.audit.map(a=>a.user))];\n return '<div class=\"page-head\"><div><h1>Log Audit<\/h1><p>Merekod setiap tambah, padam, pembelian, tebusan, import, perubahan tetapan dan log masuk.<\/p><\/div><\/div><section class=\"panel\"><div class=\"filters\" style=\"grid-template-columns:2fr 1fr\"><input id=\"aq\" placeholder=\"Cari tindakan atau butiran\" value=\"'+esc(UI.aq)+'\" oninput=\"UI.aq=this.value;drawAudit()\"><select id=\"auser\" onchange=\"UI.auser=this.value;drawAudit()\"><option value=\"\">Semua pengguna<\/option>'+users.map(u=>'<option value=\"'+esc(u)+'\"'+(UI.auser===u?' selected':'')+'>'+esc(USERS[u]?D(USERS[u].name):u)+'<\/option>').join('')+'<\/select><\/div><div id=\"atable\">'+auditTable()+'<\/div><\/section>';\n}\nfunction drawAudit(){$('#atable').innerHTML=auditTable()}\nfunction auditTable(){const q=UI.aq.trim().toLowerCase();const l=S.audit.filter(a=>(!UI.auser||a.user===UI.auser)&&(!q||(a.action+a.detail).toLowerCase().includes(q))).slice().reverse();\n if(!l.length)return '<div class=\"empty\">Tiada rekod sepadan.<\/div>';\n return '<p class=\"small muted\">Jumlah '+l.length+' entri (papar 400 terkini)<\/p><div class=\"tbl-wrap\"><table><thead><tr><th>Masa<\/th><th>Pengguna<\/th><th>Tindakan<\/th><th>Butiran<\/th><\/tr><\/thead><tbody>'+l.slice(0,400).map(a=>'<tr><td class=\"nw num\">'+esc(a.at)+'<\/td><td class=\"nw\">'+esc(USERS[a.user]?D(USERS[a.user].name):a.user)+'<\/td><td class=\"nw\"><b>'+esc(D(a.action))+'<\/b><\/td><td>'+esc(DA(a.detail))+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>'}\n\n/* ============ Public landing page ============ */\nconst COMPANY={name:'MA PLANTATION 永發肥料企業',en:'Pembekal Baja & Racun Perosak',phone:'012-345 6789',wa:'60123456789',addr:'No. 12, Jalan Pasar Baru, 45300 Sungai Besar, Selangor',hours:'Isnin – Sabtu 8:00pg – 6:00ptg · Ahad 8:00pg – 12:30tgh'};\nfunction renderSite(){\n const fert=Object.keys(FERT_TYPES).map(k=>{const ps=S.products.filter(p=>p.kind==='fert'&&p.cat===k);return ps.length?'<div class=\"cat\"><h3>'+D(k)+'<\/h3><p class=\"small muted\">'+D(FERT_TYPES[k])+'<\/p><ul>'+ps.map(p=>'<li>'+esc(D(p.name))+'<\/li>').join('')+'<\/ul><\/div>':''}).join('');\n const pest=Object.keys(PEST_GRADES).map(k=>{const ps=S.products.filter(p=>p.kind==='pest'&&p.grade===k);return ps.length?'<div class=\"cat\"><h3>'+D(k)+'<\/h3><p class=\"small muted\">'+D(PEST_GRADES[k])+'<\/p><ul>'+ps.map(p=>'<li>'+esc(D(p.name))+' ('+esc(D(p.cat))+')<\/li>').join('')+'<\/ul><\/div>':''}).join('');\n $('#root').innerHTML='<div class=\"site\"><header class=\"site-top site-band\"><div class=\"site-in\"><div class=\"brand\"><div class=\"brand-mark\">'+LEAF+'<\/div><div><div class=\"brand-name\">MA PLANTATION<small>永發肥料企業<\/small><\/div><div class=\"brand-sub\">'+COMPANY.en+'<\/div><\/div><\/div><div class=\"site-lang\">'+LANGBAR('site')+'<a href=\"#dashboard\" class=\"small\">Log masuk sistem ahli →<\/a><\/div><\/div><\/header>'+\n '<section class=\"site-hero site-band\"><div class=\"site-in\"><div class=\"hero-copy\"><span class=\"small\" style=\"letter-spacing:.08em;color:var(--side-muted)\">Baja · Racun Perosak · Nasihat Tanaman<\/span><h1>Hasil yang baik bermula dengan baja yang betul<\/h1><p>Kami membekalkan baja sebatian, baja khas, baja organik dan racun perosak semua gred kepada pesawah padi, pekebun kelapa sawit dan petani sayur, serta mencadangkan campuran yang sesuai untuk tanaman dan tanah anda. Ahli kumpul mata setiap pembelian dan boleh tebus untuk diskaun tunai bila-bila masa.<\/p><\/div>'+\n '<div class=\"contact-card\"><h2>Pesan melalui telefon / WhatsApp<\/h2><div class=\"phone\" id=\"phone\">'+COMPANY.phone+'<\/div><div class=\"actions\"><button class=\"btn btn-teal\" onclick=\"copySitePhone()\">Salin Nombor Telefon<\/button><a class=\"btn btn-ghost\" href=\"https://wa.me/'+COMPANY.wa+'?text='+encodeURIComponent('Hai, saya ingin bertanya tentang baja dan racun perosak')+'\" target=\"_blank\" rel=\"noopener\">Buka WhatsApp<\/a><\/div><div class=\"qr-box\" id=\"qr\" aria-label=\"Kod QR pesanan WhatsApp\"><\/div><p class=\"small muted\" style=\"text-align:center\">Imbas kod QR dengan telefon untuk memesan melalui WhatsApp<\/p><\/div><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Baja (ikut jenis pembajaan)<\/h2><div class=\"site-cats\">'+fert+'<\/div><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Racun perosak (ikut gred)<\/h2><div class=\"site-cats\">'+pest+'<\/div><p class=\"small muted\">Semua racun perosak adalah produk berdaftar. Baca label sebelum guna dan ikut dos yang disyorkan.<\/p><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Mata Ahli<\/h2><div class=\"site-cats\">'+S.tiers.map(t=>'<div class=\"cat\"><h3 style=\"color:var('+t.color+')\">'+D(t.name)+'<\/h3><p>Jumlah belanja: '+(t.min?''+RM(t.min):'apa-apa jumlah')+'<\/p><p class=\"small muted\">Setiap 1,000 mata = '+RM(1000*t.rate)+'<\/p><\/div>').join('')+'<\/div><p class=\"small muted\">Dapat '+S.settings.earn+' mata bagi setiap RM 1 · Mata dan keahlian sah 2 tahun<\/p><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Alamat kedai<\/h2><div class=\"cat\"><p><b>'+COMPANY.addr+'<\/b><\/p><p class=\"small muted\">'+COMPANY.hours+'<\/p><\/div><\/div><\/section>'+\n '<footer class=\"site-foot site-band\"><div class=\"site-in\">© '+new Date().getFullYear()+' '+COMPANY.name+' '+COMPANY.en+' · Laman web demo, butiran syarikat ialah contoh<\/div><\/footer><\/div>';\n try{if(window.QRCode)new QRCode(document.getElementById('qr'),{text:'https://wa.me/'+COMPANY.wa+'?text='+encodeURIComponent('Hai, saya ingin memesan baja/racun perosak'),width:360,height:360,colorDark:'#153A5A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else $('#qr').innerHTML='<p class=\"small\" style=\"color:#153A5A\">Kod QR sedang dimuat. Sila muat semula sebentar lagi.<\/p>'}catch(e){}\n window.scrollTo(0,0);\n}\nfunction copySitePhone(){const t=COMPANY.phone;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Disalin '+t)).catch(()=>{selectEl($('#phone'));toast('Tekan Ctrl+C untuk salin')});else{selectEl($('#phone'));toast('Tekan Ctrl+C untuk salin')}}\n\nrender();\nmaSbPull(function(remote){MA_SYNCED=true;if(remote){S=remote;if(S.users)USERS=S.users;ensureUsers();render()}else{maSbPush()}});\n<\/script>\n\n",
en:"\n<title>MA PLANTATION 永發肥料企業 Member System<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap\">\n\n<style>\n/* Layout: fixed left sidebar of large nav buttons, wide right work area; natural blue / teal / orange */\n:root{\n  --bg:#F1F5F7; --surface:#FFFFFF; --surface-2:#F6F9FA; --ink:#17293A; --muted:#566878; --line:#D9E2E8;\n  --blue:#1D5C93; --blue-soft:#E2EDF7; --teal:#0F807B; --teal-soft:#DBF1EF; --orange:#DB6F12; --orange-soft:#FFF6EC; --orange-line:#F4D6B6; --orange-ink:#A3520D;\n  --red:#BE3D27; --red-soft:#FAE1DB; --on-accent:#FFFFFF;\n  --side:#153A5A; --side-ink:#DCE8F2; --side-muted:#8EA8BF; --side-hover:#1D4A72; --side-active:#0F807B;\n  --tier-std:#64798C; --tier-silver:#6F86A0; --tier-gold:#B97E0B; --tier-plat:#0F807B;\n  --font:\"Inter\",\"Noto Sans SC\",system-ui,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;\n  --fs:21px; --fs-sm:18px; --fs-h1:33px; --fs-h2:24px; --ctl-h:54px; --radius:10px;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0E171F; --surface:#15222E; --surface-2:#192836; --ink:#E3ECF3; --muted:#93A6B7; --line:#273A4B;\n  --blue:#5EA2DE; --blue-soft:#1A3248; --teal:#3BC0B7; --teal-soft:#123532; --orange:#F2963F; --orange-soft:#3A2512;\n  --red:#F07A62; --red-soft:#3D1E18; --on-accent:#0E171F;\n  --side:#0A1218; --side-ink:#D6E2EC; --side-muted:#7D93A6; --side-hover:#15222E; --side-active:#3BC0B7;\n  --tier-std:#90A3B4; --tier-silver:#A2B6CC; --tier-gold:#E2AE45; --tier-plat:#3BC0B7; --orange-soft:#2B1E12; --orange-line:#4D341B; --orange-ink:#F3A762; color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0E171F; --surface:#15222E; --surface-2:#192836; --ink:#E3ECF3; --muted: .addMetaTag('viewport', 'width=device-width, initial-scale=1');\n}\n\n/** Add the Member Sign-up menu when the sheet opens */\nfunction onOpen() {\n  SpreadsheetApp.getUi()\n    .createMenu('Member Sign-up')\n    .addItem('Mark all Pending as Imported', 'markImported')\n    .addToUi();\n  getSheet_();\n}\n\nfunction getSheet_() {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  let sh = ss.getSheetByName(SHEET_NAME);\n  if (!sh) {\n    sh = ss.insertSheet(SHEET_NAME);\n    sh.appendRow(HEADERS);\n    sh.setFrozenRows(1);\n    sh.getRange(1, 1, 1, HEADERS.length).setFontWeight('bold').setBackground('#DBF1EF');\n    sh.getRange('E:E').setNumberFormat('@'); // keep phone as text so the leading 0 is not lost\n  }\n  return sh;\n}\n\n/** Stop input starting with = + - @ from becoming a formula */\nfunction safe_(v, max) {\n  let s = String(v == null ? '' : v).trim().slice(0, max || 60);\n  if (/^[=+\\-@]/.test(s)) s = \"'\" + s;\n  return s;\n}\n\n/** Runs when the sign-up page is submitted */\nfunction submitSignup(form) {\n  if (form && form.website) return { ok: true, ref: '-' }; // anti-bot\n  const name = safe_(form.name, 60);\n  const nick = safe_(form.nick, 30);\n  const phone = String(form.phone || '').trim();\n  const digits = phone.replace(/\\D/g, '');\n  const state = safe_(form.state, 40);\n  const town = safe_(form.town, 60);\n\n  if (!name) throw new Error('Please enter a name.');\n  if (digits.length < 9 || digits.length > 11) throw new Error('Phone number must have 9 to 11 digits.');\n  if (!state) throw new Error('Please choose a state.');\n  if (!town) throw new Error('Please enter a town or area.');\n  if (!form.agree) throw new Error('Please tick the consent box to submit.');\n\n  const lock = LockService.getScriptLock();\n  lock.waitLock(10000);\n  try {\n    const sh = getSheet_();\n    const last = sh.getLastRow();\n    if (last > 1) {\n      const phones = sh.getRange(2, 5, last - 1, 1).getDisplayValues()\n        .map(r => String(r[0]).replace(/\\D/g, ''));\n      if (phones.indexOf(digits) !== -1) {\n        throw new Error('This phone number has already signed up. We will contact you soon.');\n      }\n    }\n    const now = new Date();\n    const ref = 'W' + Utilities.formatDate(now, TZ, 'yyMMdd') + '-' + ('000' + last).slice(-3);\n    sh.appendRow([ref, Utilities.formatDate(now, TZ, 'yyyy-MM-dd HH:mm'), name, nick, phone, state, town, 'Pending', '']);\n    return { ok: true, ref: ref };\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/** Menu: after importing into the system, mark Pending rows as Imported */\nfunction markImported() {\n  const sh = getSheet_();\n  const last = sh.getLastRow();\n  if (last < 2) return;\n  const rng = sh.getRange(2, 8, last - 1, 1);\n  const vals = rng.getValues().map(r => [r[0] === 'Pending' ? 'Imported' : r[0]]);\n  rng.setValues(vals);\n  SpreadsheetApp.getUi().alert('Marking done.');\n}\n<\/script>\n<script type=\"text/plain\" id=\"src-idx\">\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Member Sign-up<\/title>\n<style>\n  :root{--bg:#F1F5F7;--card:#fff;--ink:#17293A;--muted:#566878;--line:#D9E2E8;--blue:#1D5C93;--teal:#0F807B;--teal-soft:#DBF1EF;--red:#BE3D27;--side:#153A5A}\n  *{box-sizing:border-box}\n  body{margin:0;background:var(--bg);color:var(--ink);font-family:\"Inter\",\"Noto Sans SC\",system-ui,-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;font-size:16px;line-height:1.55}\n  .top{background:var(--side);color:#fff;padding:22px 18px 70px}\n  .top .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}\n  .mark{width:44px;height:44px;border-radius:12px;background:var(--teal);display:grid;place-items:center;flex:none}\n  .top h1{margin:0;font-size:21px}\n  .top p{margin:2px 0 0;color:#C9DAE8;font-size:14px}\n  .wrap{max-width:520px;margin:-50px auto 40px;padding:0 14px}\n  .card{background:var(--card);border-rad erPanel():'')+\n '<section class=\"panel\"><div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>Username<\/th><th>Role<\/th><th>Status<\/th><th>Last login<\/th><th><\/th><\/tr><\/thead><tbody>'+rows+'<\/tbody><\/table><\/div><p class=\"small muted\">Disabled accounts cannot log in, but their past records are kept. The system must always have at least one active Admin.<\/p><\/section>'}\nfunction userForm(id){UI.uf=id?{id:id}:{};render();setTimeout(function(){const f=$('#uname');if(f){f.focus();f.scrollIntoView({block:'center'})}},60)}\nfunction closeUser(){UI.uf=null;render()}\nfunction pickRole(){document.querySelectorAll('.role-card').forEach(c=>c.classList.toggle('on',c.querySelector('input').checked))}\nfunction userPanel(){const ed=UI.uf.id?USERS[UI.uf.id]:null,role=ed?ed.role:'user';\n return '<section class=\"panel add-panel\" aria-label=\"'+(ed?'Edit User':'Add User')+'\"><div class=\"panel-head\"><h2>'+(ed?'Edit User':'Add User')+'<\/h2><button class=\"x\" type=\"button\" onclick=\"closeUser()\" aria-label=\"Close\">×<\/button><\/div><form onsubmit=\"event.preventDefault();saveUser()\"><div class=\"grid3\">'+\n '<label class=\"f\">Name<input id=\"uname\" value=\"'+(ed?esc(D(ed.name)):'')+'\" placeholder=\"e.g. Tan Chee Meng\" autocomplete=\"off\"><\/label>'+\n '<label class=\"f\">Username (for login)<input id=\"uid\" value=\"'+(ed?esc(UI.uf.id):'')+'\"'+(ed?' disabled':'')+' placeholder=\"e.g. ahming\" autocomplete=\"off\" autocapitalize=\"none\" spellcheck=\"false\"><\/label>'+\n '<label class=\"f\">'+(ed?'New password (leave blank to keep)':'Password (at least 6 characters)')+'<input id=\"upw\" type=\"password\" autocomplete=\"new-password\"><\/label><\/div>'+\n '<fieldset class=\"roles\"><legend>Role<\/legend>'+['admin','user'].map(r=>'<label class=\"role-card'+(role===r?' on':'')+'\"><input type=\"radio\" name=\"urole\" value=\"'+r+'\"'+(role===r?' checked':'')+' onchange=\"pickRole()\"><b>'+(r==='admin'?'Admin':'Staff')+'<\/b><span>'+(r==='admin ay0())return null;return iso(dt)}\nfunction nextBday(b){if(!b)return null;const t=today0(),p=b.split('-').map(Number);const mk=y=>{const d=new Date(y,p[1]-1,p[2]);return d.getMonth()!==p[1]-1?new Date(y,1,28):d};let n=mk(t.getFullYear());if(n<t)n=mk(t.getFullYear()+1);return n}\nfunction bdayDays(m){const n=nextBday(m.bday);return n?diffDays(n,today0()):null}\nfunction ageOn(b,d){const p=b.split('-').map(Number);let a=d.getFullYear()-p[0];if(d.getMonth()+1<p[1]||(d.getMonth()+1===p[1]&&d.getDate()<p[2]))a--;return a}\nfunction waNum(p){let d=icClean(p);if(d.startsWith('0'))d='6'+d;else if(!d.startsWith('6'))d='60'+d;return d}\nconst DEF_TPL={zh:'{name} \\u4f60\\u597d\\uff01{shop} \\u795d\\u4f60\\u751f\\u65e5\\u5feb\\u4e50 🎂 \\u8eab\\u4f53\\u5065\\u5eb7\\u3001\\u4e94\\u8c37\\u4e30\\u6536\\uff01',en:'Happy birthday, {name}! 🎂 Wishing you good health and a great harvest from all of us at {shop}.',ms:'Selamat hari jadi, {name}! 🎂 Semoga sihat sentiasa dan hasil tuaian melimpah ruah. Daripada kami di {shop}.'};\nfunction bdayTpl(){return (S.settings.bdayTpl&&S.settings.bdayTpl[LANG])||DEF_TPL[LANG]}\nfunction bdayMsg(m){return bdayTpl().replace(/\\{name\\}/g,m.name).replace(/\\{nick\\}/g,m.nick||m.name).replace(/\\{shop\\}/g,COMPANY.name)}\nfunction bdaySent(m){const n=nextBday(m.bday);return !!n&&m.bdaySent===n.getFullYear()}\nfunction bdayList(w){return S.members.filter(m=>m.bday).map(m=>({m:m,d:bdayDays(m)})).filter(x=>x.d!=null&&x.d<=w).sort((a,b)=>a.d-b.d||a.m.name.localeCompare(b.m.name))}\nfunction bdayDue(){return bdayList(S.settings.bdayDays).filter(x=>!bdaySent(x.m))}\nfunction markSent(id,v,later){const m=S.members.find(x=>x.id===id);if(!m)return;const n=nextBday(m.bday);if(v){m.bdaySent=n?n.getFullYear():null;log('\\u53d1\\u9001\\u751f\\u65e5\\u795d\\u798f',id+' '+m.name)}else m.bdaySent=null;save();if(later)setTimeout(render,400);else render()}\nfunction copyWish(id){const m=S.members.find(x=>x.id===id);if(!m)return;const t=bdayMsg(m);const done=()=>toast('Wish copied');try{navigator.clipboard.writeText(t).then(done,()=>{fallbackCopy(t);done()})}catch(e){fallbackCopy(t);done()}}\nfunction fallbackCopy(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}\nfunction seedPersonal(m,i,ri){const t=today0(),up=[0,2,5,9,16,25];let bd;if(i<up.length){const d=new Date(t);d.setDate(d.getDate()+up[i]);bd=new Date(ri(1958,1998),d.getMonth(),Math.min(d.getDate(),28))}else bd=new Date(ri(1955,2000),ri(0,11),ri(1,28));\n m.bday=iso(bd);m.ic=String(bd.getFullYear()%100).padStart(2,'0')+pad(bd.getMonth()+1,2)+pad(bd.getDate(),2)+'-'+pad(ri(1,16),2)+'-'+ri(1000,9999);\n const st=['Besar','Sungai','Padi','Kebun','Masjid','Pasar','Sekolah','Bendang','Kelapa','Merdeka'];m.addr='No. '+ri(1,120)+', Jalan '+st[ri(0,9)]+' '+ri(1,9)+', '+ri(10,98)+'000 '+m.town+', '+m.state}\nfunction bdayBanner(){const due=bdayDue();if(!due.length)return '';const td=due.filter(x=>x.d===0).length;\n return '<section class=\"bday-banner\" aria-label=\"Birthdays\"><span class=\"bb-ico\" aria-hidden=\"true\">🎂<\/span><div><b>Birthday reminder: '+due.length+' member(s) have birthdays within '+S.settings.bdayDays+' days, no wish sent yet<\/b><span class=\"small muted\">'+due.slice(0,4).map(x=>esc(x.m.name)+(x.d===0?' (today)':'')).join(', ')+(due.length>4?' …':'')+'<\/span><\/div><a class=\"btn btn-teal btn-sm\" href=\"#birthdays\">Send wishes<\/a><\/section>'}\nfunction vBday(){const w=S.settings.bdayDays,l=bdayList(w),noB=S.members.filter(m=>!m.bday).length;\n const rows=l.map(x=>{const m=x.m,n=nextBday(m.bday),sent=bdaySent(m),turn=ageOn(m.bday,n);\n  return '<tr><td class=\"nw\"><b>'+esc(m.name)+'<\/b>'+(m.nick?' <span class=\"muted\"> ('+esc(m.nick)+')<\/span>':'')+'<br><span class=\"small muted\">'+dispId(m.id)+'<\/span><\/td><td class=\"nw\">'+fmtD(iso(n)).slice(0,5)+'<\/td><td class=\"nw\">'+(x.d===0?'<span class=\"pill soon\">Today<\/span>':x.d+' days')+'<\/td><  Free to join. Earn points on every purchase and use them as a cash discount.\", \"evLine\": \"Event: {event} ({start} to {end})\", \"confirm\": \"Thank you! Your membership will be activated after we check it.\", \"title\": \"{shop} Member Sign-up\", \"resp\": \" (Responses)\", \"log1\": \"Form link for customers: \", \"log2\": \"Edit form: \", \"log3\": \"Response sheet: \"}};\nfunction sgaInit(){if(!UI.sga)UI.sga={lang:'tri',ev:'',title:'',f:{nick:1,ic:1,bday:1,addr:1,state:1,town:1,ref:1}};return UI.sga}\nfunction fqT(k){const o=sgaInit();if(o.lang==='tri')return FQ.zh[k]+' / '+FQ.ms[k]+' / '+FQ.en[k];return FQ[o.lang][k]}\nfunction fqTL(k,nl){const o=sgaInit();if(o.lang==='tri')return [FQ.zh[k],FQ.ms[k],FQ.en[k]].join(nl);return FQ[o.lang][k]}\nfunction sgaEv(){const o=sgaInit();return o.ev&&(S.events||[]).find(e=>e.id===o.ev)}\nfunction sgaFill(t,ev){return String(t).replace(/\\{shop\\}/g,COMPANY.name).replace(/\\{event\\}/g,ev?ev.name:'').replace(/\\{start\\}/g,ev?fmtD(ev.start):'').replace(/\\{end\\}/g,ev?fmtD(ev.end):'')}\nfunction sgaTitle(){const o=sgaInit(),ev=sgaEv();if(o.title.trim())return o.title.trim();const L=o.lang==='tri'?'zh':o.lang;return sgaFill(FQ[L].title,ev)+(ev?' · '+ev.name:'')}\nfunction genFormScript(){const o=sgaInit(),ev=sgaEv(),J=JSON.stringify,f=o.f;\n const desc=sgaFill(fqTL('desc','\\n'),ev)+(ev?'\\n\\n'+sgaFill(fqTL('evLine','\\n'),ev):'');\n const L=[];const add=s=>L.push(s);\n add('/**');add(' * '+sgaTitle());add(' * Google Apps Script → createMemberForm → Run');add(' */');\n add('function createMemberForm() {');\n add('  var title = '+J(sgaTitle())+';');\n add('  var form = FormApp.create(title);');\n add('  form.setDescription('+J(desc)+');');\n add('  form.setConfirmationMessage('+J(fqTL('confirm','\\n'))+');');\n add('  form.setLimitOneResponsePerUser(false);');\n add('  form.setCollectEmail(false);');\n add('  form.addTextItem().setTitle('+J(fqT('name'))+').setRequired(true);');\n if(f.nick)add('  form.addTextItem().setTitle('+J(fqT('nick'))+');');\n add('  form.addTextItem().setTitle('+J(fqT('phone'))+').setHelpText('+J(fqT('phoneHelp'))+').setRequired(true)');\n add('    .setValidation(FormApp.createTextValidation().requireTextMatchesPattern(\"^[0-9+ -]{9,16}$\").setHelpText('+J(fqT('phoneHelp'))+').build());');\n if(f.ic){add('  form.addTextItem().setTitle('+J(fqT('ic'))+').setHelpText('+J(fqT('icHelp'))+')');add('    .setValidation(FormApp.createTextValidation().requireTextMatchesPattern(\"^[0-9]{6}[- ]?[0-9]{2}[- ]?[0-9]{4}$\").setHelpText('+J(fqT('icHelp'))+').build());')}\n if(f.bday)add('  form.addDateItem().setTitle('+J(fqT('bday'))+').setIncludesYear(true);');\n if(f.addr)add('  form.addParagraphTextItem().setTitle('+J(fqT('addr'))+');');\n if(f.state)add('  form.addListItem().setTitle('+J(fqT('state'))+').setChoiceValues('+J(STATES)+');');\n if(f.town)add('  form.addTextItem().setTitle('+J(fqT('town'))+');');\n if(f.ref)add('  form.addTextItem().setTitle('+J(fqT('ref'))+').setHelpText('+J(fqT('refHelp'))+');');\n add('  form.addCheckboxItem().setTitle('+J(fqT('consent'))+').setChoiceValues(['+J(fqTL('consentTxt',' / '))+']).setRequired(true);');\n add('  var ss = SpreadsheetApp.create(title + '+J(o.lang==='tri'?FQ.zh.resp:FQ[o.lang].resp)+');');\n add('  form.setDestination(FormApp.DestinationType.SPREADSHEET, ss.getId());');\n add('  try { form.setPublished(true); } catch (e) { Logger.log(\"\\u26a0 \\u8bf7\\u5230\\u8868\\u5355\\u6309\\u53f3\\u4e0a\\u89d2\\u300c\\u53d1\\u5e03\\u300d / Tekan Terbitkan / Press Publish\"); }');add('  form.setAcceptingResponses(true);');add('  var url = form.getPublishedUrl();');\n add('  try { url = form.shortenFormUrl(url); } catch (e) {}');\n const LL=o.lang==='tri'?'zh':o.lang;\n add('  Logger.log('+J(FQ[LL].log1)+' + url);');\n add('  Logger.log('+J(FQ[LL].log2)+' + form.getEditUrl());');\n add('  Logger.log('+J(FQ[LL].log3)+' + ss.getUrl());');\n add('}');\n return L.join('\\n')}\nfunction sgaSet(k,v){const o=sgaInit();if(k==='f'){o.f[v]=o.f[v]?0:1}else o[k]=v;const t=$('#sga-code');if(t)t.value=genFormScript();if(k!=='title'){const ti=$('#sga-title');if(ti&&!o.title)ti.placeholder=sgaTitle()}}\nfunction sgAuto(){const o=sgaInit();const evs=(S.events||[]).filter(e=>evStatus(e)!=='done');\n const qs=[['nick','Nickname'],['ic','IC number'],['bday','Birthday'],['addr','Address'],['state','State'],['town','Town / Area'],['ref','Referred by']];\n return '<div class=\"cols\"><section class=\"panel\"><h2>Form settings<\/h2>'+\n '<label class=\"f\">Form language<select onchange=\"sgaSet(\\'lang\\',this.value)\"><option value=\"tri\"'+(o.lang==='tri'?' selected':'')+'>3 languages (华语 / BM / English)<\/option><option value=\"zh\"'+(o.lang==='zh'?' selected':'')+'>华语<\/option><option value=\"ms\"'+(o.lang==='ms'?' selected':'')+'>Bahasa Melayu<\/option><option value=\"en\"'+(o.lang==='en'?' selected':'')+'>English<\/option><\/select><\/label>'+\n '<label class=\"f\">For an event (optional)<select onchange=\"sgaSet(\\'ev\\',this.value)\"><option value=\"\">No event<\/option>'+evs.map(e=>'<option value=\"'+e.id+'\"'+(o.ev===e.id?' selected':'')+'>'+esc(e.name)+' ('+fmtD(e.start)+' – '+fmtD(e.end)+')<\/option>').join('')+'<\/select><\/label>'+\n '<label class=\"f\">Form title<input id=\"sga-title\" value=\"'+esc(o.title)+'\" placeholder=\"'+esc(sgaTitle())+'\" oninput=\"sgaSet(\\'title\\',this.value)\"><\/label>'+\n '<div class=\"f\"><span>Questions to ask<\/span><div class=\"sga-q\">'+qs.map(q=>'<label><input type=\"checkbox\"'+(o.f[q[0]]?' checked':'')+' onchange=\"sgaSet(\\'f\\',\\''+q[0]+'\\')\">'+q[1]+'<\/label>').join('')+'<\/div><span class=\"small muted\">Name and phone are always asked<\/span><\/div><\/section>'+\n '<section class=\"panel\"><h2>How to use (about 5 minutes the first time)<\/h2><ol class=\"rules\"><li>Choose the language, event and questions on the left, then click “Copy Script”.<\/li>'+\n '<li>Using the shop Google account, open <a href=\"https://script.google.com/home/projects/create\" target=\"_blank\" rel=\"noopener\"><b>script.google.com<\/b><\/a> and click “New project”.<\/li>'+\n '<li>Delete everything in the editor, paste the script and click Save.<\/li><li>At the top choose <b>createMemberForm<\/b> and click “Run”. The first time it asks for permission: choose your account → “Advanced” → “Go to (unsafe)” → “Allow”. Google shows this because it is your own script.<\/li>'+\n '<li>When it finishes, the “Execution log” shows 3 links: the form for customers, the form editor and the response sheet. Both are saved in your Google Drive automatically.<\/li><li>Paste the “form link for customers” in the box below and click “Generate QR Code” to get a printable poster.<\/li>'+\n '<li>After the event: open the response sheet → File → Download → CSV → go to <a href=\"#import\">Import / Export<\/a> and choose the file to import. Columns are matched automatically, and referrers get their bonus automatically.<\/li><\/ol><p class=\"small muted\">You can create a new form for each event; older forms keep working.<\/p><\/section><\/div>'+\n '<section class=\"panel\"><div class=\"panel-head\"><h2>Generated script<\/h2><button class=\"btn btn-blue\" onclick=\"copyStr($(\\'#sga-code\\').value);toast(\\'Script copied\\')\">Copy code<\/button><\/div><textarea id=\"sga-code\" class=\"code\" rows=\"14\" readonly spellcheck=\"false\">'+esc(genFormScript())+'<\/textarea><\/section>'+\n qrPanel('auto','Paste the generated form link','https://forms.gle/…')}\n\nfunction pageOf(list,k,sig){const sz=S.settings['ps_'+k]||20;if(UI['sig_'+k]!==sig){UI['sig_'+k]=sig;UI['pg_'+k]=1}const pages=Math.max(1,Math.ceil(list.length/sz));const p=Math.min(Math.max(1,UI['pg_'+k]||1),pages);UI['pg_'+k]=p;\n return {items:list.slice((p-1)*sz,p*sz),p:p,pages:pages,sz:sz,from:list.length?(p-1)*sz+1:0,to:Math.min(p*sz,list.length)}}\nfunction pagerTop(k,total,pg,unit){return '<div class=\"pager-top\"><span class=\"small muted\">Total '+N(total)+' '+unit+' · showing '+pg.from+'–'+pg.to+' '+unit+'<\/span><label class=\"pg-size small muted\">Per page<select onchange=\"setPS(\\''+k+'\\',this.value)\">'+[10,20,30,50,100].map(n=>'<option value=\"'+n+'\"'+(n===pg.sz?' selected':'')+'>'+n+'<\/option>').join('')+'<\/select>'+unit+'<\/label><\/div>'}\nfunction pagerNav(k,pg){if(pg.pages<=1)return '';const P=pg.p,L=pg.pages,set=new Set([1,L,P-1,P,P+1,P-2,P+2].filter(x=>x>=1&&x<=L));const nums=[...set].sort((a,b)=>a-b);let h='',last=0;\n nums.forEach(n=>{if(n-last>1)h+='<span class=\"pg-gap\">…<\/span>';h+='<button type=\"button\" class=\"pg-n'+(n===P?' on':'')+'\"'+(n===P?' aria-current=\"page\"':'')+' onclick=\"goPage(\\''+k+'\\','+n+')\">'+n+'<\/button>';last=n});\n return '<nav class=\"pager\" aria-label=\"Pages\"><button type=\"button\" class=\"pg-n pg-step\"'+(P<=1?' disabled':'')+' onclick=\"goPage(\\''+k+'\\','+(P-1)+')\">‹ Previous<\/button>'+h+'<button type=\"button\" class=\"pg-n pg-step\"'+(P>=L?' disabled':'')+' onclick=\"goPage(\\''+k+'\\','+(P+1)+')\">Next ›<\/button><\/nav>'}\nfunction goPage(k,p){UI['pg_'+k]=p;(k==='m'?drawMembers:drawSales)();const el=$(k==='m'?'#mtable':'#stable');if(el)el.scrollIntoView({block:'start'})}\nfunction setPS(k,v){S.settings['ps_'+k]=Number(v)||20;UI['pg_'+k]=1;save();(k==='m'?drawMembers:drawSales)()}\n\n/* ============ Dashboard ============ */\nfunction vDash(){\n const t=today0(),mk=iso(t).slice(0,7);\n const active=S.members.filter(m=>C[m.id].status!=='expired');\n const newThis=S.members.filter(m=>m.join.slice(0,7)===mk).length;\n const salesThis=S.sales.filter(s=>s.date.slice(0,7)===mk).reduce((a,s)=>a+s.amount,0);\n const ptsValue=active.reduce((a,m)=>a+C[m.id].value,0);\n const warn=S.members.filter(m=>C[m.id].status==='soon'||(C[m.id].status!=='expired'&&C[m.id].soon>0)).sort((a,b)=>Math.min(C[a.id].mdays,C[a.id].soonDate?diffDays(C[a.id].soonDate,t):999)-Math.min(C[b.id].mdays,C[b.id].soonDate?diffDays(C[b.id].soonDate,t):999));\n let alert='';\n if(warn.length){\n  const rows=warn.slice(0,8).map(m=>{const c=C[m.id];const parts=[];\n   if(c.status==='soon')parts.push('Membership expires '+fmtD(m.expiry)+' ('+c.mdays+' days left)');\n   if(c.soon>0)parts.push(N(c.soon)+' pts expire '+fmtD(iso(c.soonDate))+' ('+diffDays(c.soonDate,t)+' days left)');\n   return '<tr><td class=\"nw\">'+dispId(m.id)+'<\/td><td class=\"nw\"><b>'+esc(m.name)+'<\/b>'+(m.nick?' <span class=\"muted\"> ('+esc(m.nick)+')<\/span>':'')+'<\/td><td class=\"nw num\">'+esc(m.phone)+'<\/td><td>'+parts.join('; ')+'<\/td><td class=\"r\"><button class=\"btn btn-ghost btn-sm\" onclick=\"memberDetail(\\''+m.id+'\\')\">Handle<\/button><\/td><\/tr>'}).join('');\n  alert='<section class=\"alert\" aria-label=\"Expiry alerts\"><div class=\"alert-top\"><div><h2>'+warn.length+' member(s) with items expiring within 3 months<\/h2><p>Contact these members to renew or redeem soon so their points are not lost.<\/p><\/div><a class=\"btn btn-ghost\" href=\"#members\" onclick=\"UI.mstatus=\\'warn\\'\">View all<\/a><\/div><div class=\"alert-list\"><table><thead><tr><th>ID<\/th><th>Name<\/th><th>Phone<\/th><th>Expiring item<\/th><th><\/th><\/tr><\/thead><tbody>'+rows+'<\/tbody><\/table><\/div><\/section>';\n }\n // monthly new members (12 months)\n const months=[];for(let i=11;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1,2))}\n const cnt=months.map(k=>S.members.filter(m=>m.join.slice(0,7)===k).length);const mx=Math.max(1,...cnt);\n const vb='<div class=\"vbars\" role=\"img\" aria-label=\"New members per month, last 12 months\">'+cnt.map((c,i)=>'<div class=\"vbar'+(i===11?' cur':'')+'\"><b>'+c+'<\/b><span style=\"height:'+(c/mx*82)+'%\"><\/span><\/div>').join('')+'<\/div><div class=\"vlabels\">'+months.map(k=>'<div>'+MON[Number(k.slice(5))-1]+'<\/div>').join('')+'<\/div>';\n // tiers\n const tc=S.tiers.map(tt=>({t:tt,n:active.filter(m=>C[m.id].tier.id===tt.id).length}));const tmx=Math.max(1,...tc.map(x=>x.n));\n const tb='<div class=\"hbars\">'+tc.map(x=>'<div class=\"hbar\"><span>'+tierTag(x.t)+'<\/span><div class=\"track\"><div class=\"fill\" style=\"width:'+(x.n/tmx*100)+'%;background:var('+x.t.color+')\"><\/div><\/div><span class=\"n\">'+x.n+'<\/span><\/div>').join('')+'<\/div>';\n // states\n const sm={};active.forEach(m=>{sm[m.state]=(sm[m.state]||0)+1});const sl=Object.entries(sm).sort((a,b)=>b[1]-a[1]);const smx=Math.max(1,...sl.map(x=>x[1]));\n const sb='<div class=\"hbars\">'+sl.map(([k,n])=>'<div class=\"hbar\"><span>'+esc(k)+'<\/span><div class=\"track\"><div class=\"fill\" style=\"width:'+(n/smx*100)+'%\"><\/div><\/div><span class=\"n\">'+n+'<\/span><\/div>').join('')+'<\/div>';\n const towns={};active.forEach(m=>{towns[m.town]=(towns[m.town]||0)+1});const topTowns=Object.entries(towns).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,n])=>esc(k)+' '+n).join(' · ');\n const recent=S.sales.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)).slice(0,8).map(s=>'<tr><td class=\"nw\">'+fmtD(s.date)+'<\/td><td class=\"nw\">'+esc(mName(s.mid))+'<\/td><td>'+esc(pName(s.pid))+' × '+s.qty+'<\/td><td class=\"r\">'+RM(s.amount)+'<\/td><td class=\"r\">+'+N(s.pts)+'<\/td><\/tr>').join('');\n return '<div class=\"page-head\"><div><h1>Dashboard<\/h1><p>Today '+fmtD(iso(t))+' · Counts active (unexpired) members only<\/p><\/div><div class=\"actions\"><button class=\"btn btn-teal\" onclick=\"saleForm()\">+ Record Purchase<\/button><button class=\"btn btn-blue\" onclick=\"memberForm()\">+ Add Member<\/button><\/div><\/div>'+quickSearch()+bdayBanner()+evBanner()+alert+\n '<div class=\"kpis\"><div class=\"kpi blue\"><span class=\"k\">Total members<\/span><span class=\"v\">'+N(active.length)+'<\/span><span class=\"s\">Plus '+(S.members.length-active.length)+' expired<\/span><\/div><div class=\"kpi teal\"><span class=\"k\">New this month<\/span><span class=\"v\">'+newThis+'<\/span><span class=\"s\">Month to date<\/span><\/div><div class=\"kpi\"><span class=\"k\">Sales this month<\/span><span class=\"v\">'+RM(salesThis)+'<\/span><span class=\"s\">'+S.sales.filter(s=>s.date.slice(0,7)===mk).length+' purchases<\/span><\/div><div class=\"kpi orange\"><span class=\"k\">Unredeemed points value<\/span><span class=\"v\">'+RM(ptsValue)+'<\/span><span class=\"s\">'+N(active.reduce((a,m)=>a+C[m.id].avail,0))+' pts<\/span><\/div><\/div>'+\n '<div class=\"cols\"><section class=\"panel\"><div class=\"panel-head\"><h2>New members per month<\/h2><span class=\"small muted\">Last 12 months<\/span><\/div>'+vb+'<\/section><section class=\"panel\"><div class=\"panel-head\"><h2>Members by tier<\/h2><\/div>'+tb+'<\/section><\/div>'+\n '<div class=\"cols\"><section class=\"panel\"><div class=\"panel-head\"><h2>Recent purchases<\/h2><a href=\"#sales\" class=\"small\">All sales →<\/a><\/div><div class=\"tbl-wrap\"><table class=\"dash-recent\"><thead><tr><th>Date<\/th><th>Member<\/th><th>Product<\/th><th class=\"r\">Amount<\/th><th class=\"r\">Points<\/th><\/tr><\/thead><tbody>'+recent+'<\/tbody><\/table><\/div><\/section><section class=\"panel\"><div class=\"panel-head\"><h2>Members by location<\/h2><span class=\"small muted\">By state<\/span><\/div>'+sb+'<p class=\"small muted\">Top towns: '+topTowns+'<\/p><\/section><\/div>';\n}\n\n/* ============ Search ============ */\nfunction matchMember(m,q){\n q=String(q||'').trim().toLowerCase();if(!q)return true;\n if(m.name.toLowerCase().includes(q)||(m.nick||'').toLowerCase().includes(q)||m.id.toLowerCase().includes(q)||dispId(m.id).toLowerCase().includes(q))return true;\n const d=q.replace(/\\D/g,'');\n if(d.length>=2&&/^[\\d\\s+-]+$/.test(q)){const p=String(m.phone||'').replace(/\\D/g,'');return p.startsWith(d)||p.endsWith(d)||p.includes(d)||(d.length>=4&&icClean(m.ic).includes(d))}\n return false;\n}\nfunction quickSearch(){return '<section class=\"panel qs\"><label for=\"dq\" style=\"font-weight:600\">Quick member search<\/label><input id=\"dq\" placeholder=\"Type a name, nickname, or the first / last digits of a phone number (e.g. 012 or 6789)\" oninput=\"drawQuick()\" autocomplete=\"off\"><div id=\"dqres\"><\/div><\/section>'}\nfunction drawQuick(){\n const q=$('#dq').value,el=$('#dqres');if(!q.trim()){el.innerHTML='';return}\n const l=S.members.filter(m=>matchMember(m,q));\n if(!l.length){el.innerHTML='<p class=\"muted small\">No matching member. When searching by phone, type at least 2 digits.<\/p>';return}\n el.innerHTML='<p class=\"small muted\">Found '+l.length+' member(s)'+(l.length>8?', showing first 8':'')+'<\/p><div class=\"md-list\">'+l.slice(0,8).map(m=>{const c=C[m.id];return '<div class=\"md-row\"><div class=\"l\"><b>'+esc(m.name)+'<\/b>'+(m.nick?' <span style=\"color:var(--teal)\"> ('+esc(m.nick)+')<\/span>':'')+'<small>'+dispId(m.id)+' · '+esc(m.phone)+' · '+esc(m.town)+'<\/small><\/div><div class=\"r\">'+tierTag(c.tier)+' &nbsp;<button class=\"btn btn-ghost btn-sm\" onclick=\"memberDetail(\\''+m.id+'\\')\">View<\/button><\/div><\/div>'}).join('')+'<\/div>';\n}\n\n/* ============ Members ============ */\nfunction vMembers(){\n const tOpts=S.tiers.map(t=>'<option value=\"'+t.id+'\"'+(UI.mtier===t.id?' selected':'')+'>'+D(t.name)+'<\/option>').join('');\n const states=[...new Set(S.members.map(m=>m.state))].sort();\n const sOpts=states.map(s=>'<option'+(UI.mstate===s?' selected':'')+'>'+esc(s)+'<\/option>').join('');\n const st=[['','All statuses'],['ok','Active'],['warn','Expiring within 3 months'],['expired','Expired']].map(([v,l])=>'<option value=\"'+v+'\"'+(UI.mstatus===v?' selected':'')+'>'+l+'<\/option>').join('');\n return '<div class=\"page-head\"><div><h1>Members<\/h1><p>'+(isAdmin()?'Admin can add, edit and delete members.':'Staff can add members and record purchases. Editing, renewing and deleting are done by Admin.')+'<\/p><\/div><div class=\"actions\"><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'members\\')\">Export CSV<\/button><button class=\"btn btn-blue\" onclick=\"memberForm()\">+ Add Member<\/button><\/div><\/div>'+\n (UI.addOpen?addPanel():'')+'<section class=\"panel\"><div class=\"filters mf\"><input id=\"mq\" placeholder=\"Search: name, nickname, or first / last digits of phone\" value=\"'+esc(UI.mq)+'\" oninput=\"UI.mq=this.value;drawMembers()\"><select id=\"mtier\" onchange=\"UI.mtier=this.value;drawMembers()\"><option value=\"\">All tiers<\/option>'+tOpts+'<\/select><select id=\"mstate\" onchange=\"UI.mstate=this.value;drawMembers()\"><option value=\"\">All states<\/option>'+sOpts+'<\/select><select id=\"mstatus\" onchange=\"UI.mstatus=this.value;drawMembers()\">'+st+'<\/select><select id=\"mrole\" onchange=\"UI.mrole=this.value;drawMembers()\"><option value=\"\">All roles<\/option>'+roleOpts(UI.mrole||'')+'<\/select><\/div><div id=\"mtable\">'+membersTable()+'<\/div><\/section>';\n}\nfunction drawMembers(){$('#mtable').innerHTML=membersTable()}\nfunction membersTable(){\n const q=UI.mq.trim().toLowerCase();\n const list=S.members.filter(m=>{const c=C[m.id];\n  if(q&&!matchMember(m,q))return false;\n  if(UI.mtier&&c.tier.id!==UI.mtier)return false;if(UI.mstate&&m.state!==UI.mstate)return false;\n  if(UI.mstatus==='ok'&&c.status!=='ok')return false;if(UI.mstatus==='expired'&&c.status!=='expired')return false;\n  if(UI.mstatus==='warn'&&!(c.status==='soon'||(c.status!=='expired'&&c.soon>0)))return false;if(UI.mrole&&mRole(m)!==UI.mrole)return false;return true});\n if(!list.length)return tierLegend('m')+'<div class=\"empty\">No members match these filters.<\/div>';\n const pg=pageOf(list,'m',JSON.stringify([UI.mq,UI.mtier,UI.mstate,UI.mstatus,UI.mrole]));return pagerTop('m',list.length,pg,'members')+tierLegend('m')+'<div class=\"tbl-wrap\"><table class=\"t-tier t-mem\"><thead><tr><th>ID<\/th><th>Name<\/th><th>Phone<\/th><th>Location<\/th><th>Tier<\/th><th class=\"r\">Available points<\/th><th>Membership expiry<\/th><th><\/th><\/tr><\/thead><tbody>'+\n pg.items.map(m=>{const c=C[m.id];return '<tr class=\"trt\" style=\"--tc:var('+c.tier.color+')\"><td class=\"nw\">'+dispId(m.id)+'<\/td><td class=\"nw\"><b>'+esc(m.name)+'<\/b>'+' '+ro
