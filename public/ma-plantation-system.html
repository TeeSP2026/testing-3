 and price.';e.hidden=false;return}\n const k=$('#pk').value,id=(k==='fert'?'F':'P')+pad(S.products.filter(p=>p.kind===k).length+1,2)+'x'+Date.now().toString().slice(-3);\n S.products.push({id,kind:k,cat:$('#pc').value,grade:k==='pest'?$('#pg').value:undefined,name:n,spec:$('#ps').value.trim(),price:pr,crops:$('#pcr').value.trim()||'-',desc:$('#pd').value.trim()});\n if(PHOTO_DRAFT){setImg(id,PHOTO_DRAFT);PHOTO_DRAFT=null}UI.ptab=k;log('\\u65b0\\u589e\\u4ea7\\u54c1',n+' '+RM(pr));save();closeModal();render();toast('Product added')}\n\n/* ============ Tiers ============ */\nfunction vTiers(){\n const a=isAdmin();const cnt=id=>S.members.filter(m=>C[m.id].status!=='expired'&&C[m.id].tier.id===id).length;\n return '<div class=\"page-head\"><div><h1>Tiers & Points<\/h1><p>'+(a?'After editing, click “Save Settings” and every member’s tier is recalculated right away.':'Only Admin can change settings.')+'<\/p><\/div><\/div>'+tierCards(cnt)+'<section class=\"panel\"><div class=\"tbl-wrap\"><table class=\"t-tier t-tiers\"><thead><tr><th>Tier<\/th><th class=\"r\">Total spend threshold (RM)<\/th><th class=\"r\">Value per point (RM)<\/th><th class=\"r\">1,000 pts =<\/th><th class=\"r\">Active members<\/th><\/tr><\/thead><tbody>'+\n S.tiers.map((t,i)=>'<tr class=\"trt\" style=\"--tc:var('+t.color+')\"><td><span class=\"tcell\"><span class=\"tc-badge\">'+tierIco(t)+'<\/span><span><b>'+esc(D(t.name))+'<\/b><small>Lv.'+(i+1)+'<\/small><\/span><\/span><\/td><td class=\"r\">'+(a&&i>0?'<input id=\"tmin'+i+'\" type=\"number\" min=\"0\" step=\"100\" value=\"'+t.min+'\" style=\"max-width:130px;text-align:right\">':N(t.min))+'<\/td><td class=\"r\">'+(a?'<input id=\"trate'+i+'\" type=\"number\" min=\"0\" step=\"0.001\" value=\"'+t.rate+'\" style=\"max-width:110px;text-align:right\">':t.rate.toFixed(3))+'<\/td><td class=\"r\">'+RM(1000*t.rate)+'<\/td><td class=\"r\">'+cnt(t.id)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>'+\n '<div class=\"grid3\"><label class=\"f\">Points per RM 1 spent<input id=\"earn\" type=\"number\" min=\"0\" step=\"0.1\" value=\"'+S.settings.earn+'\"'+(a?'':' disabled')+'><\/label><label class=\"f\">Referral bonus points per new member<input id=\"refpts\" type=\"number\" min=\"0\" step=\"1\" value=\"'+(S.settings.refPts||0)+'\"'+(a?'':' disabled')+'><\/label><\/div>'+(a?'<div class=\"actions\"><button class=\"btn btn-blue\" onclick=\"saveTiers()\">Save Settings<\/button><\/div>':'')+'<\/section>'+\n '<section class=\"panel\"><h2>Rules<\/h2><ul class=\"rules\"><li>Points from each purchase are valid for <b>2 years<\/b> from the purchase date, then expire automatically.<\/li><li>Membership is valid for <b>2 years<\/b> from the join (or renewal) date. Expired members cannot earn or redeem points until they renew.<\/li><li>Starting <b>3 months<\/b> before expiry, the dashboard and member list show an orange alert.<\/li><li>Members can redeem points anytime. The earliest-expiring points are used first.<\/li><li>Tier is set automatically by total spend. Admin can set a tier manually in the member profile.<\/li><li>When a member refers a new member, the referrer gets <b>'+N(S.settings.refPts||0)+' pts<\/b>, given right away when the new member joins (set to 0 to turn off).<\/li><\/ul><\/section>';\n}\nfunction saveTiers(){\n const old=JSON.stringify(S.tiers.map(t=>[t.min,t.rate]))+S.settings.earn;\n S.tiers.forEach((t,i)=>{if(i>0){const v=Number($('#tmin'+i).value);if(v>=0)t.min=v}const r=Number($('#trate'+i).value);if(r>=0)t.rate=r});\n const e=Number($('#earn').value);if(e>=0)S.settings.earn=e;const rp=Number($('#refpts').value);if(rp>=0)S.settings.refPts=Math.round(rp);\n for(let i=1;i<S.tiers.length;i++){if(S.tiers[i].min<=S.tiers[i-1].min){toast('Thresholds must go from low to high. Please check again.');S.tiers.forEach((t,j)=>{const o=JSON.parse(old.slice(0,old.lastIndexOf(']')+1))[j];t.min=o[0];t.rate=o[1]});render();return}}\n log('\\u4fee\\u6539\\u7b49\\u7ea7\\u8bbe\\u5b9a',S.tiers.map(t=>t.name+' ≥'+t.min+' @'+t.rate).join('; ')+'; '+S.settings.earn+' pt(s) per RM1');save();render();toast('Settings saved');\n}\n\n/* ============ Import / Export ============ */\nconst TEMPLATE='Name,Nickname,Phone,State,Town,Join date (YYYY-MM-DD)\\nTan Tai Boon,Ah Boon,012-555 1234,Selangor,Sekinchan,2026-01-15\\nAminah binti Salleh,,013-444 9876,Kedah,Yan,2025-11-02';\nfunction vImport(){\n const a=isAdmin(),s=S.settings;\n let status;\n if(!s.firstImportDone)status='<span class=\"pill info\">First import not done yet<\/span> The first import only takes effect after Admin checks it.';\n else if(s.importLocked)status='<span class=\"pill line\">Locked<\/span> First import is done. From now on only Admin can import'+(a?', or click “Allow staff one more import”.':'. Please contact Admin if you need to import.');\n else status='<span class=\"pill ok\">Opened once<\/span> Admin has allowed staff to submit one more import. It still needs Admin to check it.';\n const canSubmit=a||!s.importLocked;\n const pend=S.pendingImports.map(p=>'<tr><td class=\"nw\">'+esc(p.at)+'<\/td><td>'+esc(USERS[p.by]?D(USERS[p.by].name):p.by)+'<\/td><td class=\"r\">'+p.rows.length+'<\/td><td class=\"r nw\">'+(a?'<button class=\"btn btn-ghost btn-sm\" onclick=\"viewPending(\\''+p.id+'\\')\">View<\/button> <button class=\"btn btn-teal btn-sm\" onclick=\"approveImport(\\''+p.id+'\\')\">Check & Import<\/button> <button class=\"btn btn-ghost btn-sm\" style=\"color:var(--red)\" onclick=\"rejectImport(\\''+p.id+'\\')\">Reject<\/button>':'<span class=\"pill soon\">Waiting for Admin check<\/span>')+'<\/td><\/tr>').join('');\n return '<div class=\"page-head\"><div><h1>Import / Export<\/h1><p>Import members in bulk with the template. Exported CSV files open in Excel.<\/p><\/div><\/div>'+\n '<section class=\"panel\"><h2>Export CSV<\/h2><div class=\"actions\"><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'members\\')\">Member list<\/button><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'sales\\')\">Sales<\/button><button class=\"btn btn-ghost\" onclick=\"exportCSV(\\'redemptions\\')\">Redemptions<\/button><\/div><p class=\"small muted\">shows the CSV content. Click “Copy”, paste into Excel or Notepad, and save as .csv.<\/p><\/section>'+\n (S.pendingImports.length?'<section class=\"panel\"><h2>Imports waiting for check<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Submitted<\/th><th>Submitted by<\/th><th class=\"r\">Count<\/th><th><\/th><\/tr><\/thead><tbody>'+pend+'<\/tbody><\/table><\/div><\/section>':'')+\n '<section class=\"panel\"><div class=\"panel-head\"><h2>Import Members<\/h2>'+(a&&s.importLocked?'<button class=\"btn btn-ghost btn-sm\" onclick=\"unlockImport()\">Allow staff one more import<\/button>':'')+'<\/div><p>'+status+'<\/p>'+\n (canSubmit?gsPanel():'')+(canSubmit?'<div class=\"cols-eq\"><div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><h3>1. Copy the template<\/h3><textarea id=\"tpl\" rows=\"4\" readonly>'+esc(TEMPLATE)+'<\/textarea><div><button class=\"btn btn-ghost btn-sm\" onclick=\"copyText(\\'tpl\\')\">Copy Template<\/button><\/div><p class=\"small muted\">The first row is the header, then one member per row. Nickname can be blank; duplicate phone numbers are skipped. You can also choose a sign-up CSV downloaded from Google Sheets. The system detects the columns and imports only Pending sign-ups.<\/p><\/div><div style=\"display:flex;flex-direction:column;gap:8px;min-width:0\"><h3>2. Paste data or choose a CSV file<\/h3><textarea id=\"imp\" rows=\"4\" placeholder=\"Paste data from Excel here (comma-separated)\"><\/textarea><div class=\"actions\"><input id=\"impf\" type=\"file\" accept=\".csv,text/csv\" onchange=\"readImportFile(this)\" style=\"height:auto;padding:8px;max-width:280px\"><button class=\"btn btn-blue\" onclick=\"checkImport()\">Check Data<\/button><\/div><\/div><\/div><div id=\"imprev\">'+(UI.importRows?importPreview():'')+'<\/div>':'<div class=\"lock\">Import is locked. Please ask Admin to open it.<\/div>')+'<\/section>';\n}\nfunction readImportFile(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=String(r.result).replace(/^﻿/,'');checkImport()};r.readAsText(f)}\nfunction parseCSV(txt){txt=String(txt||'').replace(/^\\ufeff/,'');const rows=[];let row=[],cur='',q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];if(q){if(ch==='\"'){if(txt[i+1]==='\"'){cur+='\"';i++}else q=false}else cur+=ch;continue}if(ch==='\"'){q=true}else if(ch===','||ch==='\\t'){row.push(cur.trim());cur=''}else if(ch==='\\n'||ch==='\\r'){if(ch==='\\r'&&txt[i+1]==='\\n')i++;row.push(cur.trim());cur='';if(row.some(x=>x))rows.push(row);row=[]}else cur+=ch}row.push(cur.trim());if(row.some(x=>x))rows.push(row);return rows}\nfunction checkImport(){\n const rows=parseCSV($('#imp').value);let map={name:0,nick:1,phone:2,state:3,town:4,join:5,status:-1};\n if(rows.length&&rows[0].some(x=>/姓名|name|nama/i.test(x))){const h=rows.shift().map(x=>x.toLowerCase());const f=re=>h.findIndex(x=>re.test(x));\n  map={name:f(/姓名|^name|^nama/),nick:f(/花名|nick|panggilan/),phone:f(/电话|手机|phone|telefon/),state:f(/州|state|negeri/),town:f(/城镇|地区|town|bandar/),join:f(/入会|join|sertai|时间戳记|timestamp|cap masa|\\u63d0\\u4ea4\\u65f6\\u95f4/),status:f(/状态|status/),ic:f(/身份证|^ic|mykad|nric|kad pengenalan/),addr:f(/地址|address|alamat/),note:f(/备注|note|catatan/),bday:f(/生日|birth|lahir/),ref:f(/介绍人|referr|rujuk/)}}\n const g=(r,k)=>map[k]>=0?String(r[map[k]]||'').trim():'';\n const src=map.status>=0?rows.filter(r=>!g(r,'status')||['\\u5f85\\u6279\\u51c6','Pending','Menunggu'].includes(g(r,'status'))):rows;\n const seen=new Set(S.members.map(m=>String(m.phone||'').replace(/\\D/g,'')));\n UI.importRows=src.map(r=>{const name=g(r,'name'),nick=g(r,'nick'),phone=g(r,'phone').replace(/^'/,''),state=g(r,'state'),town=g(r,'town'),join=normDate(g(r,'join'));const d=(phone||'').replace(/\\D/g,'');let e='';\n  if(!name)e='Missing name';else if(d&&(d.length<9||d.length>11))e='Wrong phone format';else if(d&&seen.has(d))e='Phone lf){v=String(v||'').trim();if(!v)return null;const id=midFrom(v);let m=id&&S.members.find(x=>x.id===id&&x.id!==self);if(m)return m;const d=v.replace(/\\D/g,'');if(d.length>=9){m=S.members.find(x=>x.id!==self&&String(x.phone||'').replace(/\\D/g,'')===d);if(m)return m}const l=v.toLowerCase();return S.members.find(x=>x.id!==self&&(x.name.toLowerCase()===l||(x.nick&&x.nick.toLowerCase()===l)))||null}\nfunction normDate(s){s=String(s||'').trim();if(!s)return '';let m=s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2],2)+'-'+pad(+m[3],2);m=s.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})/);if(m){let a=+m[1],b2=+m[2];if(b2>12&&a<=12){const x=a;a=b2;b2=x}return m[3]+'-'+pad(b2,2)+'-'+pad(a,2)}return s.slice(0,10)}\nfunction submitImport(){\n const rows=UI.importRows.filter(r=>!r.e);if(!rows.length)return;\n if(isAdmin()){applyRows(rows);S.settings.firstImportDone=true;S.settings.importLocked=true;log('\\u5bfc\\u5165\\u4f1a\\u5458','Admin imported directly: '+rows.length+' records');toast('Imported '+rows.length+' members')}\n else{S.pendingImports.push({id:'I'+Date.now(),at:nowStamp(),by:session.user,rows});S.settings.importLocked=true;log('\\u63d0\\u4ea4\\u5bfc\\u5165',rows.length+' records, waiting for Admin check');toast('Submitted. Waiting for Admin check')}\n UI.importRows=null;save();render();\n}\nfunction viewPending(id){const p=S.pendingImports.find(x=>x.id===id);openModal('Imports waiting for check ('+p.rows.length+' records)','<div class=\"tbl-wrap\"><table><thead><tr><th>Name<\/th><th>Nickname<\/th><th>Phone<\/th><th>State<\/th><th>Town<\/th><th>Join date<\/th><\/tr><\/thead><tbody>'+p.rows.map(r=>'<tr><td>'+esc(r.name)+'<\/td><td>'+esc(r.nick||'')+'<\/td><td>'+esc(r.phone)+'<\/td><td>'+esc(r.state)+'<\/td><td>'+esc(r.town)+'<\/td><td>'+esc(r.join)+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>','<button class=\"btn btn-ghost\" onclick=\"closeModal()\">Close<\/button><button class=\"btn btn-teal\" onclick=\"closeModal();approveImpo n class=\"panel\"><h2>Why use the sign-up web page<\/h2><ul class=\"rules\">'+\n '<li>A page of its own with your logo and shop name. Customers scan and it opens, no Google sign-in needed.<\/li>'+\n '<li>Chinese, BM and English, customers pick their own; large text, easy to fill on a phone.<\/li>'+\n '<li>Typing the IC fills in the birthday; the same phone cannot sign up twice.<\/li>'+\n '<li>Details go straight into a Google Sheet; the system tells you about new sign-ups and adds them in one tap.<\/li><\/ul><\/section>'+\n '<div class=\"cols\"><section class=\"panel\"><h2>Shop name and phone shown on the page<\/h2>'+\n '<label class=\"f\">Shop name<input value=\"'+esc(v.name)+'\" maxlength=\"60\" oninput=\"suSet(\\'suName\\',this.value)\"'+(a?'':' readonly')+'><\/label>'+\n '<label class=\"f\">Contact phone<input value=\"'+esc(v.phone)+'\" maxlength=\"30\" inputmode=\"tel\" oninput=\"suSet(\\'suPhone\\',this.value)\"'+(a?'':' readonly')+'><\/label>'+\n '<div class=\"actions\"><button class=\"btn btn-ghost\" onclick=\"suPreview()\">Preview sign-up page<\/button><button class=\"btn btn-teal\" onclick=\"suCopy()\">Copy code<\/button>'+(DL?'<button class=\"btn btn-ghost\" onclick=\"suDownload()\">Download code file<\/button>':'')+'<\/div><\/section>'+\n '<section class=\"panel\"><h2>Setup (about 10 minutes, once only)<\/h2><ol class=\"rules\">'+\n '<li>Using the shop Google account, open <b>sheets.new<\/b> to start a new Google Sheet, and name it \"'+esc(v.name)+' member sign-up\".<\/li>'+\n '<li>In the sheet menu choose <b>Extensions > Apps Script<\/b>.<\/li>'+\n '<li>Delete everything in the editor, press Copy code above, paste it in, then press Save (the disk icon).<\/li>'+\n '<li>At the top right, click <b>Deploy > New deployment<\/b> → gear: Web app → Execute as: Me → Who has access: <b>Anyone<\/b> → Deploy. The first time, authorise: Review permissions → choose account → Advanced → Go to (unsafe) → Allow.<\/li>'+\n '<li>Copy the Web app address (it ends with /exec), paste it in the QR box below and press Generate QR code.<\/li>'+\n '<li>Go back to the Google Sheet, copy the address at the top of the browser, paste it into Responses sheet link at the bottom and press Sync sign-ups once.<\/li><\/ol>'+\n '<p class=\"small muted\">If you change the shop name or phone later: copy and paste the code again, then Deploy → Manage deployments → Edit (pencil) → Version: New version → Deploy. The address and QR code stay the same.<\/p><\/section><\/div>'+\n qrPanel('cloud','Paste the web app address','https://script.google.com/macros/s/…/exec')+\n '<section class=\"panel\"><h2>Step 2: let the system read new sign-ups<\/h2>'+gsPanel()+'<\/section>';\n}\n/* new sign-ups notice: watches the responses sheet (read-only, never asks) */\nlet GSW=null,GSWID='';\nfunction gsCountNew(csv){const rows=parseCSV(csv);if(rows.length<2)return 0;const h=rows[0].map(x=>String(x).toLowerCase());\n const pi=h.findIndex(x=>/电话|手机|phone|telefon/.test(x)),si=h.findIndex(x=>/状态|status/.test(x));if(pi<0)return 0;\n const seen=new Set(S.members.map(m=>String(m.phone||'').replace(/\\D/g,'')));const got=new Set();let n=0;\n rows.slice(1).forEach(r=>{const d=String(r[pi]||'').replace(/\\D/g,'');const st=si>=0?String(r[si]||'').trim():'';if(d.length<9||seen.has(d)||got.has(d))return;if(si>=0&&st&&!['Pending','Pending','Menunggu'].includes(st))return;got.add(d);n++});return n}\nfunction gsWatchStart(){const id=gsId(S.settings.gsheetUrl||'');if(!session||!id||GSWID===id)return;GSWID=id;\n getMCP().then(mcp=>{if(!mcp||!mcp.watchTool||GSWID!==id)return;if(GSW){try{GSW()}catch(e){}}\n  GSW=mcp.watchTool('Google Drive','download_file_content',{fileId:id,exportMimeType:'text/csv'},ev=>{\n   if(ev.type==='data'){const csv=mcpCSV(ev.result);if(csv==null)return;const n=gsCountNew(csv);if(n!==UI.gsNew){UI.gsNew=n;if(session)render()}}\n   else{const c=ev.error&&ev.error.code;if(['needs_reauth','server_not_connected','not_in_manifest','approval_required','blocked_by_policy','consent_required','not_granted','capability_disabled','bad_request'].includes(c)){if(UI.gsNew){UI.gsNew=0;if(session)render()}}}\n  },{cache:{staleTime:120000,gcTime:600000},refetchInterval:300000})})}\nfunction gsGo(){location.hash='import';setTimeout(gsSync,350)}\nfunction gsBanner(){const n=UI.gsNew||0;return n?'<section class=\"panel gsnew\"><div><b>'+n+' <\/b> customers signed up online and are waiting to become members.<\/div><button class=\"btn btn-teal\" onclick=\"gsGo()\">Review and add<\/button><\/section>':''}\n\nconst TOWNS={\"Kedah\": [\"Alor Setar\", \"Sungai Petani\", \"Kulim\", \"Jitra\", \"Langkawi\", \"Yan\", \"Gurun\", \"Pendang\", \"Kuala Kedah\", \"Baling\", \"Pokok Sena\", \"Kuala Nerang\", \"Sik\", \"Bandar Baharu\", \"Kota Kuala Muda\"], \"Perlis\": [\"Kangar\", \"Arau\", \"Padang Besar\", \"Kuala Perlis\", \"Simpang Empat\", \"Beseri\", \"Chuping\"], \"Pulau Pinang\": [\"Bukit Mertajam\", \"Butterworth\", \"George Town\", \"Nibong Tebal\", \"Kepala Batas\", \"Bayan Lepas\", \"Balik Pulau\", \"Seberang Jaya\", \"Simpang Ampat\", \"Permatang Pauh\", \"Air Itam\", \"Jawi\"], \"Perak\": [\"Ipoh\", \"Taiping\", \"Teluk Intan\", \"Sitiawan\", \"Kampar\", \"Batu Gajah\", \"Kuala Kangsar\", \"Parit Buntar\", \"Bagan Serai\", \"Lumut\", \"Tapah\", \"Bagan Datuk\", \"Slim River\", \"Tanjung Malim\", \"Sungai Siput\", \"Gerik\", \"Seri Iskandar\", \"Hutan Melintang\"], \"Selangor\": [\"Sekinchan\", \"Sungai Besar\", \"Sabak Bernam\", \"Tanjong Karang\", \"Kuala Selangor\", \"Klang\", \"Banting\", \"Rawang\", \"Kajang\", \"Shah Alam\", \"Petaling Jaya\", \"Semenyih\", \"Kuala Kubu Bharu\", \"Batang Kali\", \"Sepang\", \"Puchong\", \"Subang Jaya\"], \"Negeri Sembilan\": [\"Seremban\", \"Nilai\", \"Port Dickson\", \"Rembau\", \"Kuala Pilah\", \"Tampin\", \"Bahau\", \"Gemas\", \"Jelebu\", \"Senawang\", \"Lukut\", \"Mantin\"], \"Melaka\": [\"Bandar Melaka\", \"Alor Gajah\", \"Jasin\", \"Masjid Tanah\", \"Ayer Keroh\", \"Merlimau\", \"Batu Berendam\", \"Bukit Beruang\", \"Sungai Udang\"], \"Johor\": [\"Johor Bahru\", \"Batu Pahat\", \"Muar\", \"Kluang\", \"Segamat\", \"Pontian\", \"Kulai\", \"Kota Tinggi\", \"Yong Peng\", \"Tangkak\", \"Mersing\", \"Labis\", \"Skudai\", \"Pasir Gudang\", \"Simpang Renggam\", \"Ayer Hitam\"], \"Pahang\": [\"Kuantan\", \"Temerloh\", \"Bentong\", \"Raub\", \"Mentakab\", \"Jerantut\", \"Pekan\", \"Kuala Lipis\", \"Cameron Highlands\", \"Karak\", \"Maran\", \"Bera\", \"Rompin\", \"Muadzam Shah\"], \"Terengganu\": [\"Kuala Terengganu\", \"Kemaman\", \"Dungun\", \"Marang\", \"Besut\", \"Jerteh\", \"Setiu\", \"Kuala Berang\", \"Kerteh\", \"Chukai\", \"Paka\"], \"Kelantan\": [\"Kota Bharu\", \"Pasir Mas\", \"Tanah Merah\", \"Machang\", \"Kuala Krai\", \"Gua Musang\", \"Tumpat\", \"Pasir Puteh\", \"Bachok\", \"Jeli\", \"Rantau Panjang\", \"Ketereh\"], \"Sabah\": [\"Kota Kinabalu\", \"Sandakan\", \"Tawau\", \"Lahad Datu\", \"Keningau\", \"Semporna\", \"Kudat\", \"Beaufort\", \"Ranau\", \"Papar\", \"Tenom\", \"Kota Belud\", \"Kinabatangan\", \"Penampang\"], \"Sarawak\": [\"Kuching\", \"Miri\", \"Sibu\", \"Bintulu\", \"Sri Aman\", \"Sarikei\", \"Kapit\", \"Mukah\", \"Limbang\", \"Betong\", \"Serian\", \"Bau\", \"Lawas\", \"Saratok\"], \"W.P. Kuala Lumpur\": [\"Cheras\", \"Kepong\", \"Setapak\", \"Sentul\", \"Bangsar\", \"Wangsa Maju\", \"Segambut\", \"Bukit Jalil\", \"Sri Petaling\", \"Batu\"], \"W.P. Putrajaya\": [\"Putrajaya\"], \"W.P. Labuan\": [\"Labuan\"]};\n\nfunction townSuggest(changed){const s=$('#fs'),t=$('#ft');if(!s||!t)return;const list=TOWNS[s.value]||[];\n if(changed){const v=t.value.trim();if(v&&list.indexOf(v)<0&&Object.keys(TOWNS).some(k=>TOWNS[k].indexOf(v)>=0))t.value=''}\n const dl=$('#ftl');if(dl)dl.innerHTML=list.map(x=>'<option value=\"'+esc(x)+'\">').join('');\n t.placeholder=list.length?'e.g. '+list[0]:'';\n const ch=$('#ftchips');if(ch)ch.innerHTML=list.slice(0,8).map(x=>'<button type=\"button\" class=\"'+(t.value===x?'on':'')+'\" onclick=\"townPick(this)\">'+esc(x)+'<\/button>').join('')}\nfunction townPick(b){const t=$('#ft');if(t){t.value=b.textContent;townMark()}}\ntry{new MutationObserver(()=>{const c=document.getElementById('ftchips');if(c&&!c.dataset.init){c.dataset.init='1';townSuggest(false)}}).observe(document.body,{childList:true,subtree:true})}catch(e){}\nfunction townMark(){const t=$('#ft');document.querySelectorAll('#ftchips button').forEach(b=>b.classList.toggle('on',!!t&&b.textContent===t.value))}\n\n/* ============ Downloads (optional capability) ============ */\nlet DL=null,LASTCSV=null;\n(async()=>{try{if(window.claude&&claude.use)DL=await claude.use('downloads')}catch(e){DL=null}if(DL&&session&&/signup/.test(location.hash))render()})();\nasync function saveFile(name,data){\n if(!DL){toast('Download is not available here. Please use Copy.');return}\n try{await DL.save({filename:name,data});toast('Downloaded '+name)}\n catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast('Please wait a moment and try again.');return}toast('Download is not available right now. Please use Copy.')}\n}\nfunction copyStr(s){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(()=>toast('Copied')).catch(()=>toast('Copy failed. Please select it manually'));else toast('Copy failed. Please select it manually')}\n\n/* ============ Member sign-up (QR) ============ */\nfunction srcText(id){const el=document.getElementById(id);return el?el.textContent.replace(/^\\n/,'').replace(/<\\\\\\/script/g,'<\\/script'):''}\nconst SG_FLOW='<ol class=\"flow\"><li><b>Member scans<\/b><span>QR poster at the shop<\/span><\/li><li><b>Fills in on phone<\/b><span>Name, nickname, phone, area<\/span><\/li><li><b>Saved to Google Sheets<\/b><span>Data is in the cloud, not lost<\/span><\/li><li><b>Admin checks<\/b><span>Imports via “Import / Export”<\/span><\/li><li><b>Becomes a member<\/b><span>Starts earning points<\/span><\/li><\/ol>';\nfunction vSignup(){\n const t=UI.sgtab;\n return '<div class=\"page-head\"><div><h1>Member Sign-up<\/h1><p>Members scan the QR code and sign up on their phone. Data goes to Google Sheets first, then Admin checks and imports it into the system.<\/p><\/div><\/div>'+\n '<div class=\"tabs\" role=\"tablist\"><button class=\"tab'+(t==='cloud'?' on':'')+'\" onclick=\"UI.sgtab=\\'cloud\\';render()\">Option 1: Sign-up web page (recommended)<\/button><button class=\"tab'+(t==='auto'?' on':'')+'\" onclick=\"UI.sgtab=\\'auto\\';render()\">Option 2: Auto-made Google Form<\/button><button class=\"tab'+(t==='form'?' on':'')+'\" onclick=\"UI.sgtab=\\'form\\';render()\">Option 3: Make your own Google Form<\/button><\/div>'+\n '<section class=\"panel\"><h2>Sign-up flow<\/h2>'+SG_FLOW+'<\/section>'+(t==='auto'?sgAuto():t==='form'?sgForm():sgCloud());\n}\nfunction sgForm(){\n const q=[['Name','Short answer','Yes'],['Nickname','Short answer','No'],['Phone','Short answer','Yes'],['State','Drop-down','Yes'],['Town / Area','Short answer','Yes']];\n return '<div class=\"cols\"><section class=\"panel\"><h2>Setup steps (about 10 minutes)<\/h2><ol class=\"rules\">'+\n '<li>Using the shop Google account, open <b>forms.google.com<\/b>, create a “Blank form” and title it “'+esc(COMPANY.name)+' Member Sign-up”.<\/li>'+\n '<li>Add the 5 questions in the table on the right. <b>Question names must match exactly<\/b>, so the system recognises them when importing.<\/li>'+\n '<li>For “State” choose Drop-down. Click the button below to copy the state list and paste it into the first option. It becomes 13 options automatically.<\/li>'+\n '<li>Go to “Settings > Responses” and <b>do not<\/b> turn on “Limit to 1 response”, so members without a Google account can still fill it in.<\/li>'+\n '<li>Click “Send” (top right) > link icon > tick “Shorten URL” > Copy, and paste it in the box below.<\/li>'+\n '<li>Go to “Responses” > “View in Sheets”. Sign-ups go into the sheet automatically.<\/li>'+\n '<li>To import: in the sheet, “File > Download > CSV”, then go to <a href=\"#import\">Import / Export<\/a>, choose that file, check and import.<\/li><\/ol>'+\n '<div><button class=\"btn btn-ghost btn-sm\" onclick=\"copyStr(STATES.join(\\'\\\\n\\'))\">Copy State List<\/button><\/div><\/section>'+\n '<section class=\"panel\"><h2>Form questions<\/h2><div class=\"tbl-wrap\"><table><thead><tr><th>Question name<\/th><th>Type<\/th><th>Required<\/th><\/tr><\/thead><tbody>'+q.map(r=>'<tr><td><b>'+r[0]+'<\/b><\/td><td>'+r[1]+'<\/td><td>'+r[2]+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div><p class=\"small muted\">Pros: no code, ready to use right away. Cons: the page uses Google styling, and it cannot block the same phone signing up twice (duplicates are only caught when importing).<\/p><\/section><\/div>'+\n qrPanel('form','Paste Google Form link','https://forms.gle/…');\n}\nfunction qrPanel(k,label,ph){\n const url=S.settings[k+'Url']||'';\n return '<section class=\"panel\"><h2>QR Poster<\/h2><div class=\"sg-link\"><label class=\"f\" style=\"flex:1\">'+label+'<input id=\"sgurl-'+k+'\" value=\"'+esc(url)+'\" placeholder=\"'+ph+'\" inputmode=\"url\"'+(isAdmin()?'':' readonly')+'><\/label>'+(isAdmin()?'<button class=\"btn btn-teal\" onclick=\"saveSgUrl(\\''+k+'\\')\">Generate QR Code<\/button>':'<span class=\"small muted\">Only Admin can set the QR link.<\/span>')+'<\/div><div id=\"sgerr-'+k+'\" class=\"err\" hidden><\/div>'+\n (url?'<div class=\"sg-out\"><div class=\"poster\"><div class=\"poster-top\">'+LEAF+'<span>'+esc(COMPANY.name)+'<\/span><\/div><div class=\"poster-body\"><h3>Scan to become a member<\/h3><p>Free to join · Earn points on every purchase<\/p><div class=\"qr-box\" id=\"sgqr\"><\/div><p class=\"small muted\">Phone '+esc(COMPANY.phone)+'<\/p><\/div><\/div><div class=\"sg-side\"><p class=\"small muted\">The poster prints like this. Put it at the counter, next to the cashier, or share it in WhatsApp groups.<\/p><p class=\"small\" style=\"word-break:break-all\">'+esc(url)+'<\/p><div class=\"actions\">'+(DL?'<button class=\"btn btn-blue\" onclick=\"downloadPoster()\">Download Poster Image<\/button>':'')+'<button class=\"btn btn-ghost\" onclick=\"copyStr(S.settings.'+k+'Url)\">Copy Link<\/button><a class=\"btn btn-ghost\" href=\"'+esc(url)+'\" target=\"_blank\" rel=\"noopener\">Open to Test<\/a><\/div>'+(DL?'':'<p class=\"small muted\">Image download is not available here. Take a screenshot of the poster instead.<\/p>')+(k==='cloud'?'<details class=\"qrhelp\"><summary>QR code does not open the sign-up page?<\/summary><ol><li>When deploying, Who has access must be Anyone, not Only myself.<\/li><li>The address must end with /exec; one ending with /dev only opens for you.<\/li><li>After changing the code, deploy a New version so customers see the new page.<\/li><\/ol><\/details>':'<details class=\"qrhelp\"><summary>QR code does not open the form?<\/summary><ol><li>In Google Forms, press Publish at the top right. A new form that is not published cannot be seen by customers.<\/li><li>Next to Publish, open Responders and choose Anyone with the link.<\/li><li>On the Responses tab, make sure Accepting responses is turned on.<\/li><li>The link you paste must be forms.gle or end with /viewform, not /edit.<\/li><li>After fixing, tap Open test on your phone or scan again with the camera. If the phone is signed in to another Google account, try an incognito tab.<\/li><\/ol><\/details>')+'<\/div><\/div>':'<div class=\"empty\">After you paste the link, a printable QR poster appears here.<\/div>')+'<\/section>';\n}\nfunction saveSgUrl(k){if(!isAdmin()){toast('Only Admin can make changes.');return}const v=$('#sgurl-'+k).value.trim();const e=$('#sgerr-'+k);\n if(!/^https:\\/\\/\\S+$/.test(v)){e.textContent='The link must start with https://. Please copy the full link from Google.';e.hidden=false;return}\n if(k==='cloud'&&!/^https:\\/\\/script\\.google\\.com\\/.+\\/exec(\\?.*)?$/.test(v)){e.textContent='The web app address must end with /exec. Copy it from Deploy → Manage deployments in Apps Script.';e.hidden=false;return}let v2=v;const em=v.match(/^https:\\/\\/docs\\.google\\.com\\/forms\\/(u\\/\\d+\\/)?d\\/(?!e\\/)([\\w-]+)\\/(edit|prefill)[^]*$/);if(em){v2='https://docs.google.com/forms/d/'+em[2]+'/viewform';toast('That was the form EDIT link, which customers cannot open. It has been changed to the fill-in link.')}S.settings[k+'Url']=v2;log('\\u8bbe\\u5b9a\\u62a5\\u540d\\u94fe\\u63a5',(k==='form'?'Google Form':'Cloud sign-up page')+': '+v2);save();render();if(!em)toast('QR code generated')}\nfunction afterSignup(){\n const g=$('#code-gs'),i=$('#code-idx');if(g)g.value=srcText('src-gs');if(i)i.value=srcText('src-idx');\n const url=S.settings[UI.sgtab+'Url'],box=$('#sgqr');\n if(url&&box){try{if(window.QRCode)new QRCode(box,{text:url,width:480,height:480,colorDark:'#153A5A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else box.innerHTML='<p class=\"small\" style=\"color:#153A5A;padding:20px\">QR tool failed to load. Please refresh the page.<\/p>'}catch(e){}}\n}\nfunction downloadPoster(){\n const qc=$('#sgqr canvas');if(!qc){toast('QR code not generated yet');return}\n const W=900,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');\n const F='\"Noto Sans SC\",\"Inter\",\"PingFang SC\",\"Microsoft YaHei\",sans-serif';\n x.fillStyle='#ffffff';x.fillRect(0,0,W,H);x.fillStyle='#153A5A';x.fillRect(0,0,W,170);\n x.fillStyle='#ffffff';x.textAlign='center';x.font='700 56px '+F;x.fillText(COMPANY.name,W/2,108);\n x.fillStyle='#17293A';x.font='700 72px '+F;x.fillText('Scan to become a member',W/2,290);\n x.fillStyle='#0F807B';x.font='500 36px '+F;x.fillText('Free to join · Earn points on every purchase',W/2,350);\n x.imageSmoothingEnabled=false;x.drawImage(qc,(W-560)/2,400,560,560);\n x.fillStyle='#566878';x.font='500 34px '+F;x.fillText('Questions? Contact '+COMPANY.phone,W/2,1050);\n x.fillStyle='#0F807B';x.fillRect(0,H-24,W,24);\n c.toBlob(b=>{if(b)saveFile(COMPANY.name+'-member-signup-QR.png',b)},'image/png');\n}\n\n/* ============ Backup ============ */\nfunction vBackup(){\n const rows=S.backups.map(b=>'<tr><td class=\"nw\">'+esc(b.at)+'<\/td><td>'+(b.kind==='auto'?'<span class=\"pill info\">Monthly auto<\/span>':'<span class=\"pill line\">Manual<\/span>')+'<\/td><td class=\"r\">'+b.members+'<\/td><td class=\"r\">'+b.sales+'<\/td><td class=\"r nw\"><button class=\"btn btn-ghost btn-sm\" onclick=\"showBackup(\\''+b.id+'\\')\">View Data<\/button> <button class=\"btn btn-ghost btn-sm\" onclick=\"restoreBackup(\\''+b.id+'\\')\">Restore<\/button><\/td><\/tr>').join('');\n return '<div class=\"page-head\"><div><h1>Backup<\/h1><p>The system backs up automatically the first time it opens each month and keeps the latest 12. Restoring does not delete the audit log.<\/p><\/div><div class=\"actions\"><button class=\"btn btn-blue\" onclick=\"makeBackup(\\'manual\\');log(\\'\\u624b\\u52a8\\u5907\\u4efd\\',\\'\\');save();render();toast(\\'Backup created\\')\">Back Up Now<\/button><\/div><\/div>'+\n '<section class=\"panel\">'+(rows?'<div class=\"tbl-wrap\"><table><thead><tr><th>Created<\/th><th>Type<\/th><th class=\"r\">Member<\/th><th class=\"r\">Sales count<\/th><th><\/th><\/tr><\/thead><tbody>'+rows+'<\/tbody><\/table><\/div>':'<div class=\"empty\">No backups yet.<\/div>')+'<\/section>'+\n '<section class=\"panel\"><h2>Sample data<\/h2><p class=\"small muted\">Reset the system to the original sample members and sales. Useful for starting over after testing.<\/p><div><button class=\"btn btn-ghost\" onclick=\"resetDemo()\">Reset to Sample Data<\/button><\/div><p class=\"small muted\" style=\"margin-top:14px\">Delete all members, sales and redemptions to get ready for your real customer data. Products, tier settings and user accounts are kept.<\/p><div><button class=\"btn btn-red\" onclick=\"clearMembers()\">Clear Members & Sales<\/button><\/div><\/section>'+\n '<p class=\"note\">This is a trial version: data is stored only in this computer’s browser. For real use, it needs to connect to a company database or cloud server so backups are saved somewhere safe automatically.<\/p>';\n}\nfunction showBackup(id){const b=S.backups.find(x=>x.id===id);openModal('Backup '+b.at,'<p class=\"small muted\">Copy it and save as a .json file to keep separately.<\/p><textarea id=\"bkout\" rows=\"12\" readonly>'+esc(b.data)+'<\/textarea>','<button class=\"btn btn-ghost\" onclick=\"closeModal()\">Close<\/button><button class=\"btn btn-blue\" onclick=\"copyText(\\'bkout\\')\">Copy<\/button>',true)}\nfunction restoreBackup(id){const b=S.backups.find(x=>x.id===id);confirmBox('Restore Backup','Data will go back to the state of <b>'+esc(b.at)+'<\/b> ('+b.members+' members, '+b.sales+' sales). Anything added after that will be lost.','Confirm Restore',()=>{const d=JSON.parse(b.data);const keep={backups:S.backups,audit:S.audit,users:S.users};S={...d,...keep};ensureUsers();if(!S.nickZh){const NZ={'Ah Ming':'\\u963f\\u660e','Sis Mei Ling':'\\u7f8e\\u73b2\\u59d0','Ah Keong':'\\u963f\\u5f3a','Lee Fong':'\\u4e3d\\u82b3','Ah Hoe':'\\u963f\\u8c6a','Bro Huat':'\\u53d1\\u54e5','Ah Kok':'\\u56fd\\u4ed4','Sis Sook Fun':'\\u6dd1\\u82ac\\u59d0','Ah Kiat':'\\u963f\\u6770','Poh Choo':'\\u5b9d\\u73e0','Ah Wei':'\\u963f\\u4f1f','Guat Ngoh':'\\u6708\\u5a25','Uncle Hock':'\\u798f\\u4f2f','Sis Kim Lian':'\\u91d1\\u83b2\\u59d0','Bro Loong':'\\u9f99\\u54e5','Ah Leong':'\\u963f\\u826f','Tai Seng':'\\u5927\\u6210','Geok Moy':'\\u7389\\u6885','Keong Boy':'\\u5fd7\\u5f3a\\u4ed4'};S.members.forEach(m=>{if(m.nick&&NZ[m.nick])m.nick=NZ[m.nick]});S.nickZh=true}log('\\u6062\\u590d\\u5907\\u4efd',b.at);save();render();toast('Backup restored')},true)}\nfunction clearMembers(){confirmBox('Clear Members & Sales','All members, sales and redemptions will be deleted and cannot be recovered. Click “Back Up Now” first.','Confirm Clear',()=>{const n=S.members.length;S.members=[];S.sales=[];S.redemptions=[];S.pendingImports=[];S.seq.M=0;S.seq.S=0;S.seq.R=0;S.settings.firstImportDone=false;S.settings.importLocked=false;log('\\u6e05\\u7a7a\\u4f1a\\u5458\\u8d44\\u6599',n+' members');save();render();toast('Cleared. You can import your customer data now.')},true)}\nfunction resetDemo(){confirmBox('Reset Sample Data','All members, sales, redemptions, backups and logs will be replaced with sample data.','Confirm Reset',()=>{const sess=session,us=S.users;seedData();S.users=us;ensureUsers();if(!S.nickZh){const NZ={'Ah Ming':'\\u963f\\u660e','Sis Mei Ling':'\\u7f8e\\u73b2\\u59d0','Ah Keong':'\\u963f\\u5f3a','Lee Fong':'\\u4e3d\\u82b3','Ah Hoe':'\\u963f\\u8c6a','Bro Huat':'\\u53d1\\u54e5','Ah Kok':'\\u56fd\\u4ed4','Sis Sook Fun':'\\u6dd1\\u82ac\\u59d0','Ah Kiat':'\\u963f\\u6770','Poh Choo':'\\u5b9d\\u73e0','Ah Wei':'\\u963f\\u4f1f','Guat Ngoh':'\\u6708\\u5a25','Uncle Hock':'\\u798f\\u4f2f','Sis Kim Lian':'\\u91d1\\u83b2\\u59d0','Bro Loong':'\\u9f99\\u54e5','Ah Leong':'\\u963f\\u826f','Tai Seng':'\\u5927\\u6210','Geok Moy':'\\u7389\\u6885','Keong Boy':'\\u5fd7\\u5f3a\\u4ed4'};S.members.forEach(m=>{if(m.nick&&NZ[m.nick])m.nick=NZ[m.nick]});S.nickZh=true}session=sess;makeBackup('auto');log('\\u91cd\\u7f6e\\u793a\\u4f8b\\u8d44\\u6599','');save();render();toast('Reset done')},true)}\n\n/* ============ Audit ============ */\nfunction vAudit(){\n const users=[...new Set(S.audit.map(a=>a.user))];\n return '<div class=\"page-head\"><div><h1>Audit Log<\/h1><p>Records every add, delete, purchase, redemption, import, settings change and login.<\/p><\/div><\/div><section class=\"panel\"><div class=\"filters\" style=\"grid-template-columns:2fr 1fr\"><input id=\"aq\" placeholder=\"Search action or details\" value=\"'+esc(UI.aq)+'\" oninput=\"UI.aq=this.value;drawAudit()\"><select id=\"auser\" onchange=\"UI.auser=this.value;drawAudit()\"><option value=\"\">All users<\/option>'+users.map(u=>'<option value=\"'+esc(u)+'\"'+(UI.auser===u?' selected':'')+'>'+esc(USERS[u]?D(USERS[u].name):u)+'<\/option>').join('')+'<\/select><\/div><div id=\"atable\">'+auditTable()+'<\/div><\/section>';\n}\nfunction drawAudit(){$('#atable').innerHTML=auditTable()}\nfunction auditTable(){const q=UI.aq.trim().toLowerCase();const l=S.audit.filter(a=>(!UI.auser||a.user===UI.auser)&&(!q||(a.action+a.detail).toLowerCase().includes(q))).slice().reverse();\n if(!l.length)return '<div class=\"empty\">No matching records.<\/div>';\n return '<p class=\"small muted\">Total '+l.length+' entries (showing latest 400)<\/p><div class=\"tbl-wrap\"><table><thead><tr><th>Time<\/th><th>User<\/th><th>Action<\/th><th>Details<\/th><\/tr><\/thead><tbody>'+l.slice(0,400).map(a=>'<tr><td class=\"nw num\">'+esc(a.at)+'<\/td><td class=\"nw\">'+esc(USERS[a.user]?D(USERS[a.user].name):a.user)+'<\/td><td class=\"nw\"><b>'+esc(D(a.action))+'<\/b><\/td><td>'+esc(DA(a.detail))+'<\/td><\/tr>').join('')+'<\/tbody><\/table><\/div>'}\n\n/* ============ Public landing page ============ */\nconst COMPANY={name:'MA PLANTATION 永發肥料企業',en:'(MA PLANTATION 永發肥料企業)',phone:'012-345 6789',wa:'60123456789',addr:'No. 12, Jalan Pasar Baru, 45300 Sungai Besar, Selangor',hours:'Mon – Sat 8:00am – 6:00pm · Sun 8:00am – 12:30pm'};\nfunction renderSite(){\n const fert=Object.keys(FERT_TYPES).map(k=>{const ps=S.products.filter(p=>p.kind==='fert'&&p.cat===k);return ps.length?'<div class=\"cat\"><h3>'+D(k)+'<\/h3><p class=\"small muted\">'+D(FERT_TYPES[k])+'<\/p><ul>'+ps.map(p=>'<li>'+esc(D(p.name))+'<\/li>').join('')+'<\/ul><\/div>':''}).join('');\n const pest=Object.keys(PEST_GRADES).map(k=>{const ps=S.products.filter(p=>p.kind==='pest'&&p.grade===k);return ps.length?'<div class=\"cat\"><h3>'+D(k)+'<\/h3><p class=\"small muted\">'+D(PEST_GRADES[k])+'<\/p><ul>'+ps.map(p=>'<li>'+esc(D(p.name))+' ('+esc(D(p.cat))+')<\/li>').join('')+'<\/ul><\/div>':''}).join('');\n $('#root').innerHTML='<div class=\"site\"><header class=\"site-top site-band\"><div class=\"site-in\"><div class=\"brand\"><div class=\"brand-mark\">'+LEAF+'<\/div><div><div class=\"brand-name\">MA PLANTATION<small>永發肥料企業<\/small><\/div><div class=\"brand-sub\">'+COMPANY.en+'<\/div><\/div><\/div><div class=\"site-lang\">'+LANGBAR('site')+'<a href=\"#dashboard\" class=\"small\">Member system login →<\/a><\/div><\/div><\/header>'+\n '<section class=\"site-hero site-band\"><div class=\"site-in\"><div class=\"hero-copy\"><span class=\"small\" style=\"letter-spacing:.08em;color:var(--side-muted)\">Fertilizers · Pesticides · Crop advice<\/span><h1>Good harvests start with the right fertilizer<\/h1><p>We supply compound, specialty and organic fertilizers and pesticides of every grade to paddy farmers, oil palm growers and vegetable farmers, and recommend the right mix for your crop and soil. Members earn points on every purchase and can redeem them for cash discounts anytime.<\/p><\/div>'+\n '<div class=\"contact-card\"><h2>Order by phone / WhatsApp<\/h2><div class=\"phone\" id=\"phone\">'+COMPANY.phone+'<\/div><div class=\"actions\"><button class=\"btn btn-teal\" onclick=\"copySitePhone()\">Copy Phone Number<\/button><a class=\"btn btn-ghost\" href=\"https://wa.me/'+COMPANY.wa+'?text='+encodeURIComponent('Hello, I would like to ask about fertilizers and pesticides')+'\" target=\"_blank\" rel=\"noopener\">Open WhatsApp<\/a><\/div><div class=\"qr-box\" id=\"qr\" aria-label=\"WhatsApp order QR code\"><\/div><p class=\"small muted\" style=\"text-align:center\">Scan the QR code with your phone to order from us on WhatsApp<\/p><\/div><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Fertilizers (by application type)<\/h2><div class=\"site-cats\">'+fert+'<\/div><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Pesticides (by grade)<\/h2><div class=\"site-cats\">'+pest+'<\/div><p class=\"small muted\">All pesticides are registered products. Read the label before use and follow the recommended dosage.<\/p><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Member Points<\/h2><div class=\"site-cats\">'+S.tiers.map(t=>'<div class=\"cat\"><h3 style=\"color:var('+t.color+')\">'+D(t.name)+'<\/h3><p>Total spend: '+(t.min?''+RM(t.min):'any amount')+'<\/p><p class=\"small muted\">Every 1,000 pts = '+RM(1000*t.rate)+'<\/p><\/div>').join('')+'<\/div><p class=\"small muted\">Earn '+S.settings.earn+' pt(s) per RM 1 spent · Points and membership valid for 2 years<\/p><\/div><\/section>'+\n '<section class=\"site-sec site-band\"><div class=\"site-in\"><h2>Shop address<\/h2><div class=\"cat\"><p><b>'+COMPANY.addr+'<\/b><\/p><p class=\"small muted\">'+COMPANY.hours+'<\/p><\/div><\/div><\/section>'+\n '<footer class=\"site-foot site-band\"><div class=\"site-in\">© '+new Date().getFullYear()+' '+COMPANY.name+' '+COMPANY.en+' · Demo website, company details are samples<\/div><\/footer><\/div>';\n try{if(window.QRCode)new QRCode(document.getElementById('qr'),{text:'https://wa.me/'+COMPANY.wa+'?text='+encodeURIComponent('Hello, I would like to order fertilizer/pesticide'),width:360,height:360,colorDark:'#153A5A',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});else $('#qr').innerHTML='<p class=\"small\" style=\"color:#153A5A\">QR code loading. Please refresh in a moment.<\/p>'}catch(e){}\n window.scrollTo(0,0);\n}\nfunction copySitePhone(){const t=COMPANY.phone;if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copied '+t)).catch(()=>{selectEl($('#phone'));toast('Press Ctrl+C to copy')});else{selectEl($('#phone'));toast('Press Ctrl+C to copy')}}\n\nrender();\nmaSbPull(function(remote){MA_SYNCED=true;if(remote){S=remote;if(S.users)USERS=S.users;ensureUsers();render()}else{maSbPush()}});\n<\/script>\n\n"};
